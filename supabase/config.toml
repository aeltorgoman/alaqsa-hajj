# ════════════════════════════════════════════════════════════
# إعداد مشروع Supabase CLI — أساسُ نقطة التفتيش ٣
# ════════════════════════════════════════════════════════════
# المرجع: https://supabase.com/docs/guides/local-development/cli/config
# الإصدارُ المفترَض: CLI 2.117.0 (مثبَّتٌ في package.json)
#
# ⚠️ **قاعدةُ هذا الملفّ: أدنى إعدادٍ صريح.** لا يُذكر مفتاحٌ إلا
# إن كان (أ) مخالفاً لافتراض الـCLI، أو (ب) قيمةً خاصّةً بهذا
# المشروع يجب أن تبقى مثبَّتةً ولو تبدّل الافتراض. وما عدا ذلك
# يُترك للافتراض القانونيّ — فإعادةُ كتابة الافتراض تُوهم بقرارٍ
# لم يُتَّخذ، وتصير ديناً يُراجَع في كلّ ترقية.
#
# ⚠️ ولا سرَّ هنا: لا كلمة مرور، ولا رمز وصول، ولا مفتاح خدمة،
# ولا سلسلة اتصال، ولا **مرجع المشروع البعيد**. و`project_id`
# أدناه اسمٌ محلّيٌّ يميّز حاويات هذا المشروع على جهاز المطوّر
# لا غير؛ ومرجعُ المشروع البعيد يُخزَّن في `supabase/.temp/`
# بعد `link` وهو مُتجاهَلٌ في git.

project_id = "alaqsa-hajj"

# ── القاعدة ──────────────────────────────────────────────────
[db]
# ⚠️ **مذكورٌ رغم موافقته افتراضَ 2.117.0**، لأنه ليس تفضيلاً بل
# قيمةٌ يجب أن تساوي محرّكَ الإنتاج: `postgres_engine = 17`.
# وافتراضُ الـCLI يتقدّم مع إصداراته، فلو ترك لَصار يوماً ١٨
# بصمتٍ وبطل برهانُ إعادة الإنتاج في نقطة ٤ بلا إنذار.
major_version = 17

# ── الهوية ───────────────────────────────────────────────────
# ⚠️ **مخالفةٌ حقيقيةٌ للافتراض** (`true` في الـCLI): التسجيلُ
# الذاتيُّ مغلقٌ في الإنتاج منذ س٠، ولا يجوز أن تكون البيئةُ
# المحلّيةُ أرخى منه. المستخدمون يُنشَؤون عبر `user-admin` وحدها
# خلف صلاحية `manage_users`.
[auth]
enable_signup = false
# موافقٌ للافتراض، ويبقى مذكوراً لأنه سطحُ دخولٍ أمنيّ: انقلابُه
# يفتح دخولاً مجهولاً، وانقلابٌ كهذا لا يجوز أن يمرّ ضمناً.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

# ════════════════════════════════════════════════════════════
# دوالّ الحافّة — `verify_jwt`
# ════════════════════════════════════════════════════════════
# ⚠️ هذا القسمُ هو ما يقرأه `supabase functions deploy` ليضبط
# بوابةَ كلّ دالّة. و`true` موافقٌ لافتراض الـCLI اليوم، ومع ذلك
# **تُذكر الدوالُّ الخمسُ صراحةً**: `verify_jwt` هي الساقُ الأولى
# من النمط الثلاثيّ المُلزِم (ق٥ · Security Architecture §٧.٢)،
# ووضعٌ أمنيٌّ موروثٌ من افتراضٍ ليس وضعاً معلَناً. فلو تبدّل
# الافتراضُ يوماً لَانفتحت خمسُ دوالّ إداريّةٍ بلا بوابة، صامتةً.
# و«الصريحُ يسبق الضمنيّ» قاعدةٌ مقرَّرةٌ في دليل الهندسة.

[functions.Scan-passport]
verify_jwt = true

[functions.season-admin]
verify_jwt = true

[functions.send-pilgrim-push]
verify_jwt = true

[functions.user-admin]
verify_jwt = true

[functions.whatsapp-send]
verify_jwt = true

# ⚠️ **المخالفةُ الوحيدة، وهي مقصودة** — نمط البوابة المجهولة
# (ق٦ · §٧.٢): الحاجُّ يفتح مستندَه بلا تسجيل دخول، والهويةُ
# تُثبَت برمز جلسةٍ عبر `verify_pilgrim_session` داخل الدالّة.
# مسجَّلٌ في جرد الوصول المجهول (ج٩) في supabase/README.md،
# ولا يُضاف ثانٍ بلا مراجعةٍ معمارية.
[functions.pilgrim-doc]
verify_jwt = false
