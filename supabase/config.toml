# ════════════════════════════════════════════════════════════
# إعداد مشروع Supabase CLI — أساسُ نقطة التفتيش ٣
# ════════════════════════════════════════════════════════════
# المرجع: https://supabase.com/docs/guides/local-development/cli/config
#
# ⚠️ هذا الملفّ **أدنى إعدادٍ صحيح** لا نسخةٌ كاملة من القالب.
# وكلُّ مفتاحٍ هنا مذكورٌ لأنه **يخالف الافتراض** أو لأن الاعتماد
# عليه ضمناً خطر. وما تُرك محذوفاً فالافتراضُ فيه مقصود.
#
# ⚠️ ولا سرَّ في هذا الملفّ: لا كلمات مرور، ولا رموز وصول، ولا
# مفتاح خدمة، ولا سلسلة اتصال، ولا معرّف المشروع البعيد.
# و`project_id` أدناه **اسمٌ محلّيٌّ** يميّز حاويات هذا المشروع على
# جهاز المطوّر — لا علاقةَ له بمرجع المشروع على Supabase، وذاك
# يُخزَّن في `supabase/.temp/` بعد `link` وهو مُتجاهَلٌ في git.

project_id = "alaqsa-hajj"

# ── الـAPI ───────────────────────────────────────────────────
[api]
enabled = true
schemas = ["public", "graphql_public"]

# ⚠️ `extensions` في مسار البحث شرطٌ بيئيّ لا تفضيل: دوالُّ الهوية
# تستدعي `crypt()` و`gen_salt()` من `pgcrypto` المثبَّت في
# `extensions` (انظر «متطلّب بيئي» في supabase/README.md).
extra_search_path = ["public", "extensions"]

# ⚠️ **مذكورٌ صراحةً وعمداً `true`.** هذا هو مسلك السحابة: كلُّ
# علاقةٍ جديدةٍ ينشئها `postgres` في `public` تنال صلاحيات
# `anon`/`authenticated`/`service_role` بلا GRANT صريح، بسبب
# `ALTER DEFAULT PRIVILEGES` المضبوط في مشاريع Supabase.
# وضبطه `false` محلّياً **أأمن نظرياً وأسوأ عملياً**: تصير البيئةُ
# المحلّيةُ أشدَّ من الإنتاج، فتمرّ ترحيلاتٌ ناقصةُ المنع محلّياً
# ثم تنكشف في الإنتاج. والبيئةُ المحلّية هنا **مرآةٌ للإنتاج** لا
# نسخةٌ محسّنة منه — وعليها يقوم برهانُ خطّ الأساس في نقطة ٤.
auto_expose_new_tables = true

# ── القاعدة ──────────────────────────────────────────────────
[db]
# ⚠️ يطابق محرّك الإنتاج (postgres_engine = 17). وأيّ اختلافٍ هنا
# يُبطل برهانَ إعادة الإنتاج في نقطة ٤.
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

# ── الهوية ───────────────────────────────────────────────────
# ⚠️ التسجيلُ الذاتيُّ **مغلق** — هذه حالةُ الإنتاج منذ س٠، ولا
# يجوز أن تكون البيئةُ المحلّيةُ أرخى منها. المستخدمون يُنشَؤون
# عبر دالّة `user-admin` وحدها، خلف صلاحية `manage_users`.
[auth]
enabled = true
enable_signup = false
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = false

# ── التخزين ──────────────────────────────────────────────────
# ⚠️ الحاويات **لا تُعلَن هنا**. `passengers-docs` و`company-assets`
# تُنشئهما الترحيلاتُ مع سياساتها في معاملةٍ واحدة، وإعلانُها هنا
# أيضاً يخلق مصدرَي حقيقة يتباعدان بصمت. الترحيلُ هو المصدر.
[storage]
enabled = true

# ════════════════════════════════════════════════════════════
# دوالّ الحافّة — `verify_jwt` أخطرُ سطرٍ في هذا الملفّ
# ════════════════════════════════════════════════════════════
# ⚠️ افتراضُ الـCLI هو `verify_jwt = true`. فلو نُشرت الدوالُّ بلا
# هذا القسم لَانقلبت `pilgrim-doc` إلى `true` **فتنكسر بوابةُ
# الحاجّ صامتةً**: الحاجُّ لا يملك JWT بحال. ولَظلّت الأربعُ
# الأخرى صحيحةً بالمصادفة لا بالنصّ — وهذا بعينه ما يجعل القسمَ
# واجباً: الوضعُ الأمنيُّ يُعلَن، لا يُورَث من افتراض.
#
# والنمطُ الثلاثيّ (Security Architecture §٧.٢) يبقى مُلزِماً:
# `verify_jwt = true` **مع** `getUser(jwt)` **مع** `has_permission()`.
# فهذا السطرُ بوابةٌ أولى لا حماية.

[functions.Scan-passport]
verify_jwt = true

[functions.season-admin]
verify_jwt = true

[functions.send-pilgrim-push]
verify_jwt = true

[functions.user-admin]
verify_jwt = true

# ⚠️ الاستثناءُ الوحيد — **نمط البوابة المجهولة** (ق٦ · §٧.٢):
# الحاجُّ يفتح مستندَه بلا تسجيل دخول، والهويةُ تُثبَت برمز جلسةٍ
# عبر `verify_pilgrim_session` داخل الدالّة نفسها. مسجَّلٌ في جرد
# الوصول المجهول (ج٩) في supabase/README.md. ولا يُضاف ثانٍ بلا
# مراجعةٍ معمارية.
[functions.pilgrim-doc]
verify_jwt = false
