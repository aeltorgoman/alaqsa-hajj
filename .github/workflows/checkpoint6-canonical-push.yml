# ════════════════════════════════════════════════════════════
# Checkpoint 6 — canonical production db push
# ════════════════════════════════════════════════════════════
# Applies the single C6 proof migration through the normal canonical
# path and proves it changed nothing but the ledger.
#
# Exactly ONE production-mutating command may run, and only after every
# gate passes:
#
#   supabase db push --linked
#
# Deliberately absent, and audited for: migration repair · migration up
# · manual SQL mutation · rollback · baseline execution · any historical
# migration operation.
#
# There is NO automatic rollback. On post-write failure the run fails
# and preserves evidence; recovery is a human decision.
#
# Running it twice is safe: after success the ledger holds 48 rows,
# 20260922192049 exists and nothing is pending, so the gates fail and
# the second run stops before the write.

name: Checkpoint 6 - canonical production db push (ONE authorized write)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUSH-C6-20260922192049 to authorize the single production write"
        required: true
        default: ""
      db_host:
        description: "Session pooler host from dashboard > Connect (NOT a secret)"
        required: true
        default: "aws-1-eu-central-1.pooler.supabase.com"
      db_port:
        description: "Session pooler port (NOT a secret)"
        required: true
        default: "5432"
      db_user:
        description: "Session pooler user (NOT a secret)"
        required: true
        default: "postgres.zkucwcnclbfvukhdqhgc"

permissions:
  contents: read

concurrency:
  group: checkpoint6-canonical-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest

    env:
      # Hard-targeted: not an input, so no dispatch can point this
      # workflow at another project.
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      C6_VERSION: "20260922192049"
      C6_FILE: 20260922192049_c6_canonical_migration_path_proof.sql
      EXPECT_ROWS_BEFORE: "47"
      EXPECT_LATEST_BEFORE: "20260922120000"
      BASELINE_VERSION: "20260922120000"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}
      OUT: c6-evidence

    steps:
      - name: Require explicit confirmation and secrets
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "PUSH-C6-20260922192049" ] || {
            echo "::error::confirmation string does not match - dispatch was not authorized"; exit 1; }
          missing=0
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; missing=1; }
          [ -n "${SUPABASE_DB_PASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD is not set"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "Confirmation accepted. Both secrets are present."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate toolchain
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          v="$(npm run --silent supabase -- --version)"
          echo "supabase CLI: $v"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is not available"; exit 1; }
          echo "commit=${GITHUB_SHA}" | tee "$OUT/run-sha.txt"
          echo "cli=$v" | tee -a "$OUT/run-sha.txt"

      # ── GATES 1-3) the repository ──────────────────────────
      - name: "GATE: repository holds exactly the approved C6 migration"
        run: |
          set -euo pipefail
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 48 ] || { echo "::error::expected 48 active migrations, found $n"; exit 1; }
          latest="$(ls supabase/migrations/*.sql | xargs -n1 basename | sort | tail -1)"
          [ "$latest" = "$C6_FILE" ] || { echo "::error::latest local migration is $latest, expected $C6_FILE"; exit 1; }
          # Comments may say anything; the executable SQL may not differ.
          python3 supabase/cutover-candidate/tools/assert-push-plan.py body \
            "supabase/migrations/$C6_FILE" 'do $$ begin perform 1; end $$;'
          echo "48 migrations, latest is the C6 proof, and its SQL is the approved no-op."

      - name: "GATE: hard-targeted project and connection"
        run: |
          set -euo pipefail
          [ "$PROJECT_REF" = "zkucwcnclbfvukhdqhgc" ] || { echo "::error::not the authorized project"; exit 1; }
          case "$DB_USER" in *"$PROJECT_REF"*) ;; *) echo "::error::db_user does not belong to $PROJECT_REF"; exit 1 ;; esac
          case "$DB_HOST" in *.pooler.supabase.com) ;; *) echo "::error::db_host is not a Supabase session pooler host"; exit 1 ;; esac
          getent hosts "$DB_HOST" >/dev/null || { echo "::error::cannot resolve $DB_HOST"; exit 1; }
          echo "Target: ${DB_HOST}:${DB_PORT} as ${DB_USER} (project ${PROJECT_REF})."

      - name: "GATE: prove the gate sessions are read-only"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          got="$(psql "$URL" -X -q -At -c "$RO" -c "select current_setting('default_transaction_read_only')")"
          [ "$got" = "on" ] || { echo "::error::could not put the gate session into read-only mode"; exit 1; }
          set +e
          err="$(psql "$URL" -X -v VERBOSITY=verbose -At -c "$RO" \
                   -c "begin; create table _cp6_readonly_probe(i int); rollback;" 2>&1 >/dev/null)"
          rc=$?
          set -e
          printf '%s\n' "$err" > "$OUT/readonly-control.txt"
          [ "$rc" -ne 0 ] || { echo "::error::the server ACCEPTED a write in a gate session"; exit 1; }
          grep -q '25006' "$OUT/readonly-control.txt" || {
            echo "::error::the write was refused, but not with SQLSTATE 25006"; exit 1; }
          echo "Gate sessions are read-only; writes refused with SQLSTATE 25006."

      # ── GATES 4-5) the production ledger ───────────────────
      - name: "GATE: production ledger is exactly the post-C5 state"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          Q="select version || E'\t' || coalesce(name,'') || E'\t'
                  || coalesce(encode(sha256(convert_to(statements[1],'UTF8')),'hex'),'NULL') || E'\t'
                  || coalesce(octet_length(convert_to(statements[1],'UTF8'))::text,'NULL')
               from supabase_migrations.schema_migrations order by version"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$Q" > "$OUT/ledger-before.tsv"
          rows="$(wc -l < "$OUT/ledger-before.tsv")"
          latest="$(psql "$URL" -X -q -At -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          c6="$(psql "$URL" -X -q -At -c "$RO" -c "select count(*) from supabase_migrations.schema_migrations where version='${C6_VERSION}'")"
          echo "rows=$rows latest=$latest c6_present=$c6"
          [ "$rows" -eq "$EXPECT_ROWS_BEFORE" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS_BEFORE"; exit 1; }
          [ "$latest" = "$EXPECT_LATEST_BEFORE" ] || { echo "::error::latest is $latest, expected $EXPECT_LATEST_BEFORE"; exit 1; }
          [ "$c6" -eq 0 ] || { echo "::error::${C6_VERSION} already exists - this run would be a repeat"; exit 1; }
          # The 46 pre-baseline rows must still match the Checkpoint 1
          # evidence; the baseline row is excluded because it was added
          # by Checkpoint 5, after that evidence was captured.
          grep -v "^${BASELINE_VERSION}	" "$OUT/ledger-before.tsv" > "$OUT/ledger-before-originals.tsv"
          python3 supabase/cutover-candidate/tools/assert-ledger-matches-evidence.py \
            "$OUT/ledger-before-originals.tsv" --expect-rows 46 \
            --expect-latest 20260921141422 --expect-absent "$C6_VERSION"

      # ── GATE 6) BEFORE fingerprints, C4/C5 tooling ─────────
      - name: "GATE: capture BEFORE structural and security fingerprints"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/fingerprint-before.txt"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/fingerprint-before.txt"
          wc -l "$OUT/fingerprint-before.txt"
          npm run --silent supabase -- link --project-ref "$PROJECT_REF" >/dev/null
          # --role-only is NEVER used: it can emit role password hashes.
          npm run --silent supabase -- db dump --linked --schema public --keep-comments -f "$OUT/structural-before.sql"
          [ -s "$OUT/structural-before.sql" ] || { echo "::error::BEFORE structural dump is empty"; exit 1; }

      # ── GATE 7) exactly one pending, and it is C6 ──────────
      - name: "GATE: exactly one pending migration and it is C6"
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npm run --silent supabase -- db push --dry-run --linked --output-format json \
            > "$OUT/plan-before.json" 2> "$OUT/plan-before.err" || true
          echo "--- stdout ---"; cat "$OUT/plan-before.json"
          echo "--- stderr ---"; cat "$OUT/plan-before.err"
          python3 supabase/cutover-candidate/tools/assert-push-plan.py plan "$OUT/plan-before.json" "$C6_FILE"

      # ════════════════════════════════════════════════════════
      # THE ONE AUTHORIZED PRODUCTION WRITE
      # ════════════════════════════════════════════════════════
      - name: "LIVE WRITE: canonical db push"
        id: live_push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npm run --silent supabase -- db push --linked --output-format json \
            > "$OUT/push.json" 2> "$OUT/push.err"
          echo "--- stdout ---"; cat "$OUT/push.json"
          echo "--- stderr ---"; cat "$OUT/push.err"

      # ── POST-WRITE. No rollback, ever. ─────────────────────
      - name: "POST: ledger 47 -> 48, the 47 originals untouched"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          Q="select version || E'\t' || coalesce(name,'') || E'\t'
                  || coalesce(encode(sha256(convert_to(statements[1],'UTF8')),'hex'),'NULL') || E'\t'
                  || coalesce(octet_length(convert_to(statements[1],'UTF8'))::text,'NULL')
               from supabase_migrations.schema_migrations order by version"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$Q" > "$OUT/ledger-after.tsv"
          rows="$(wc -l < "$OUT/ledger-after.tsv")"
          latest="$(psql "$URL" -X -q -At -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          dup="$(psql "$URL" -X -q -At -c "$RO" -c "select count(*) from supabase_migrations.schema_migrations where version='${C6_VERSION}'")"
          echo "rows=$rows latest=$latest c6_rows=$dup"
          bad=0
          [ "$rows" -eq 48 ] || { echo "::error::ledger holds $rows rows, expected 48"; bad=1; }
          [ "$latest" = "$C6_VERSION" ] || { echo "::error::latest is $latest, expected $C6_VERSION"; bad=1; }
          [ "$dup" -eq 1 ] || { echo "::error::C6 appears $dup times, expected exactly once"; bad=1; }
          grep -v "^${C6_VERSION}	" "$OUT/ledger-after.tsv" > "$OUT/ledger-after-originals.tsv"
          diff -u "$OUT/ledger-before.tsv" "$OUT/ledger-after-originals.tsv" > "$OUT/ledger-originals.diff" || {
            echo "::error::one or more of the 47 original ledger rows changed"; cat "$OUT/ledger-originals.diff"; bad=1; }
          if [ "$bad" -eq 0 ]; then echo PASS > "$OUT/status-ledger.txt"; else echo FAIL > "$OUT/status-ledger.txt"; fi
          echo "Ledger verdict: $(cat "$OUT/status-ledger.txt")"

      - name: "POST: structural and security state unchanged"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/fingerprint-after.txt"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/fingerprint-after.txt"
          npm run --silent supabase -- db dump --linked --schema public --keep-comments -f "$OUT/structural-after.sql"
          rc1=0
          python3 supabase/baseline-candidate/tools/compare-fingerprints.py \
            "$OUT/fingerprint-before.txt" "$OUT/fingerprint-after.txt" \
            --label "C6 security BEFORE vs AFTER" | tee "$OUT/security-report.txt" || rc1=$?
          rc2=0
          python3 supabase/baseline-candidate/tools/compare-structural.py \
            "$OUT/structural-before.sql" "$OUT/structural-after.sql" \
            | tee "$OUT/structural-report.txt" || rc2=$?
          if [ "$rc1" -eq 0 ] && [ "$rc2" -eq 0 ]; then echo PASS > "$OUT/status-schema.txt"; else echo FAIL > "$OUT/status-schema.txt"; fi
          echo "Schema/security verdict: $(cat "$OUT/status-schema.txt")"

      - name: "POST: zero pending migrations"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          npm run --silent supabase -- db push --dry-run --linked --output-format json \
            > "$OUT/plan-after.json" 2> "$OUT/plan-after.err" || true
          echo "--- stdout ---"; cat "$OUT/plan-after.json"
          rc=0
          python3 supabase/cutover-candidate/tools/assert-push-plan.py plan "$OUT/plan-after.json" || rc=$?
          if [ "$rc" -eq 0 ]; then echo PASS > "$OUT/status-pending.txt"; else echo FAIL > "$OUT/status-pending.txt"; fi
          echo "Pending verdict: $(cat "$OUT/status-pending.txt")"

      - name: "C6 verdict (fails the run)"
        if: always() && steps.live_push.outcome != 'skipped'
        run: |
          set -euo pipefail
          bad=0
          for k in ledger schema pending; do
            f="$OUT/status-$k.txt"
            if [ ! -s "$f" ]; then echo "::error::no verdict recorded for $k"; bad=1; continue; fi
            v="$(cat "$f")"; printf '%-10s %s\n' "$k" "$v"; [ "$v" = "PASS" ] || bad=1
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::post-write verification FAILED. Evidence is preserved in the artifact."
            echo "::error::NO rollback has been attempted and none is authorized. Escalate to a human."
            echo FAIL > "$OUT/verdict.txt"; exit 1
          fi
          echo PASS > "$OUT/verdict.txt"
          echo "Checkpoint 6 proven: ledger 47 -> 48, schema and security unchanged, nothing pending."

      - name: "Scan evidence for secret-like material"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          {
            echo "run_id=${GITHUB_RUN_ID:-?} attempt=${GITHUB_RUN_ATTEMPT:-?}"
            echo "commit=${GITHUB_SHA:-?}"
            echo "project=${PROJECT_REF} endpoint=${DB_HOST}:${DB_PORT} user=${DB_USER}"
            echo "migration=${C6_FILE}"
            echo "files:"; ls -la "$OUT" || true
          } > "$OUT/run-summary.txt"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|SCRAM-SHA-256\\\$|md5[0-9a-f]{32}|postgres(ql)?://[^ ]*:[^ ]*@|PASSWORD '" "$OUT"; then
            echo "::error::secret-like material found in the evidence - upload blocked"; exit 1
          fi
          echo "Evidence secret scan clean."

      - name: "Upload C6 evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint6-canonical-push
          path: c6-evidence
          if-no-files-found: error
