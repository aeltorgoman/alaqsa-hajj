name: Customer Backend Setup

on:
  workflow_dispatch:
    inputs:
      allowed_origin:
        description: "Production URL, e.g. https://customer.vercel.app (several allowed, comma-separated; the first one becomes the Supabase Site URL)"
        required: true
      vercel_project_slug:
        description: "Vercel Project Name"
        required: true
      vercel_owner_slug:
        description: "Vercel Team/Owner slug"
        required: true
      vapid_subject:
        description: "Customer contact, e.g. mailto:it@customer.com"
        required: true
      admin_login:
        description: "First Administrator Login ID, e.g. admin@company.local (add it first in Supabase: Authentication > Users > Add user, with Auto Confirm User ticked)"
        required: true
      admin_name:
        description: "First Administrator display name"
        required: true
      season_hijri_year:
        description: "Hijri year of the first Hajj season, e.g. 1448 (used only when the project has no season yet)"
        required: true

permissions:
  contents: read

concurrency:
  group: customer-backend-setup
  cancel-in-progress: false

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API: https://api.supabase.com/v1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Check required setup secrets"
        run: |
          set -euo pipefail
          [ -n "${PROJECT_REF:-}" ] || { echo "::error::SUPABASE_PROJECT_REF is missing"; exit 1; }
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is missing"; exit 1; }
          echo "::add-mask::$PROJECT_REF"
          echo "Required GitHub secrets are present. Database password is not needed by this setup path."

      - name: "Validate First Administrator inputs"
        id: admin
        env:
          ADMIN_LOGIN: ${{ inputs.admin_login }}
          ADMIN_NAME: ${{ inputs.admin_name }}
          SEASON_HIJRI_YEAR: ${{ inputs.season_hijri_year }}
          ALLOWED_ORIGIN_INPUT: ${{ inputs.allowed_origin }}
          LC_ALL: C.UTF-8
        run: |
          set -euo pipefail
          trim() { local v="$1"; v="${v#"${v%%[![:space:]]*}"}"; v="${v%"${v##*[![:space:]]}"}"; printf '%s' "$v"; }
          login="$(trim "$ADMIN_LOGIN")"
          login="${login,,}"
          name="$(trim "$ADMIN_NAME")"

          if [[ "$login$name" =~ [[:cntrl:]] ]]; then
            echo "::error::admin_login and admin_name must not contain control characters or line breaks."; exit 1
          fi
          if ! [[ "$login" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]] || (( ${#login} > 254 )); then
            echo "::error::admin_login must be the Login ID in email form, e.g. admin@company.local — exactly as entered in Supabase Authentication > Users."; exit 1
          fi
          if [ -z "$name" ] || (( ${#name} > 100 )); then
            echo "::error::admin_name must be 1 to 100 characters."; exit 1
          fi

          year="$(trim "$SEASON_HIJRI_YEAR")"
          if ! [[ "$year" =~ ^[0-9]{4}$ ]] || (( 10#$year < 1400 || 10#$year > 1600 )); then
            echo "::error::season_hijri_year must be a Hijri year between 1400 and 1600, e.g. 1448."; exit 1
          fi

          # Browsers send Origin as exactly https://host[:port] (lowercase, no path, no trailing
          # slash) and the Edge Functions compare it character for character, so the input is
          # normalized here and anything that cannot match a real origin fails now.
          origins="$(node <<'NODE'
          const raw = process.env.ALLOWED_ORIGIN_INPUT ?? '';
          const fail = (m) => { console.error(`::error::allowed_origin: ${m}`); process.exit(1); };
          if (/[;|\s]/.test(raw.replace(/\s*,\s*/g, ',').trim())) {
            fail('separate several URLs with commas only, e.g. https://hajj.company.qa,https://customer.vercel.app');
          }
          const label = '[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?';
          const ORIGIN = new RegExp(`^https://(${label}(?:\\.${label})+)(?::(\\d{1,5}))?$`);
          const out = [];
          for (const part of raw.split(',')) {
            let v = part.trim();
            if (!v) fail('empty entry; check for an extra comma');
            if (v.endsWith('/')) v = v.slice(0, -1);
            v = v.replace(/^https:\/\//i, 'https://').toLowerCase();
            const m = ORIGIN.exec(v);
            if (!m) fail(`"${part.trim()}" is not a valid https origin: use https://host only, without a path`);
            const port = m[2] === undefined ? null : Number(m[2]);
            if (port !== null && (port < 1 || port > 65535)) fail(`"${part.trim()}" has an invalid port`);
            const origin = `https://${m[1]}${port === null || port === 443 ? '' : `:${port}`}`;
            if (!out.includes(origin)) out.push(origin);
          }
          process.stdout.write(out.join(','));
          NODE
          )"

          # The complete permission set, read from the application's own ALL_PERMISSIONS.
          keys="$(node supabase/scripts/permission-keys.mjs)"

          # Values travel to SQL only as base64 (see the bootstrap step).
          {
            echo "login=$login"
            echo "login_b64=$(printf '%s' "$login" | base64 -w0)"
            echo "name_b64=$(printf '%s' "$name" | base64 -w0)"
            echo "keys_b64=$(printf '%s' "$keys" | base64 -w0)"
            echo "season_year=$((10#$year))"
            echo "origins=$origins"
            echo "site_url=${origins%%,*}"
          } >> "$GITHUB_OUTPUT"
          echo "First Administrator: $login · permissions to grant: $(jq length <<<"$keys")"
          echo "Allowed origins: $origins · Site URL: ${origins%%,*}"

      - name: "Verify Supabase Auth settings (read-only)"
        env:
          SITE_URL: ${{ steps.admin.outputs.site_url }}
        run: |
          set -euo pipefail
          # Read only, before any change. Writing Auth settings through the Management API needs
          # project-admin write authority, which is never stored in GitHub: the operator sets
          # sign-up off, anonymous sign-in off and the Site URL in the Supabase Dashboard.
          code="$(curl -sS -o "$RUNNER_TEMP/auth.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$PROJECT_REF/config/auth")" || {
              echo "::error::Could not reach the Supabase Management API to read the Auth settings. Stopped before any change; run the workflow again."; exit 1; }
          node supabase/scripts/auth-settings.mjs check "$RUNNER_TEMP/auth.json" "$code" "$SITE_URL" || {
            echo "::error::Stopped before any change: no migration, administrator, season, VAPID key, secret or function was touched. Fix the above and run the workflow again."
            exit 1; }

      - name: "Verify ANTHROPIC_API_KEY is present (presence only)"
        run: |
          set -euo pipefail
          # Passport scanning is essential and needs the customer's own Anthropic key, stored only
          # as a Supabase Edge Function secret. Only secret names are checked; the value is never
          # read, printed or compared, and never passes through GitHub.
          trap 'rm -f "$RUNNER_TEMP/secret-names.json"' EXIT
          code="$(curl -sS -o "$RUNNER_TEMP/secret-names.json" -w '%{http_code}' \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$API/projects/$PROJECT_REF/secrets")" || {
              echo "::error::Could not reach the Supabase Management API to list Edge Function secrets. Stopped before any change; run the workflow again."; exit 1; }
          if [ "$code" != 200 ]; then
            msg="$(jq -r '(.message // .error // empty) | tostring' "$RUNNER_TEMP/secret-names.json" 2>/dev/null || true)"
            [ -n "$msg" ] || msg="$(head -c 500 "$RUNNER_TEMP/secret-names.json")"
            echo "::error::Listing Edge Function secrets returned HTTP $code. Supabase said: $(printf '%s' "${msg:-(empty response)}" | tr -s '[:space:]' ' ') Stopped before any change."
            exit 1
          fi
          present="$(jq -r 'if type == "array" then any(.[]; .name == "ANTHROPIC_API_KEY") else "invalid" end' "$RUNNER_TEMP/secret-names.json" 2>/dev/null || echo invalid)"
          [ "$present" != invalid ] || { echo "::error::The secret list returned by Supabase is not a JSON array. Stopped before any change."; exit 1; }
          [ "$present" = true ] || {
            echo "::error::ANTHROPIC_API_KEY is not set. Passport scanning needs the customer's own Anthropic API key. Add it in Supabase → Edge Functions → Secrets → name ANTHROPIC_API_KEY, then run this workflow again. Never put this key in GitHub or Vercel."
            echo "::error::Stopped before any change: no migration, administrator, season, VAPID key, secret or function was touched."
            exit 1; }
          echo "ANTHROPIC_API_KEY: present in Supabase Edge Function secrets (presence only; the value is never read)."

      - name: "Install pinned project toolchain"
        run: |
          set -euo pipefail
          npm ci
          v="$(npm run --silent supabase -- --version)"
          echo "Supabase CLI $v"

      - name: "Apply repository migrations"
        run: |
          set -euo pipefail
          # api <method> <path> [json-file]: the response body lands in $RUNNER_TEMP/api.out;
          # on HTTP >= 400 the body's own message is shown, not just the status code.
          api() {
            local code args=(-sS -o "$RUNNER_TEMP/api.out" -w '%{http_code}'
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -X "$1" "$API/projects/$PROJECT_REF$2")
            [ -z "${3:-}" ] || args+=(-H "Content-Type: application/json" --data-binary @"$3")
            code="$(curl "${args[@]}")" || { echo "::error::$1 $2: request failed"; return 1; }
            if [ "$code" -ge 400 ]; then
              local msg; msg="$(jq -r '.message // empty' "$RUNNER_TEMP/api.out" 2>/dev/null || true)"
              echo "::error::$1 $2 returned HTTP $code: ${msg:-$(head -c 2000 "$RUNNER_TEMP/api.out")}"
              return 1
            fi
          }

          # The API records each migration under a version it generates itself, so the
          # history is matched by name (see supabase/scripts/migration-ledger.mjs).
          api GET /database/migrations
          cp "$RUNNER_TEMP/api.out" "$RUNNER_TEMP/history.json"
          node supabase/scripts/migration-ledger.mjs plan "$RUNNER_TEMP/history.json" > "$RUNNER_TEMP/pending.txt"

          count=0
          while IFS= read -r base; do
            # The full file name is the recorded name, so a re-run recognises it.
            jq -n --rawfile query "supabase/migrations/$base.sql" --arg name "$base" \
              '{query:$query,name:$name}' > "$RUNNER_TEMP/migration.json"
            api POST /database/migrations "$RUNNER_TEMP/migration.json" || {
              echo "::error::Migration $base was not applied. Fix the cause above, then run this workflow again."; exit 1; }
            echo "apply $base"
            count=$((count + 1))
          done < "$RUNNER_TEMP/pending.txt"
          echo "Applied $count migration(s)."

      - name: "Create First Administrator with all system permissions"
        id: bootstrap
        env:
          ADMIN_LOGIN: ${{ steps.admin.outputs.login }}
          LOGIN_B64: ${{ steps.admin.outputs.login_b64 }}
          NAME_B64: ${{ steps.admin.outputs.name_b64 }}
          KEYS_B64: ${{ steps.admin.outputs.keys_b64 }}
        run: |
          set -euo pipefail
          shopt -u patsub_replacement 2>/dev/null || true
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          # run_sql <query>: result rows (JSON) land in $RUNNER_TEMP/sql.out; on failure the
          # database's own message is shown as an error.
          run_sql() {
            jq -n --arg query "$1" '{query:$query}' > "$RUNNER_TEMP/sql.json"
            if ! curl --fail-with-body -sS "${auth[@]}" -H "Content-Type: application/json" \
                 -X POST "$API/projects/$PROJECT_REF/database/query" \
                 --data-binary @"$RUNNER_TEMP/sql.json" -o "$RUNNER_TEMP/sql.out"; then
              msg="$(jq -r '.message // empty' "$RUNNER_TEMP/sql.out" 2>/dev/null || true)"
              echo "::error::${msg:-$(cat "$RUNNER_TEMP/sql.out")}"
              return 1
            fi
          }
          bind() {
            local sql="$1" v
            for v in LOGIN_B64 NAME_B64 KEYS_B64; do
              [[ "${!v}" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "::error::$v is not base64" >&2; return 1; }
              sql="${sql//@$v@/${!v}}"
            done
            printf '%s' "$sql"
          }

          # The heredocs are quoted, so the shell expands nothing inside them.
          # Operator input reaches SQL only as base64 (A-Z a-z 0-9 + / =), which
          # can close neither a quoted literal nor the $bootstrap$ dollar quote.
          bootstrap_sql="$(bind "$(cat <<'SQL'
          do $bootstrap$
          declare
            v_login text := lower(convert_from(decode('@LOGIN_B64@', 'base64'), 'UTF8'));
            v_name  text := convert_from(decode('@NAME_B64@', 'base64'), 'UTF8');
            v_keys  text[] := array(select jsonb_array_elements_text(
                        convert_from(decode('@KEYS_B64@', 'base64'), 'UTF8')::jsonb));
            v_permissions jsonb;
            v_matches   int;
            v_id        uuid;
            v_email     text;
            v_confirmed timestamptz;
            v_banned    timestamptz;
            v_others    int;
            v_granted   int;
          begin
            if cardinality(v_keys) = 0 then
              raise exception 'FIRST_ADMIN: the permission list is empty';
            end if;
            select jsonb_object_agg(k, true) into v_permissions from unnest(v_keys) as k;

            -- One bootstrap at a time; no other profile write can interleave before commit.
            lock table public.user_profiles in share row exclusive mode;

            select count(*) into v_matches
              from auth.users where lower(email) = v_login and deleted_at is null;
            if v_matches = 0 then
              raise exception 'FIRST_ADMIN: no Supabase Auth user has Login ID %. Add it in Supabase: Authentication > Users > Add user (tick Auto Confirm User), then run this workflow again.', v_login;
            elsif v_matches > 1 then
              raise exception 'FIRST_ADMIN: more than one Auth user matches Login ID %. Refusing to guess.', v_login;
            end if;

            select id, lower(email), email_confirmed_at, banned_until
              into v_id, v_email, v_confirmed, v_banned
              from auth.users where lower(email) = v_login and deleted_at is null;

            if v_confirmed is null then
              raise exception 'FIRST_ADMIN: Auth user % is not confirmed. In Supabase Authentication > Users, delete it and add it again with Auto Confirm User ticked, then run this workflow again.', v_login;
            end if;
            if v_banned is not null and v_banned > now() then
              raise exception 'FIRST_ADMIN: Auth user % is banned.', v_login;
            end if;

            -- Fresh deployment only: any profile other than this administrator means
            -- the installation is already in use, so no bootstrap privileges are granted.
            select count(*) into v_others from public.user_profiles where id <> v_id;
            if v_others > 0 then
              raise exception 'FIRST_ADMIN: this installation already has % other user profile(s). First Administrator setup runs only on a fresh deployment; manage users from Settings > Users.', v_others;
            end if;

            -- Zero profiles: create. Only this administrator: re-assert the full set (safe retry).
            insert into public.user_profiles (id, email, name, permissions, is_active, updated_at)
            values (v_id, v_email, v_name, v_permissions, true, now())
            on conflict (id) do update
              set email = excluded.email, name = excluded.name,
                  permissions = excluded.permissions, is_active = true, updated_at = now()
              where (user_profiles.email, user_profiles.name, user_profiles.permissions, user_profiles.is_active)
                    is distinct from (excluded.email, excluded.name, excluded.permissions, true);

            select count(*) into v_granted
              from public.user_profiles up cross join unnest(v_keys) as k
             where up.id = v_id and up.is_active and (up.permissions ->> k) = 'true';
            if v_granted <> cardinality(v_keys) then
              raise exception 'FIRST_ADMIN: verification failed: % of % permissions stored.', v_granted, cardinality(v_keys);
            end if;
          end
          $bootstrap$
          SQL
          )")"

          readback_sql="$(bind "$(cat <<'SQL'
          select up.is_active, up.permissions,
                 (select count(*)::int from public.user_profiles) as profile_count
            from auth.users u
            join public.user_profiles up on up.id = u.id
           where lower(u.email) = lower(convert_from(decode('@LOGIN_B64@', 'base64'), 'UTF8'))
             and u.deleted_at is null
          SQL
          )")"

          run_sql 'select count(*)::int as n from public.user_profiles'
          before="$(jq -r '.[0].n' "$RUNNER_TEMP/sql.out")"
          run_sql "$bootstrap_sql"

          # Independent read-back: the stored row, not the request, decides success.
          keys="$(printf '%s' "$KEYS_B64" | base64 -d)"
          run_sql "$readback_sql"
          readback="$(cat "$RUNNER_TEMP/sql.out")"
          read -r rows granted total active profiles < <(jq -r --argjson keys "$keys" '
            (if length == 1 then .[0] else {} end) as $p
            | [length, ($keys | map(select($p.permissions[.] == true)) | length), ($keys | length),
               ($p.is_active == true), ($p.profile_count // 0)] | @tsv' <<<"$readback")
          if [ "$rows" != 1 ] || [ "$active" != true ] || [ "$profiles" != 1 ] || [ "$granted" != "$total" ]; then
            echo "::error::First Administrator verification failed: rows=$rows active=$active profiles=$profiles permissions=$granted/$total"
            exit 1
          fi

          if [ "$before" = 0 ]; then state="created"; else state="already set up — verified"; fi
          {
            echo "state=$state"
            echo "granted=$granted"
            echo "total=$total"
          } >> "$GITHUB_OUTPUT"
          echo "First Administrator $ADMIN_LOGIN $state: permissions verified $granted / $total."

      - name: "Create the first season"
        id: season
        env:
          LOGIN_B64: ${{ steps.admin.outputs.login_b64 }}
          SEASON_YEAR: ${{ steps.admin.outputs.season_year }}
        run: |
          set -euo pipefail
          shopt -u patsub_replacement 2>/dev/null || true
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          run_sql() {
            jq -n --arg query "$1" '{query:$query}' > "$RUNNER_TEMP/sql.json"
            if ! curl --fail-with-body -sS "${auth[@]}" -H "Content-Type: application/json" \
                 -X POST "$API/projects/$PROJECT_REF/database/query" \
                 --data-binary @"$RUNNER_TEMP/sql.json" -o "$RUNNER_TEMP/sql.out"; then
              msg="$(jq -r '.message // empty' "$RUNNER_TEMP/sql.out" 2>/dev/null || true)"
              echo "::error::${msg:-$(cat "$RUNNER_TEMP/sql.out")}"
              return 1
            fi
          }
          # Both values were validated by the "Validate First Administrator inputs" step;
          # re-checked here because they are placed into SQL text.
          [[ "$SEASON_YEAR" =~ ^[0-9]{4}$ ]] || { echo "::error::invalid season year"; exit 1; }
          [[ "$LOGIN_B64" =~ ^[A-Za-z0-9+/=]+$ ]] || { echo "::error::invalid login encoding"; exit 1; }

          # The first season is customer data, not schema: the migrations create none.
          # Zero seasons → create one open season. Exactly one open season → leave it
          # untouched (the supplied year never overwrites it). Anything else → fail
          # without changes: which season to resume is a human decision.
          season_sql="$(cat <<'SQL'
          do $season$
          declare
            v_year  int := @YEAR@;
            v_total int;
            v_open  int;
          begin
            -- One bootstrap at a time; no season write can interleave before commit.
            lock table public.seasons in share row exclusive mode;
            select count(*), count(*) filter (where closed_at is null)
              into v_total, v_open from public.seasons;
            if v_open > 1 then
              raise exception 'FIRST_SEASON: % open seasons exist; exactly one is allowed. Nothing was changed.', v_open;
            elsif v_open = 1 then
              return;
            elsif v_total > 0 then
              raise exception 'FIRST_SEASON: % season(s) exist but none is open. Which season to resume needs a human decision; nothing was changed.', v_total;
            end if;
            insert into public.seasons (name, hijri_year)
            values (format('موسم الحج %s هـ', v_year), v_year);
          end
          $season$
          SQL
          )"

          # Read the open season as the First Administrator, through the same role and
          # RLS policy the application uses (SeasonContext); privileged access is reset.
          rls_sql="$(cat <<'SQL'
          do $rls$
          declare
            v_uid  uuid;
            v_seen int;
          begin
            select id into v_uid from auth.users
             where lower(email) = lower(convert_from(decode('@LOGIN_B64@', 'base64'), 'UTF8'))
               and deleted_at is null;
            if v_uid is null then
              raise exception 'FIRST_SEASON: the First Administrator was not found for the access check.';
            end if;
            perform set_config('request.jwt.claims',
              json_build_object('sub', v_uid, 'role', 'authenticated')::text, true);
            perform set_config('request.jwt.claim.sub', v_uid::text, true);
            set local role authenticated;
            select count(*) into v_seen from public.seasons where closed_at is null;
            reset role;
            if v_seen <> 1 then
              raise exception 'FIRST_SEASON: the First Administrator can see % open season(s) through the application access rules; exactly 1 is required.', v_seen;
            end if;
          end
          $rls$
          SQL
          )"
          season_sql="${season_sql//@YEAR@/$SEASON_YEAR}"
          rls_sql="${rls_sql//@LOGIN_B64@/$LOGIN_B64}"

          run_sql 'select count(*)::int as n from public.seasons'
          before="$(jq -r '.[0].n' "$RUNNER_TEMP/sql.out")"
          run_sql "$season_sql"

          # Independent read-back: exactly one open season, decided by the stored rows.
          run_sql 'select hijri_year, (select count(*)::int from public.seasons where closed_at is null) as open_count from public.seasons where closed_at is null'
          read -r open_count year < <(jq -r '[(.[0].open_count // 0), (.[0].hijri_year // "")] | @tsv' "$RUNNER_TEMP/sql.out")
          if [ "$open_count" != 1 ] || [ "$(jq length "$RUNNER_TEMP/sql.out")" != 1 ]; then
            echo "::error::Exactly one open season is required; found $open_count."; exit 1
          fi
          run_sql "$rls_sql"

          if [ "$before" = 0 ]; then state="created"; else state="existing open season kept unchanged"; fi
          if [ "$before" != 0 ] && [ "$year" != "$SEASON_YEAR" ]; then
            echo "::notice::The existing open season (Hijri year $year) was kept; season_hijri_year $SEASON_YEAR was not applied."
          fi
          { echo "state=$state"; echo "year=$year"; } >> "$GITHUB_OUTPUT"
          echo "Open season: Hijri year $year ($state). The First Administrator can read it."

      - name: "Prepare VAPID key pair"
        id: vapid
        shell: bash
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          jq -n '{query:"select count(*)::int as n from public.pilgrim_push_subscriptions"}' > "$RUNNER_TEMP/subs.json"
          subs="$(curl --fail-with-body -sS "${auth[@]}" -H "Content-Type: application/json" \
            -X POST "$API/projects/$PROJECT_REF/database/query" \
            --data-binary @"$RUNNER_TEMP/subs.json" | jq -r '.[0].n')"
          [[ "$subs" =~ ^[0-9]+$ ]] || { echo "::error::Could not count push subscriptions"; exit 1; }

          # Live system: devices are subscribed with the current pair. A new pair would
          # silently break all of them, so a re-run keeps the existing pair untouched.
          if (( subs > 0 )); then
            { echo "rotate=false"; echo "subscriptions=$subs"; } >> "$GITHUB_OUTPUT"
            echo "Keeping the existing VAPID pair: $subs push subscription(s) depend on it."
            exit 0
          fi

          node <<'NODE' > "$RUNNER_TEMP/vapid.txt"
          const { generateKeyPairSync } = require('node:crypto');
          const { publicKey, privateKey } = generateKeyPairSync('ec', { namedCurve: 'prime256v1' });
          const pub = publicKey.export({ format: 'jwk' });
          const priv = privateKey.export({ format: 'jwk' });
          const b64 = s => Buffer.from(s, 'base64url');
          const publicVapid = Buffer.concat([Buffer.from([4]), b64(pub.x), b64(pub.y)]).toString('base64url');
          console.log(publicVapid);
          console.log(priv.d);
          NODE
          PUBLIC_KEY="$(sed -n '1p' "$RUNNER_TEMP/vapid.txt")"
          PRIVATE_KEY="$(sed -n '2p' "$RUNNER_TEMP/vapid.txt")"
          rm -f "$RUNNER_TEMP/vapid.txt"
          echo "::add-mask::$PRIVATE_KEY"
          {
            echo "rotate=true"
            echo "public_key=$PUBLIC_KEY"
            echo "private_key=$PRIVATE_KEY"
          } >> "$GITHUB_OUTPUT"

      - name: "Set required Edge Function secrets"
        env:
          ALLOWED_ORIGIN: ${{ steps.admin.outputs.origins }}
          VERCEL_PROJECT: ${{ inputs.vercel_project_slug }}
          VERCEL_OWNER: ${{ inputs.vercel_owner_slug }}
          VAPID_SUBJECT: ${{ inputs.vapid_subject }}
          VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
          VAPID_PRIVATE_KEY: ${{ steps.vapid.outputs.private_key }}
          ROTATE_VAPID: ${{ steps.vapid.outputs.rotate }}
        run: |
          set -euo pipefail
          args=(
            "ALLOWED_ORIGINS=$ALLOWED_ORIGIN"
            "VERCEL_PROJECT_SLUG=$VERCEL_PROJECT"
            "VERCEL_OWNER_SLUG=$VERCEL_OWNER"
            "VAPID_SUBJECT=$VAPID_SUBJECT"
          )
          if [ "$ROTATE_VAPID" = "true" ]; then
            args+=("VAPID_PUBLIC_KEY=$VAPID_PUBLIC_KEY" "VAPID_PRIVATE_KEY=$VAPID_PRIVATE_KEY")
          fi
          # list_secrets <file>: names, digests and updated_at only; no secret value is returned.
          list_secrets() {
            curl --fail-with-body -sS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "$API/projects/$PROJECT_REF/secrets" -o "$1" || {
                echo "::error::Could not read the secret list: $(head -c 2000 "$1" 2>/dev/null)"; exit 1; }
          }
          list_secrets "$RUNNER_TEMP/secrets-before.json"

          set +e
          npm run --silent supabase -- secrets set "${args[@]}" --project-ref "$PROJECT_REF"
          set_rc=$?
          set -e

          # Read back before deploying. The API can store the secrets and still return an
          # error from a later step (seen: "Failed to write functions metadata fields"), so
          # the stored state, not the status code alone, decides.
          list_secrets "$RUNNER_TEMP/secrets-after.json"
          SET_RC="$set_rc" node <<'NODE'
          const fs = require('node:fs');
          const read = (f) => new Map(JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/${f}`, 'utf8'))
            .map((s) => [s.name, { digest: String(s.value ?? ''), updatedAt: Date.parse(s.updated_at ?? '') }]));
          const before = read('secrets-before.json');
          const after = read('secrets-after.json');
          const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

          // Every secret the functions require must exist (the VAPID pair even when kept).
          const required = ['ALLOWED_ORIGINS', 'VERCEL_PROJECT_SLUG', 'VERCEL_OWNER_SLUG',
            'VAPID_SUBJECT', 'VAPID_PUBLIC_KEY', 'VAPID_PRIVATE_KEY'];
          const missing = required.filter((n) => !after.has(n));
          if (missing.length) fail(`Required Edge Function secrets are missing: ${missing.join(', ')}`);
          if (process.env.SET_RC === '0') {
            console.log(`All ${required.length} required Edge Function secrets are present.`);
            process.exit(0);
          }

          // The write reported an error. Continue only if, for every secret sent in this run,
          // the before/after state proves it was written: newly created, updated_at advanced,
          // or digest changed. The digest is compared only with itself, so its algorithm
          // does not matter. The job's concurrency group rules out another writer.
          const sent = ['ALLOWED_ORIGINS', 'VERCEL_PROJECT_SLUG', 'VERCEL_OWNER_SLUG', 'VAPID_SUBJECT'];
          if (process.env.ROTATE_VAPID === 'true') sent.push('VAPID_PUBLIC_KEY', 'VAPID_PRIVATE_KEY');
          const written = (name) => {
            const was = before.get(name);
            const now = after.get(name);
            if (!now) return false;
            if (!was) return true;
            if (Number.isFinite(was.updatedAt) && Number.isFinite(now.updatedAt) && now.updatedAt > was.updatedAt) return true;
            return now.digest !== was.digest;
          };
          const unproven = sent.filter((n) => !written(n));
          if (unproven.length) fail(`Setting secrets failed (see the error above). Not proven written in this run: ${unproven.join(', ')}. Run this workflow again.`);
          console.log(`::warning::Supabase reported an error after setting secrets, but the before/after read-back proves all ${sent.length} secrets from this run were written. Continuing.`);
          NODE

      - name: "Deploy all six Edge Functions"
        run: |
          set -euo pipefail
          npm run --silent supabase -- functions deploy --project-ref "$PROJECT_REF" --use-api

      - name: "Verify backend deployment"
        env:
          SITE_URL: ${{ steps.admin.outputs.site_url }}
        run: |
          set -euo pipefail
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")
          curl --fail-with-body -sS "${auth[@]}" "$API/projects/$PROJECT_REF/database/migrations" \
            -o "$RUNNER_TEMP/history.json"
          node supabase/scripts/migration-ledger.mjs verify "$RUNNER_TEMP/history.json"

          jq -n '{query:"select count(*)::int as n from public.seasons where closed_at is null"}' > "$RUNNER_TEMP/open.json"
          open="$(curl --fail-with-body -sS "${auth[@]}" -H "Content-Type: application/json" \
            -X POST "$API/projects/$PROJECT_REF/database/query" --data-binary @"$RUNNER_TEMP/open.json" | jq -r '.[0].n')"
          [ "$open" = 1 ] || { echo "::error::Exactly one open season is required; found ${open:-none}."; exit 1; }

          functions="$(curl --fail-with-body -sS "${auth[@]}" "$API/projects/$PROJECT_REF/functions")"
          for slug in Scan-passport pilgrim-doc season-admin send-pilgrim-push user-admin whatsapp-send; do
            printf '%s' "$functions" | jq -e --arg slug "$slug"               'any(.[]; .slug == $slug and .status == "ACTIVE")' >/dev/null || {
                echo "::error::Function $slug is not ACTIVE"; exit 1; }
          done
          # The Auth settings may have been changed in the Dashboard while setup ran.
          code="$(curl -sS -o "$RUNNER_TEMP/auth.json" -w '%{http_code}' "${auth[@]}" \
            "$API/projects/$PROJECT_REF/config/auth")" || {
              echo "::error::Could not reach the Supabase Management API to read the Auth settings."; exit 1; }
          node supabase/scripts/auth-settings.mjs check "$RUNNER_TEMP/auth.json" "$code" "$SITE_URL"

          # Presence only, as before any change: secret names, never the value.
          curl --fail-with-body -sS "${auth[@]}" "$API/projects/$PROJECT_REF/secrets" -o "$RUNNER_TEMP/secret-names.json" || {
            echo "::error::Could not list Edge Function secrets: $(jq -r '.message // empty' "$RUNNER_TEMP/secret-names.json" 2>/dev/null || true)"; exit 1; }
          present="$(jq -r 'type == "array" and any(.[]; .name == "ANTHROPIC_API_KEY")' "$RUNNER_TEMP/secret-names.json")"
          rm -f "$RUNNER_TEMP/secret-names.json"
          [ "$present" = true ] || {
            echo "::error::ANTHROPIC_API_KEY is no longer set. Add it in Supabase → Edge Functions → Secrets → name ANTHROPIC_API_KEY, then run this workflow again."
            exit 1; }
          echo "ANTHROPIC_API_KEY: present (presence only)."
          echo "Backend setup verified."

      - name: "Setup result"
        env:
          ADMIN_LOGIN: ${{ steps.admin.outputs.login }}
          ADMIN_STATE: ${{ steps.bootstrap.outputs.state }}
          ADMIN_GRANTED: ${{ steps.bootstrap.outputs.granted }}
          ADMIN_TOTAL: ${{ steps.bootstrap.outputs.total }}
          SEASON_STATE: ${{ steps.season.outputs.state }}
          SEASON_YEAR: ${{ steps.season.outputs.year }}
          SITE_URL: ${{ steps.admin.outputs.site_url }}
          ROTATE_VAPID: ${{ steps.vapid.outputs.rotate }}
          SUBSCRIPTIONS: ${{ steps.vapid.outputs.subscriptions }}
          VAPID_PUBLIC_KEY: ${{ steps.vapid.outputs.public_key }}
        run: |
          {
            echo "## Customer Backend Setup — SUCCESS"
            echo
            echo "Database migrations, all six Edge Functions, the First Administrator and the open season are configured."
            echo
            echo "**First Administrator:** \`$ADMIN_LOGIN\` ($ADMIN_STATE)"
            echo
            echo "**Permissions verified from the database:** $ADMIN_GRANTED / $ADMIN_TOTAL"
            echo
            echo "**Open season:** Hijri year $SEASON_YEAR ($SEASON_STATE)"
            echo
            echo "**Supabase Auth (verified, read-only):** public sign-up off · anonymous sign-in off · Site URL \`$SITE_URL\`"
            echo
            echo "**ANTHROPIC_API_KEY:** present in Supabase Edge Function secrets (presence only). Before handover, scan a test/specimen passport image in the application (never real personal data), confirm the extracted fields are populated, and do not save the test pilgrim."
            echo
            if [ "$ROTATE_VAPID" = "true" ]; then
              echo "### One value to copy to Vercel"
              echo
              echo "\`VITE_VAPID_PUBLIC_KEY\`"
              echo
              echo "\`$VAPID_PUBLIC_KEY\`"
              echo
              echo "Use this public value only. The private VAPID key was stored in Supabase and was not printed."
            else
              echo "### Vercel: no change"
              echo
              echo "The existing VAPID key pair was kept because $SUBSCRIPTIONS device(s) are subscribed to notifications."
              echo "Leave \`VITE_VAPID_PUBLIC_KEY\` in Vercel as it is."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
