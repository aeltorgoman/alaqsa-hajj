# ════════════════════════════════════════════════════════════
# canonical production db push — M6 push delivery (20261019135129)
# ════════════════════════════════════════════════════════════
# Applies the ONE pending migration through the canonical CLI path
# (on the pattern of portal-limits-canonical-push.yml):
#   20261019135129_m6_push_delivery_targets
#
# Playbook order (M-52): run only AFTER PR #248 is merged, from main,
# and BEFORE send-pilgrim-push is redeployed (the new function fails
# closed without this schema; the old one runs unchanged on it).
#
# ⚠️ `--db-url`, not `--linked` (PR #148).
#
# Exactly ONE production-mutating command may run, and only after
# every gate passes. Deliberately absent, and audited for: migration
# repair · migration up · `--include-all` · manual SQL mutation ·
# rollback · baseline execution · any operation on a historical
# migration · any Dashboard action · any Edge Function deploy.
#
# The migration is additive: one new table (RLS on, no policies,
# service_role only), five service_role RPCs and five internal helpers
# nobody may execute. No existing row is written. Gates:
#   · BEFORE: file hash · pending set is exactly this migration · none of
#     the new objects exist · table/index inventory, every public function
#     ACL, delivery/announcement/subscription counts and the two L1 RPC
#     bodies captured.
#   · AFTER (independent catalog queries, M-54/M-55): ledger 70, originals
#     untouched · table, RLS, no policy, no client grant · RPCs SECURITY
#     DEFINER with fixed search_path, EXECUTE held by exactly
#     postgres + service_role · helpers held by postgres only · every
#     other function ACL unchanged · tables/indexes = before + exactly the
#     new ones · no existing row changed · L1 RPC bodies unchanged · a
#     read-only eligibility probe on a missing id answers not_found.
#   · Nothing is sent to any device. No live delivery probe runs.
#
# Running it twice is safe: after success nothing is pending, so the
# BEFORE gates fail and the second run stops before the write.

name: M6 push delivery - canonical production db push (ONE authorized write)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUSH-M6-20261019135129 to authorize the single production write"
        required: true
        default: ""
      db_host:
        description: "Session pooler host from dashboard > Connect (NOT a secret)"
        required: true
        default: "aws-1-eu-central-1.pooler.supabase.com"
      db_port:
        description: "Session pooler port (NOT a secret)"
        required: true
        default: "5432"
      db_user:
        description: "Session pooler user (NOT a secret)"
        required: true
        default: "postgres.zkucwcnclbfvukhdqhgc"

permissions:
  contents: read

concurrency:
  group: m6-push-delivery-canonical-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      M6: "20261019135129"
      F6: supabase/migrations/20261019135129_m6_push_delivery_targets.sql
      SHA6: "b3a82e8d231a6da192d69725f24e96dac33b99ee481e2f5e5068915c63040681"
      EXPECT_REPO_MIGRATIONS: "70"
      EXPECT_ROWS_BEFORE: "69"
      EXPECT_LATEST_BEFORE: "20261019112208"
      EXPECT_ROWS_AFTER: "70"
      # L1 RPC bodies (md5 of prosrc) verified read-only on production 2026-10-19
      MD5_AUDIENCE: "384fcdeb01c20ed9c9eb640ff90d4df2"
      MD5_PUSH_ENABLED: "6b6d92242c23f7294afcfc9ee6a12dab"
      NEW_TABLE: "public.announcement_push_targets"
      NEW_INDEXES: "public.announcement_push_targets_announcement_id_subscription_id_key,public.announcement_push_targets_claim_idx,public.announcement_push_targets_passenger_idx,public.announcement_push_targets_pkey,public.announcement_push_targets_subscription_idx"
      RPCS: "push_announcement_ineligible_reason(bigint) push_prepare_announcement(bigint) push_claim_targets(bigint,uuid,integer,integer) push_complete_target(bigint,uuid,integer,text,integer,text) push_delivery_summary(bigint)"
      HELPERS: "_push_ineligible_reason(bigint) _push_lock(bigint) _push_refresh_delivery(bigint,bigint) _push_finalize(bigint) _push_close_targets(bigint,bigint[],text) _push_cancel_open(bigint)"
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}
      OUT: m6-push-evidence

    steps:
      - name: "GATE: confirmation, ref and secrets"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "PUSH-M6-20261019135129" ] || {
            echo "::error::confirmation string does not match - dispatch was not authorized"; exit 1; }
          # M-52: apply after merge, never before
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::must run from main (M-52), got ${GITHUB_REF}"; exit 1; }
          [ -n "${PGPASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD is not set"; exit 1; }
          echo "Authorized. Secret present (value not printed)."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: toolchain and the exact migration under review"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is not available"; exit 1; }
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq "$EXPECT_REPO_MIGRATIONS" ] || { echo "::error::expected $EXPECT_REPO_MIGRATIONS repository migrations, found $n"; exit 1; }
          git diff --quiet -- supabase/migrations || { echo "::error::supabase/migrations is dirty"; exit 1; }
          [ -f "$F6" ] || { echo "::error::$F6 missing"; exit 1; }
          got="$(sha256sum "$F6" | cut -d' ' -f1)"
          [ "$got" = "$SHA6" ] || { echo "::error::$F6 sha256 mismatch: $got != $SHA6"; exit 1; }
          echo "ok   $(basename "$F6")  $got"
          python3 supabase/verification/assert-no-toplevel-data-writes.py --selftest
          python3 supabase/verification/assert-no-toplevel-data-writes.py "$F6"
          python3 supabase/verification/assert-ledger-correspondence.py --selftest
          { echo "commit=${GITHUB_SHA}"; echo "ref=${GITHUB_REF}"; echo "cli=$v"; } | tee "$OUT/run-sha.txt"

      - name: "GATE: ledger BEFORE = 69 / 20261019112208"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          Q="select version || E'\t' || coalesce(name,'') || E'\t'
                  || coalesce(encode(sha256(convert_to(statements[1],'UTF8')),'hex'),'NULL')
               from supabase_migrations.schema_migrations order by version"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$Q" > "$OUT/ledger-before.tsv"
          rows="$(wc -l < "$OUT/ledger-before.tsv")"
          latest="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          echo "rows=$rows latest=$latest" | tee "$OUT/ledger-before.txt"
          [ "$rows" -eq "$EXPECT_ROWS_BEFORE" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS_BEFORE"; exit 1; }
          [ "$latest" = "$EXPECT_LATEST_BEFORE" ] || { echo "::error::latest is $latest, expected $EXPECT_LATEST_BEFORE"; exit 1; }
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
            -c "select version from supabase_migrations.schema_migrations order by version" > "$OUT/ledger-versions-before.txt"

      - name: "GATE: pending set is exactly 20261019135129"
        run: |
          set -euo pipefail
          python3 supabase/verification/assert-ledger-correspondence.py \
            supabase/migrations "$OUT/ledger-versions-before.txt" \
            "$EXPECT_ROWS_BEFORE" "$EXPECT_LATEST_BEFORE" > "$OUT/correspondence-before.txt" 2>&1 || true
          cat "$OUT/correspondence-before.txt"
          grep -q "repository versions absent from production: \['${M6}'\]" "$OUT/correspondence-before.txt" || {
            echo "::error::the pending set is not exactly [$M6]"; exit 1; }
          grep -q "ok   no unexpected production migration" "$OUT/correspondence-before.txt" || {
            echo "::error::production carries a migration the repository does not"; exit 1; }

      - name: "GATE: production preconditions"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1"; }
          bad=0
          t="$(p "select count(*) from pg_class where oid = to_regclass('$NEW_TABLE')")"
          [ "$t" -eq 0 ] || { echo "::error::$NEW_TABLE already exists"; bad=1; }
          for fn in $RPCS $HELPERS; do
            e="$(p "select count(*) from pg_proc where oid = to_regprocedure('public.$fn')")"
            [ "$e" -eq 0 ] || { echo "::error::public.$fn already exists"; bad=1; }
          done
          for dep in "reject_write_closed_season_derived()" "active_season_id()" "announcement_audience(text,bigint[])" "has_permission(text)"; do
            e="$(p "select count(*) from pg_proc where oid = to_regprocedure('public.$dep')")"
            [ "$e" -eq 1 ] || { echo "::error::dependency public.$dep missing"; bad=1; }
          done
          u="$(p "select count(*) from pg_constraint where conname = 'notification_deliveries_announcement_id_passenger_id_key'")"
          [ "$u" -eq 1 ] || { echo "::error::notification_deliveries unique key missing"; bad=1; }
          a="$(p "select md5(prosrc) from pg_proc where oid = to_regprocedure('public.announcement_audience(text,bigint[])')")"
          [ "$a" = "$MD5_AUDIENCE" ] || { echo "::error::announcement_audience body differs: $a"; bad=1; }
          e="$(p "select md5(prosrc) from pg_proc where oid = to_regprocedure('public.push_enabled_passengers()')")"
          [ "$e" = "$MD5_PUSH_ENABLED" ] || { echo "::error::push_enabled_passengers body differs: $e"; bad=1; }
          # جردٌ قبلُ: الجداول والفهارس وصلاحيات الدوالّ والأعداد — يجب ألّا يتغيّر إلا ما تضيفه الترحيلة
          p "select string_agg(schemaname||'.'||tablename, ',' order by schemaname, tablename) from pg_tables where schemaname in ('public','storage')" > "$OUT/tables-before.txt"
          p "select string_agg(schemaname||'.'||indexname, ',' order by schemaname, indexname) from pg_indexes where schemaname in ('public','storage')" > "$OUT/indexes-before.txt"
          p "select string_agg(p.oid::regprocedure::text || '=' || coalesce(p.proacl::text,'(default)'), E'\n' order by p.oid::regprocedure::text) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'" > "$OUT/fn-acl-before.txt"
          # بصماتٌ بلا بيانات شخصية: أعدادٌ ومجاميعُ تجزئة على المعرّفات والحالات وحدها
          p "select coalesce(md5(string_agg(id||':'||announcement_id||':'||passenger_id||':'||status||':'||coalesce(read_at::text,'-'),'|' order by id)),'(none)') from public.notification_deliveries" > "$OUT/nd-fp-before.txt"
          p "select coalesce(md5(string_agg(id||':'||coalesce(push_sent_at::text,'-')||':'||coalesce(expires_at::text,'-'),'|' order by id)),'(none)') from public.announcements" > "$OUT/ann-fp-before.txt"
          p "select coalesce(md5(string_agg(id||':'||passenger_id,'|' order by id)),'(none)') from public.pilgrim_push_subscriptions" > "$OUT/subs-fp-before.txt"
          p "select count(*) from public.passengers" > "$OUT/psg-n-before.txt"
          p "select coalesce(string_agg(status||'='||n, ',' order by status),'') from (select status, count(*) n from public.notification_deliveries group by status) s" | tee "$OUT/nd-status-before.txt"
          [ "$bad" -eq 0 ] || { echo "::error::preconditions failed - nothing was written"; exit 1; }
          echo "All preconditions PASS."

      # ════════════════════════════════════════════════════════
      # THE ONE AUTHORIZED PRODUCTION WRITE
      # ════════════════════════════════════════════════════════
      - name: "LIVE WRITE: canonical db push"
        id: live_push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DB_URL="$(python3 -c "import os,urllib.parse as u; print('postgresql://%s:%s@%s:%s/postgres' % (u.quote(os.environ['DB_USER'],safe=''), u.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''), os.environ['DB_HOST'], os.environ['DB_PORT']))")"
          echo "::add-mask::$DB_URL"
          set +e
          npm run --silent supabase -- db push --db-url "$DB_URL" --output-format json > "$OUT/push.json" 2> "$OUT/push.err"
          rc=$?
          set -e
          sed -E -i 's#postgres(ql)?://[^ ]*@#postgresql://***@#g' "$OUT/push.json" "$OUT/push.err" 2>/dev/null || true
          echo "--- stdout ---"; cat "$OUT/push.json"
          echo "--- stderr ---"; cat "$OUT/push.err"
          [ "$rc" -eq 0 ] || { echo "::error::db push failed with rc=$rc"; exit 1; }

      - name: "POST: ledger 69 -> 70, originals untouched"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          Q="select version || E'\t' || coalesce(name,'') || E'\t'
                  || coalesce(encode(sha256(convert_to(statements[1],'UTF8')),'hex'),'NULL')
               from supabase_migrations.schema_migrations order by version"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$Q" > "$OUT/ledger-after.tsv"
          rows="$(wc -l < "$OUT/ledger-after.tsv")"
          latest="$(psql "$URL" -X -q -At -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          echo "rows=$rows latest=$latest" | tee "$OUT/ledger-after.txt"
          bad=0
          [ "$rows" -eq "$EXPECT_ROWS_AFTER" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS_AFTER"; bad=1; }
          [ "$latest" = "$M6" ] || { echo "::error::latest is $latest, expected $M6"; bad=1; }
          nm="$(psql "$URL" -X -q -At -c "$RO" -c "select name from supabase_migrations.schema_migrations where version='$M6'")"
          [ "$nm" = "m6_push_delivery_targets" ] || { echo "::error::recorded name '$nm' does not match the repository filename"; bad=1; }
          grep -vE "^$M6	" "$OUT/ledger-after.tsv" > "$OUT/ledger-after-originals.tsv"
          diff -u "$OUT/ledger-before.tsv" "$OUT/ledger-after-originals.tsv" > "$OUT/ledger-originals.diff" || {
            echo "::error::one or more original ledger rows changed"; cat "$OUT/ledger-originals.diff"; bad=1; }
          psql "$URL" -X -q -At -c "$RO" -c "select version from supabase_migrations.schema_migrations order by version" > "$OUT/ledger-versions-after.txt"
          python3 supabase/verification/assert-ledger-correspondence.py \
            supabase/migrations "$OUT/ledger-versions-after.txt" "$EXPECT_ROWS_AFTER" "$M6" \
            | tee "$OUT/correspondence-after.txt" || bad=1
          if [ "$bad" -eq 0 ]; then echo PASS > "$OUT/status-ledger.txt"; else echo FAIL > "$OUT/status-ledger.txt"; fi
          echo "Ledger verdict: $(cat "$OUT/status-ledger.txt")"

      - name: "POST: table, RPCs, grants, and no existing row changed"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1"; }
          bad=0
          want() { got="$(p "$2")"; if [ "$got" = "$3" ]; then printf 'ok   %-46s %s\n' "$1" "$got"
                   else echo "::error::$1 = '$got', expected '$3'"; bad=1; fi }
          T="'$NEW_TABLE'"
          want table_exists            "select count(*) from pg_class where oid = to_regclass($T)" 1
          want table_rls_on            "select relrowsecurity::text from pg_class where oid = to_regclass($T)" true
          want table_no_policy         "select count(*) from pg_policies where schemaname='public' and tablename='announcement_push_targets'" 0
          want table_anon_none         "select (has_table_privilege('anon', $T, 'SELECT') or has_table_privilege('anon', $T, 'INSERT') or has_table_privilege('anon', $T, 'UPDATE') or has_table_privilege('anon', $T, 'DELETE'))::text" false
          want table_auth_none         "select (has_table_privilege('authenticated', $T, 'SELECT') or has_table_privilege('authenticated', $T, 'INSERT') or has_table_privilege('authenticated', $T, 'UPDATE') or has_table_privilege('authenticated', $T, 'DELETE'))::text" false
          want table_service_select    "select has_table_privilege('service_role', $T, 'SELECT')::text" true
          want table_closed_season_trg "select count(*) from pg_trigger where tgrelid = to_regclass($T) and tgname = 'trg_reject_closed_season' and not tgisinternal" 1
          want table_empty             "select count(*) from public.announcement_push_targets" 0
          for fn in $RPCS; do
            F="'public.$fn'"
            want "rpc ${fn%%(*} definer"       "select prosecdef::text from pg_proc where oid = to_regprocedure($F)" true
            want "rpc ${fn%%(*} search_path"   "select (proconfig @> array['search_path=public, pg_temp'])::text from pg_proc where oid = to_regprocedure($F)" true
            # Exact EXECUTE holder set, sorted deterministically. Any extra role changes the string.
            want "rpc ${fn%%(*} exec holders"  "select coalesce(string_agg(h, ',' order by h collate \"C\"), '') from (select distinct coalesce(r.rolname,'PUBLIC') h from pg_proc p, aclexplode(p.proacl) a left join pg_roles r on r.oid = a.grantee where p.oid = to_regprocedure($F) and a.privilege_type = 'EXECUTE') s" "postgres,service_role"
          done
          for fn in $HELPERS; do
            F="'public.$fn'"
            want "helper ${fn%%(*} exec holders" "select coalesce(string_agg(h, ',' order by h collate \"C\"), '') from (select distinct coalesce(r.rolname,'PUBLIC') h from pg_proc p, aclexplode(p.proacl) a left join pg_roles r on r.oid = a.grantee where p.oid = to_regprocedure($F) and a.privilege_type = 'EXECUTE') s" "postgres"
          done
          # الدوالُّ الجديدة لم تكن موجودةً قبلُ (بوابة الشروط)، فما عداها يطابق جردَ ما قبلُ حرفاً
          want other_fn_acls_unchanged "select string_agg(p.oid::regprocedure::text || '=' || coalesce(p.proacl::text,'(default)'), E'\n' order by p.oid::regprocedure::text) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname not in ('push_announcement_ineligible_reason','push_prepare_announcement','push_claim_targets','push_complete_target','push_delivery_summary','_push_ineligible_reason','_push_lock','_push_refresh_delivery','_push_finalize','_push_close_targets','_push_cancel_open')" "$(cat "$OUT/fn-acl-before.txt")"
          # الجداولُ والفهارسُ: ما قبلُ + الجديدُ بالضبط، لا أقلّ ولا أكثر
          want tables_before_plus_new  "select string_agg(t, ',' order by t) from (select schemaname||'.'||tablename t from pg_tables where schemaname in ('public','storage')) s" \
            "$( (tr ',' '\n' < "$OUT/tables-before.txt"; echo "$NEW_TABLE") | grep -v '^$' | LC_ALL=C sort | paste -sd, )"
          want indexes_before_plus_new "select string_agg(i, ',' order by i) from (select schemaname||'.'||indexname i from pg_indexes where schemaname in ('public','storage')) s" \
            "$( (tr ',' '\n' < "$OUT/indexes-before.txt"; echo "$NEW_INDEXES" | tr ',' '\n') | grep -v '^$' | LC_ALL=C sort | paste -sd, )"
          want deliveries_unchanged    "select coalesce(md5(string_agg(id||':'||announcement_id||':'||passenger_id||':'||status||':'||coalesce(read_at::text,'-'),'|' order by id)),'(none)') from public.notification_deliveries" "$(cat "$OUT/nd-fp-before.txt")"
          want announcements_unchanged "select coalesce(md5(string_agg(id||':'||coalesce(push_sent_at::text,'-')||':'||coalesce(expires_at::text,'-'),'|' order by id)),'(none)') from public.announcements" "$(cat "$OUT/ann-fp-before.txt")"
          want subscriptions_unchanged "select coalesce(md5(string_agg(id||':'||passenger_id,'|' order by id)),'(none)') from public.pilgrim_push_subscriptions" "$(cat "$OUT/subs-fp-before.txt")"
          want passengers_count        "select count(*) from public.passengers" "$(cat "$OUT/psg-n-before.txt")"
          want l1_audience_body        "select md5(prosrc) from pg_proc where oid = to_regprocedure('public.announcement_audience(text,bigint[])')" "$MD5_AUDIENCE"
          want l1_push_enabled_body    "select md5(prosrc) from pg_proc where oid = to_regprocedure('public.push_enabled_passengers()')" "$MD5_PUSH_ENABLED"
          # استعلامٌ للقراءة وحدها: معرّفٌ لا وجود له لا يُهيّأ ولا يُرسَل
          want probe_not_found         "select public.push_announcement_ineligible_reason(-1)" "not_found"
          if [ "$bad" -eq 0 ]; then echo PASS > "$OUT/status-surface.txt"; else echo FAIL > "$OUT/status-surface.txt"; fi
          echo "Surface verdict: $(cat "$OUT/status-surface.txt")"

      - name: "Verdict (fails the run)"
        if: always() && steps.live_push.outcome != 'skipped'
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bad=0
          for k in ledger surface; do
            f="$OUT/status-$k.txt"
            if [ ! -s "$f" ]; then printf '%-10s %s\n' "$k" "NOT REACHED"; bad=1
            else v="$(cat "$f")"; printf '%-10s %s\n' "$k" "$v"; [ "$v" = "PASS" ] || bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then echo FAIL > "$OUT/verdict.txt"; exit 1; fi
          echo PASS > "$OUT/verdict.txt"
          echo "Migration $M6 applied; ledger 70; table, RPCs and grants as approved; no existing row changed."
          echo "NEXT (separate approval): send-pilgrim-push-redeploy.yml from main."

      - name: "Scan evidence for secret-like material"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|postgres(ql)?://[^ ]*:[^ ]*@" "$OUT"; then
            echo "::error::secret-like material found in the evidence - upload blocked"; exit 1
          fi
          echo "Evidence secret scan clean."

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m6-push-delivery-canonical-push
          path: m6-push-evidence
          if-no-files-found: warn
