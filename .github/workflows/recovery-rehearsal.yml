# ════════════════════════════════════════════════════════════
# التمرينُ التشغيليّ — إعادةُ البناء من الصفر ثمّ إقفالُ موسم
# ════════════════════════════════════════════════════════════
# يعمل على مشروعٍ **مُخصَّصٍ للإتلاف** وحده. الإنتاجُ لا يُلمَس.
#
# ⚠️ الحارس: `supabase/verification/assert-not-production.sh`
# يُستدعى في **كلّ** خطوةٍ تفتح اتصالاً أو تكتب — لا مرّةً واحدةً
# في الأعلى. ترتيبُ الخطوات ليس ضماناً، ونيّةُ المُشغِّل ليست
# ضماناً. ويرفض الحارسُ ثلاثةَ أشياء لا واحداً: مرجعَ الإنتاج،
# وأيَّ مرجعٍ غيرِ مرجعِ التمرين المتوقَّع، وأيَّ رابطِ اتصالٍ لا
# يحمل مرجعَ الهدف أو يحمل مرجعَ الإنتاج.
#
# هذا التمرينُ **هدّام على هدفه**: يمسح المخطّطَ والمستخدمين
# والتخزين ثمّ يعيد البناء من `main`. وهو عينُ الهدف — إثباتُ أن
# المستودعَ وحده يُنتج نظاماً صالحاً للتشغيل، لا ترقيةُ قاعدةٍ قديمة.

name: Operational rehearsal - rebuild from main, then close a season

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REHEARSE-ON-DISPOSABLE-PROJECT to authorize destructive work on the temp project"
        required: true
        default: ""
      db_host:
        description: "Session pooler host (NOT a secret)"
        required: true
        default: "aws-1-eu-central-1.pooler.supabase.com"
      db_port:
        description: "Session pooler port (NOT a secret)"
        required: true
        default: "5432"

permissions:
  contents: read

concurrency:
  group: recovery-rehearsal
  cancel-in-progress: false

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    env:
      TMP_REF: ${{ secrets.TMP_PROJECT_REF }}
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      OUT: rehearsal-evidence
      GUARD: supabase/verification/assert-not-production.sh

    steps:
      - name: "GATE: confirmation and secrets present"
        env:
          PW: ${{ secrets.TMP_DB_PASSWORD }}
          SK: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
          AE: ${{ secrets.TMP_ADMIN_EMAIL }}
          AP: ${{ secrets.TMP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "REHEARSE-ON-DISPOSABLE-PROJECT" ] || {
            echo "::error::confirmation string does not match"; exit 1; }
          for n in TMP_REF PW SK AE AP; do
            [ -n "${!n:-}" ] || { echo "::error::$n is not set"; exit 1; }
          done
          echo "Authorized. All five temp secrets present (values not printed)."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ⚠️ 22 لا 20: `@supabase/supabase-js` يبني عميلَ Realtime عند
          #    `createClient`، وهو يتطلّب WebSocket أصليّاً لا يوجد قبل
          #    Node 22. و`seed_first_admin.mjs` يسقط عند أوّل سطرٍ منه.
          node-version: "22"

      - name: "Install dependencies (the admin bootstrap imports supabase-js)"
        run: |
          set -euo pipefail
          # `npm run supabase` يمرّ بـ npx فلا يحتاج تثبيتاً، لكن
          # `seed_first_admin.mjs` يستورد `@supabase/supabase-js`
          # استيراداً حقيقياً. وبلا تثبيتٍ يسقط عند أول سطر.
          npm ci --omit=dev --no-audit --no-fund
          node -e "import('@supabase/supabase-js').then(()=>console.log('  supabase-js importable')).catch(e=>{console.error(e.message);process.exit(1)})"

      - name: "GATE: the target is the disposable project, not production"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          chmod +x "$GUARD"
          "$GUARD" "$TMP_REF"
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 51 ] || { echo "::error::expected 51 repository migrations, found $n"; exit 1; }
          { echo "main_commit=${GITHUB_SHA}"; echo "cli=$v"; echo "repo_migrations=$n";
            echo "target_ref=$TMP_REF"; echo "target_is_production=false"; } | tee "$OUT/identity.txt"

      # ── PREFLIGHT — قراءةٌ فقط قبل أيّ إتلاف ──────────────────
      - name: "GATE: resolve the pooler host that actually serves this project"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF"
          # مضيفُ المجمِّع ليس واحداً لكلّ المشاريع ولو اتّحد الإقليم،
          # ولا تُرجعه واجهةُ الإدارة. فيُجرَّب المرشّحون بالترتيب
          # ويُثبَّت أوّلُ من يردّ — بدل تخمينٍ يُخفق بعد الكتابة.
          found=""
          for h in "$DB_HOST" aws-0-eu-central-1.pooler.supabase.com aws-1-eu-central-1.pooler.supabase.com; do
            U="postgresql://postgres.${TMP_REF}@${h}:${DB_PORT}/postgres"
            "$GUARD" "$TMP_REF" "$U" >/dev/null
            if psql "$U" -X -q -At -v ON_ERROR_STOP=1 -c "select 1" >/dev/null 2>&1; then
              found="$h"; echo "  pooler host resolved: $h"; break
            fi
            echo "  not served by: $h"
          done
          [ -n "$found" ] || { echo "::error::no candidate pooler host serves this project"; exit 1; }
          echo "DB_HOST=$found" >> "$GITHUB_ENV"
          echo "pooler_host=$found" | tee -a "$OUT/identity.txt"

      - name: "PREFLIGHT: inspect the temp project read-only"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          # ⚠️ لا تُكتب القيمةُ داخل `echo` مباشرةً: إخفاقُ psql في
          #    استبدالِ أمرٍ لا يُوقف الخطوة تحت `set -e`، فتُطبع قيمةٌ
          #    فارغةٌ وتُقرأ الخطوةُ ناجحةً وقاعدةٌ لم تُبلَغ أصلاً.
          #    تُسنَد أوّلاً، فيسري الإخفاق.
          q() { local v; v="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1")"; printf '%s' "$v"; }
          a="$(q "select count(*) from information_schema.schemata where schema_name='supabase_migrations'")"
          b="$(q "select count(*) from information_schema.tables where table_schema='public'")"
          # ⚠️ جدولٌ غيرُ موجودٍ يُخفق عند **التحليل** لا عند التنفيذ،
          #    فلا يعصمه `coalesce`. والمشروعُ قد يكون فارغاً تماماً —
          #    وهي حالةٌ مشروعةٌ يجب وصفُها لا الإخفاقُ عندها.
          cnt() {
            local t="$1" e
            e="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
                 -c "select count(*) from information_schema.tables where table_schema='public' and table_name='$t'")"
            if [ "$e" = "1" ]; then q "select count(*) from public.$t"; else printf '%s' "-1"; fi
          }
          c="$(cnt seasons)"
          d="$(cnt passengers)"
          e="$(q "select count(*) from auth.users")"
          f="$(q "select count(*) from storage.buckets")"
          g="$(q "select count(*) from storage.objects")"
          h="$(q "select count(*) from information_schema.columns where table_schema='public' and table_name='financial_groups' and column_name='season_id'")"
          for v in "$a" "$b" "$c" "$d" "$e" "$f" "$g" "$h"; do
            [ -n "$v" ] || { echo "::error::preflight read returned nothing - the database was not reached"; exit 1; }
          done
          {
            echo "ledger_schema_present=$a"
            echo "public_tables=$b"
            echo "seasons=$c"
            echo "passengers=$d"
            echo "auth_users=$e"
            echo "storage_buckets=$f"
            echo "storage_objects=$g"
            echo "financial_groups_has_season_id=$h"
          } | tee "$OUT/preflight-temp.txt"

      # ── BASELINE — الحالةُ النظيفة ────────────────────────────
      - name: "GATE: the rehearsal token can reach this project's functions"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.TMP_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF"
          # ⚠️ يُسأل قبل الهدم لا بعده. رمزُ الإنتاج يردّ ٤٠٣ هنا،
          #    وقد اكتُشف ذلك في التشغيل السابق **بعد** أن هُدم
          #    المشروعُ وأُعيد بناؤه — فبقي نصفَ مُمرَّن. ومشروعٌ
          #    لا نستطيع إتمامَ التمرين عليه لا يُهدَم أصلاً.
          if ! npm run --silent supabase -- functions list --project-ref "$TMP_REF" \
                 > "$OUT/functions-before.txt" 2> "$OUT/functions-before.err"; then
            echo "::error::the rehearsal token cannot reach this project's Edge Functions."
            echo "::error::Nothing was torn down. Provide a token scoped to the rehearsal project."
            sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g' "$OUT/functions-before.err" | tail -5
            exit 1
          fi
          rm -f "$OUT/functions-before.err"
          echo "  token ok: Edge Functions reachable on the rehearsal project"

      - name: "BASELINE: wipe auth and storage through their APIs, then rebuild the schema"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
          SUPABASE_DB_PASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
          API: https://${{ secrets.TMP_PROJECT_REF }}.supabase.co
          SK: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF" "$API"
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"

          # ⚠️ التخزينُ لا يُمسح بـ SQL: `storage.protect_delete()` ترفض
          #    الحذفَ المباشر وتُحيل إلى واجهة التخزين — وهي محقّة، فحذفُ
          #    الصفّ دون الكائن يترك يتيماً. فتُستعمل الواجهةُ المدعومة.
          buckets="$(curl -s "$API/storage/v1/bucket" -H "Authorization: Bearer $SK" -H "apikey: $SK" \
                     | python3 -c 'import sys,json;print(" ".join(b["id"] for b in (json.load(sys.stdin) or [])))')"
          for b in $buckets; do
            curl -s -o /dev/null -X POST "$API/storage/v1/bucket/$b/empty" -H "Authorization: Bearer $SK" -H "apikey: $SK"
            curl -s -o /dev/null -X DELETE "$API/storage/v1/bucket/$b"      -H "Authorization: Bearer $SK" -H "apikey: $SK"
            echo "  emptied and removed bucket: $b"
          done

          # وحساباتُ الهوية تُحذف بواجهة الإدارة لا بـ SQL، للسبب نفسه:
          # `auth.users` يملكها دورٌ آخر، وللحذف آثارٌ تتولّاها الخدمة.
          ids="$(curl -s "$API/auth/v1/admin/users?per_page=1000" -H "Authorization: Bearer $SK" -H "apikey: $SK" \
                 | python3 -c 'import sys,json;print(" ".join(u["id"] for u in (json.load(sys.stdin) or {}).get("users",[])))')"
          n=0; for u in $ids; do
            curl -s -o /dev/null -X DELETE "$API/auth/v1/admin/users/$u" -H "Authorization: Bearer $SK" -H "apikey: $SK"
            n=$((n+1))
          done
          echo "  removed $n auth user(s)"

          # والمخطّطُ يُهدم صراحةً ثمّ يُبنى بالترحيلات — لا ترقيةَ فوق
          # بقايا. وهذا ما يُثبِت أن المستودعَ وحده يُنتج النظام.
          # ⚠️ سياساتُ التخزين تعيش في schema `storage` لا في `public`،
          #    فلا يُسقطها هدمُ `public`. وترحيلةُ الأساس تُنشئها بـ
          #    `create policy` بلا `if not exists`، فتصطدم بما خلّفه
          #    تمرينٌ سابق وتتوقّف الدفعةُ عند الترحيلة ٤٧ من ٥١.
          #    وهذا أثرٌ حقيقيّ: المجموعةُ تُعاد على مشروعٍ جديدٍ بلا
          #    عناء، لكنها لا تُعاد على مشروعٍ يحمل هذه السياسات سلفاً.
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "
            do \$\$
            declare r record;
            begin
              for r in select policyname, schemaname, tablename
                         from pg_policies where schemaname = 'storage'
              loop
                execute format('drop policy if exists %I on %I.%I',
                               r.policyname, r.schemaname, r.tablename);
              end loop;
            end \$\$;"
          sp="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "select count(*) from pg_policies where schemaname='storage'")"
          [ "$sp" -eq 0 ] || { echo "::error::$sp storage policies survived the teardown"; exit 1; }
          echo "  storage policies cleared: 0 remain"

          psql "$URL" -X -q -v ON_ERROR_STOP=1 \
            -c "drop schema if exists public cascade" \
            -c "create schema public" \
            -c "alter schema public owner to postgres" \
            -c "grant usage on schema public to anon, authenticated, service_role" \
            -c "grant all on schema public to postgres, service_role" \
            -c "drop schema if exists supabase_migrations cascade"
          left="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "select count(*) from information_schema.tables where table_schema='public'")"
          [ "$left" -eq 0 ] || { echo "::error::public schema still holds $left tables after teardown"; exit 1; }
          echo "  public schema torn down: 0 tables"

          DB_URL="$(python3 -c "import os,urllib.parse as u; print('postgresql://%s:%s@%s:%s/postgres' % (u.quote('postgres.'+os.environ['TMP_REF'],safe=''), u.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''), os.environ['DB_HOST'], os.environ['DB_PORT']))")"
          echo "::add-mask::$DB_URL"
          "$GUARD" "$TMP_REF" "$DB_URL"
          npm run --silent supabase -- db push --db-url "$DB_URL" --include-all --output-format json > "$OUT/push.json" 2> "$OUT/push.err" || {
            echo "::error::db push failed"; sed -E 's#postgres(ql)?://[^ ]*@#postgresql://***@#g' "$OUT/push.err"; exit 1; }
          sed -E -i 's#postgres(ql)?://[^ ]*@#postgresql://***@#g' "$OUT/push.json" "$OUT/push.err" || true
          {
            echo "method=explicit teardown of public + supabase_migrations, then canonical db push of all 51 migrations"
            echo "storage=emptied and buckets removed via the Storage API (SQL deletion is refused by storage.protect_delete)"
            echo "auth=users removed via the Auth Admin API (no auth.users transplant, no SQL delete)"
          } | tee "$OUT/baseline-method.txt"

      - name: "A2/A3: ledger 51, correspondence, and company_config seeded"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1"; }
          rows="$(p "select count(*) from supabase_migrations.schema_migrations")"
          latest="$(p "select max(version) from supabase_migrations.schema_migrations")"
          cc="$(p "select count(*) from public.company_config")"
          cc1="$(p "select count(*) from public.company_config where id = 1")"
          echo "ledger_rows=$rows latest=$latest company_config_rows=$cc company_config_id1=$cc1" | tee "$OUT/phase-a-ledger.txt"
          bad=0
          [ "$rows" -eq 51 ] || { echo "::error::ledger holds $rows rows, expected 51"; bad=1; }
          [ "$latest" = "20260924140000" ] || { echo "::error::latest is $latest, expected 20260924140000"; bad=1; }
          [ "$cc" -eq 1 ]  || { echo "::error::company_config holds $cc rows, expected exactly 1 (#17)"; bad=1; }
          [ "$cc1" -eq 1 ] || { echo "::error::company_config has no id = 1 (#17)"; bad=1; }
          p "select version from supabase_migrations.schema_migrations order by version" > "$OUT/ledger-versions.txt"
          python3 supabase/verification/assert-ledger-correspondence.py \
            supabase/migrations "$OUT/ledger-versions.txt" 51 "20260924140000" \
            | tee "$OUT/correspondence.txt" || bad=1
          [ "$bad" -eq 0 ] && echo PASS > "$OUT/status-a-ledger.txt" || echo FAIL > "$OUT/status-a-ledger.txt"
          echo "A2/A3 verdict: $(cat "$OUT/status-a-ledger.txt")"
          [ "$bad" -eq 0 ]

      - name: "A4: synthetic test seasons"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -f supabase/scripts/seed_test_seasons.sql > "$OUT/seed.log" 2>&1 || {
            echo "::error::seeding failed"; tail -40 "$OUT/seed.log"; exit 1; }
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 \
            -c "select 'seasons='||count(*) from public.seasons" \
            -c "select 'passengers='||count(*) from public.passengers" \
            -c "select 'open_seasons='||count(*) from public.seasons where closed_at is null" \
            | tee "$OUT/phase-a-seed.txt"

      - name: "A5: first admin through the approved bootstrap"
        env:
          SUPABASE_URL: https://${{ secrets.TMP_PROJECT_REF }}.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
          ADMIN_EMAIL: ${{ secrets.TMP_ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.TMP_ADMIN_PASSWORD }}
          ADMIN_NAME: "مدير التمرين"
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF" "$SUPABASE_URL"
          # لا تُنقل صفوفُ `auth.users` من الإنتاج — يُنشأ الحسابُ
          # بالمسار المعتمد، وهو بالضبط ما تعثّر عليه التمرينُ السابق.
          # ⚠️ `printf` يُغلق المجرى بعد سطره، وواجهةُ readline تُنشأ
          #    عند تحميل السكربت فتُغلق مع النهاية — ثمّ يُسأل التأكيدُ
          #    بعد ذلك فيُرمى `ERR_USE_AFTER_CLOSE`. و`yes` تُبقي المجرى
          #    مفتوحاً حتى يخرج node. و`pipefail` كانت ستقرأ خروجَ `yes`
          #    بـ SIGPIPE إخفاقاً، فيُؤخَذ رمزُ node نفسِه من PIPESTATUS.
          set +o pipefail
          yes 'نعم' 2>/dev/null | node supabase/scripts/seed_first_admin.mjs > "$OUT/admin.log" 2>&1
          rc=${PIPESTATUS[1]}
          set -o pipefail
          [ "$rc" -eq 0 ] || {
            echo "::error::first-admin bootstrap failed (rc=$rc)"
            sed -E 's/eyJ[A-Za-z0-9_.-]{20,}/***/g' "$OUT/admin.log" | tail -30; exit 1; }
          sed -E -i 's/eyJ[A-Za-z0-9_.-]{20,}/***/g' "$OUT/admin.log"
          grep -E "permissions|user_profiles" "$OUT/admin.log" | tail -5 || true
          echo "first admin created via seed_first_admin.mjs (no auth.users transplant)" | tee "$OUT/phase-a-admin.txt"

      - name: "Deploy the three functions the rehearsal exercises"
        env:
          # ⚠️ رمزُ الإنتاج مقصورٌ عليه، فيردّ ٤٠٣ هنا. ويُفضَّل
          #    `TMP_ACCESS_TOKEN` إن وُجد — وهو ما يفتح أ٨ و ب٣.
          SUPABASE_ACCESS_TOKEN: ${{ secrets.TMP_ACCESS_TOKEN || secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF"
          for s in season-admin pilgrim-doc user-admin; do
            npm run --silent supabase -- functions deploy "$s" --project-ref "$TMP_REF" 2>&1 \
              | sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g'
          done

      - name: "A6/A7/A8/A9/A10: storage, relationships, document, staff auth, portal auth"
        env:
          API: https://${{ secrets.TMP_PROJECT_REF }}.supabase.co
          SK: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
          AE: ${{ secrets.TMP_ADMIN_EMAIL }}
          AP: ${{ secrets.TMP_ADMIN_PASSWORD }}
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF" "$API"
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$1"; }
          bad=0
          say() { printf '  %-46s %s\n' "$1" "$2"; }

          # ── A6 — تخزينٌ بملفٍّ اصطناعيّ
          PID="$(p "select id from public.passengers where season_id = public.active_season_id() order by id limit 1")"
          # ⚠️ الحاوية تقبل `{image/jpeg,image/png,image/webp,application/pdf}`
          #    وحدها. وكان المسبار يرفع `text/plain` فيُردّ ٤٠٠ — والحارسُ
          #    مُحقّ، والبيانةُ هي الخاطئة. فيُرفع PDF صغيرٌ صحيح.
          printf '%%PDF-1.4\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\n2 0 obj<</Type/Pages/Kids[3 0 R]/Count 1>>endobj\n3 0 obj<</Type/Page/Parent 2 0 R/MediaBox[0 0 200 200]>>endobj\ntrailer<</Root 1 0 R>>\n%%%%EOF\n' > /tmp/synthetic.pdf
          KEY="${PID}/rehearsal-permit.pdf"
          code=$(curl -s -o /tmp/up.json -w '%{http_code}' -X POST \
            "$API/storage/v1/object/passengers-docs/$KEY" \
            -H "Authorization: Bearer $SK" -H "Content-Type: application/pdf" \
            --data-binary @/tmp/synthetic.pdf)
          [ "$code" = "200" ] && say "A6 upload synthetic object" "ok" || { say "A6 upload" "HTTP $code"; bad=1; }
          p "update public.passengers set hajj_permit_url = '$KEY' where id = $PID" >/dev/null
          say "A6 objects in bucket" "$(p "select count(*) from storage.objects where bucket_id='passengers-docs'")"

          # ── A7 — علاقاتٌ وأيتام
          for c in bus_id:buses room_id:rooms camp_mina_id:camps camp_arafa_id:camps flight_id:flights return_flight_id:flights; do
            col="${c%%:*}"; tbl="${c##*:}"
            n="$(p "select count(*) from public.passengers p where p.$col is not null and not exists (select 1 from public.$tbl t where t.id = p.$col)")"
            [ "$n" -eq 0 ] && say "A7 orphan $col" "0" || { say "A7 orphan $col" "$n"; bad=1; }
          done
          n="$(p "select count(*) from public.financial_group_members m where not exists (select 1 from public.passengers p where p.id = m.passenger_id)")"
          [ "$n" -eq 0 ] && say "A7 orphan group members" "0" || { say "A7 orphan group members" "$n"; bad=1; }

          # ── A10 — جلسةُ بوابةٍ عبر المسار المجهول المعتمد
          DOC="$(p "select passport from public.passengers where id = $PID")"
          DOB="$(p "select to_char(dob::date,'YYYY-MM-DD') from public.passengers where id = $PID")"
          Y="${DOB%%-*}"; M="$(echo "$DOB" | cut -d- -f2)"; D="$(echo "$DOB" | cut -d- -f3)"
          TOKEN="$(curl -s -X POST "$API/rest/v1/rpc/create_pilgrim_session" \
            -H "apikey: $SK" -H "Authorization: Bearer $SK" -H "Content-Type: application/json" \
            -d "{\"p_doc\":\"$DOC\",\"p_day\":${D#0},\"p_month\":${M#0},\"p_year\":$Y}" | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("token",""))')"
          [ -n "$TOKEN" ] && say "A10 valid portal session issued" "ok" || { say "A10 session" "no token"; bad=1; }
          echo "::add-mask::$TOKEN"
          ok="$(curl -s -X POST "$API/rest/v1/rpc/get_pilgrim_portal_by_session" \
            -H "apikey: $SK" -H "Authorization: Bearer $SK" -H "Content-Type: application/json" \
            -d "{\"p_token\":\"$TOKEN\"}" | python3 -c 'import sys,json;d=json.load(sys.stdin);print("yes" if d else "no")')"
          [ "$ok" = "yes" ] && say "A10 valid session reads portal" "yes" || { say "A10 valid session reads portal" "$ok"; bad=1; }
          bogus="$(curl -s -X POST "$API/rest/v1/rpc/get_pilgrim_portal_by_session" \
            -H "apikey: $SK" -H "Authorization: Bearer $SK" -H "Content-Type: application/json" \
            -d '{"p_token":"not-a-real-token"}' | python3 -c 'import sys,json;d=json.load(sys.stdin);print("yes" if d else "no")')"
          [ "$bogus" = "no" ] && say "A10 invalid session refused" "yes" || { say "A10 invalid session refused" "NO"; bad=1; }

          # ── A8 — المستند من طرفٍ إلى طرف عبر pilgrim-doc
          SIGNED="$(curl -s -X POST "$API/functions/v1/pilgrim-doc" \
            -H "Content-Type: application/json" -H "apikey: $SK" \
            -d "{\"token\":\"$TOKEN\",\"doc_type\":\"hajj_permit\"}" \
            | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("url",""))')"
          if [ -n "$SIGNED" ]; then
            echo "::add-mask::$SIGNED"
            dc=$(curl -s -o /dev/null -w '%{http_code}' "$SIGNED")
            [ "$dc" = "200" ] && say "A8 document fetched end-to-end" "HTTP 200" || { say "A8 document fetch" "HTTP $dc"; bad=1; }
          else
            say "A8 pilgrim-doc signed url" "MISSING"; bad=1
          fi

          # ── A9 — دخولُ موظّفٍ وصلاحيّته
          JWT="$(curl -s -X POST "$API/auth/v1/token?grant_type=password" \
            -H "apikey: $SK" -H "Content-Type: application/json" \
            -d "{\"email\":\"$AE\",\"password\":\"$AP\"}" \
            | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("access_token",""))')"
          [ -n "$JWT" ] && say "A9 staff sign-in" "ok" || { say "A9 staff sign-in" "FAILED"; bad=1; }
          echo "::add-mask::$JWT"
          echo "$JWT" > /tmp/jwt
          # ⚠️ `manage_season_lifecycle` **مستثناةٌ عمداً** من حساب
          #    الإقلاع: تحذف موسماً بأكمله حذفاً دائماً، فلا تُسنَد إلى
          #    أداةٍ تعمل بلا قرارٍ بشريّ. فغيابُها هنا **إثباتُ** أن
          #    القرار نافذ، لا إخفاق. وتُمنح لاحقاً عبر `user-admin`.
          has="$(curl -s -X POST "$API/rest/v1/rpc/has_permission" \
            -H "apikey: $SK" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d '{"p_key":"manage_users"}')"
          [ "$has" = "true" ] && say "A9 has_permission(manage_users)" "true" || { say "A9 manage_users" "$has"; bad=1; }
          life="$(curl -s -X POST "$API/rest/v1/rpc/has_permission" \
            -H "apikey: $SK" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d '{"p_key":"manage_season_lifecycle"}')"
          [ "$life" = "false" ] && say "A9 season-lifecycle withheld by design" "false" || { say "A9 season-lifecycle NOT withheld" "$life"; bad=1; }
          nop="$(curl -s -X POST "$API/rest/v1/rpc/has_permission" \
            -H "apikey: $SK" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d '{"p_key":"a_permission_that_does_not_exist"}')"
          [ "$nop" = "false" ] && say "A9 unknown permission denied" "false" || { say "A9 unknown permission" "$nop"; bad=1; }

          [ "$bad" -eq 0 ] && echo PASS > "$OUT/status-a.txt" || echo FAIL > "$OUT/status-a.txt"
          echo "Phase A verdict: $(cat "$OUT/status-a.txt")"
          [ "$bad" -eq 0 ]

      # ── PHASE B ───────────────────────────────────────────────
      - name: "B1/B2: top up the active season and fingerprint it"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -f supabase/verification/rehearsal/topup.sql | tee "$OUT/phase-b-topup.txt"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "
            select 'pre_close'||E'\t'||
              (select count(*) from public.seasons)||E'\t'||
              (select count(*) from public.seasons where closed_at is null)||E'\t'||
              (select count(*) from public.passengers where season_id = public.active_season_id())||E'\t'||
              (select count(*) from public.financial_groups where season_id = public.active_season_id())||E'\t'||
              (select count(*) from public.pilgrim_sessions where season_id = public.active_season_id() and revoked_at is null)||E'\t'||
              (select count(*) from public.pricing_settings)" | tee "$OUT/phase-b-preclose.txt"

      - name: "B0: grant season-lifecycle through user-admin, as a human would"
        env:
          API: https://${{ secrets.TMP_PROJECT_REF }}.supabase.co
          SK: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
          AE: ${{ secrets.TMP_ADMIN_EMAIL }}
          AP: ${{ secrets.TMP_ADMIN_PASSWORD }}
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF" "$API"
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          # حسابُ الإقلاع لا يملك `manage_season_lifecycle` عمداً، فلا
          # يستطيع إقفالَ موسم. وهذه هي الحالةُ الصحيحة. والمنحُ يجري
          # من حيث يجري في التطبيق: «الإعدادات ← المستخدمون» عبر
          # `user-admin`، بصلاحية `manage_users` التي يملكها. فيُختبَر
          # مسارُ المنح نفسُه بدل الالتفاف عليه بكتابةٍ مباشرة.
          JWT="$(curl -s -X POST "$API/auth/v1/token?grant_type=password" \
            -H "apikey: $SK" -H "Content-Type: application/json" \
            -d "{\"email\":\"$AE\",\"password\":\"$AP\"}" \
            | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("access_token",""))')"
          [ -n "$JWT" ] || { echo "::error::could not sign in to grant the permission"; exit 1; }
          echo "::add-mask::$JWT"
          UID_="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "select id from public.user_profiles order by created_at limit 1")"
          PERMS="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 \
            -c "select (permissions || '{\"manage_season_lifecycle\": true}'::jsonb)::text from public.user_profiles where id = '$UID_'")"
          code=$(curl -s -o /tmp/grant.json -w '%{http_code}' -X POST "$API/functions/v1/user-admin" \
            -H "Authorization: Bearer $JWT" -H "apikey: $SK" -H "Content-Type: application/json" \
            -d "{\"action\":\"update\",\"id\":\"$UID_\",\"permissions\":$PERMS}")
          echo "  user-admin update -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::grant refused"; cat /tmp/grant.json; exit 1; }
          now="$(curl -s -X POST "$API/rest/v1/rpc/has_permission" \
            -H "apikey: $SK" -H "Authorization: Bearer $JWT" -H "Content-Type: application/json" \
            -d '{"p_key":"manage_season_lifecycle"}')"
          [ "$now" = "true" ] || { echo "::error::permission still not effective: $now"; exit 1; }
          echo "  season-lifecycle granted through the supported path and effective" | tee "$OUT/phase-b-grant.txt"

      - name: "B3: close the season THROUGH season-admin"
        env:
          API: https://${{ secrets.TMP_PROJECT_REF }}.supabase.co
          SK: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
          AE: ${{ secrets.TMP_ADMIN_EMAIL }}
          AP: ${{ secrets.TMP_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF" "$API"
          # ⚠️ لا يُستدعى `close_season()` مباشرةً. الإقفالُ يمرّ بالدالّة
          # كما يمرّ في التطبيق: JWT موظّفٍ حقيقيّ، والنمطُ الثلاثيّ كاملاً.
          JWT="$(curl -s -X POST "$API/auth/v1/token?grant_type=password" \
            -H "apikey: $SK" -H "Content-Type: application/json" \
            -d "{\"email\":\"$AE\",\"password\":\"$AP\"}" \
            | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("access_token",""))')"
          [ -n "$JWT" ] || { echo "::error::could not sign in for the close"; exit 1; }
          echo "::add-mask::$JWT"
          vr=$(curl -s -o /tmp/verify.json -w '%{http_code}' -X POST "$API/functions/v1/season-admin" \
            -H "Authorization: Bearer $JWT" -H "apikey: $SK" -H "Content-Type: application/json" \
            -d '{"action":"verify"}')
          echo "season-admin verify -> HTTP $vr"
          [ "$vr" = "200" ] || { echo "::error::season-admin verify refused"; cat /tmp/verify.json; exit 1; }
          cr=$(curl -s -o /tmp/close.json -w '%{http_code}' -X POST "$API/functions/v1/season-admin" \
            -H "Authorization: Bearer $JWT" -H "apikey: $SK" -H "Content-Type: application/json" \
            -d '{"action":"close","newSeasonName":"موسم تمرين 1450","newSeasonHijriYear":1450}')
          echo "season-admin close -> HTTP $cr" | tee "$OUT/phase-b-close.txt"
          cat /tmp/close.json | tee -a "$OUT/phase-b-close.txt"
          [ "$cr" = "200" ] || { echo "::error::season-admin close failed"; exit 1; }

      - name: "B4-B15: assertions after the close"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
            -f supabase/verification/rehearsal/assert-after-close.sql > "$OUT/phase-b-assertions.tsv"
          bad=0
          while IFS=$'\t' read -r name expected actual; do
            if [ "$expected" = "(observed)" ]; then
              printf '  %-52s %s\n' "$name" "OBSERVED=$actual"
            elif [ "$expected" = "$actual" ]; then
              printf '  %-52s ok   %s\n' "$name" "$actual"
            else
              printf '  %-52s FAIL expected=%s actual=%s\n' "$name" "$expected" "$actual"; bad=1
            fi
          done < "$OUT/phase-b-assertions.tsv"
          [ "$bad" -eq 0 ] && echo PASS > "$OUT/status-b.txt" || echo FAIL > "$OUT/status-b.txt"
          echo "Phase B verdict: $(cat "$OUT/status-b.txt")"
          [ "$bad" -eq 0 ]

      - name: "B8: all 12 closed-season guards refuse a write"
        env:
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          # ⚠️ كلُّ جدولٍ يُختبَر **مرّتين**، ولا يمرّ إلا باجتياز
          # الاثنتين معاً:
          #   موجبٌ على الموسم النشط  → يجب أن **ينجح**
          #   سالبٌ على الموسم المقفل → يجب أن **يُرفَض**
          # ولولا الموجب لكان خطأٌ مطبعيٌّ في اسم عمودٍ يُقرأ رفضاً،
          # فيُعلَن الحارسُ عاملاً وهو لم يُستدعَ أصلاً. والموجبُ يُلغى
          # بـ rollback فلا يبقى أثر، والسالبُ تُجهضه المعاملة.
          CLOSED="(select id from public.seasons where closed_at is not null order by closed_at desc limit 1)"
          CP="(select id from public.passengers where season_id = $CLOSED order by id limit 1)"

          # شرطٌ سابقٌ للسوالب المباشرة: لو لم يكن في الموسم المقفل صفٌّ
          # واحدٌ على الأقلّ في الجدول، لأصابت جملةُ الحذف صفراً من الصفوف
          # فلا يُستدعى المحفّزُ أصلاً، وتُقرأ «النجاة» رفضاً زائفاً. نتحقّق
          # صراحةً بدل أن نأتمن الصمت.
          pre_bad=0
          for t in passengers buses camps rooms flights announcements financial_groups; do
            n="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 \
                 -c "select count(*) from public.$t where season_id = $CLOSED")"
            printf '  precondition %-22s rows_in_closed_season=%s\n' "$t" "$n"
            [ -n "$n" ] && [ "$n" -gt 0 ] || { echo "::error::$t has no row in the closed season - its negative control would be vacuous"; pre_bad=1; }
          done
          [ "$pre_bad" -eq 0 ] || { echo FAIL > "$OUT/status-guards.txt"; exit 1; }

          : > "$OUT/guards.tsv"
          run_sql() { set +e; psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$1" >/dev/null 2>&1; local rc=$?; set -e; return $rc; }
          probe() {
            local t="$1" pos="$2" neg="$3" pok negrefused
            if run_sql "$pos"; then pok=yes; else pok=NO; fi
            if run_sql "$neg"; then negrefused=NO; else negrefused=yes; fi
            if [ "$pok" = yes ] && [ "$negrefused" = yes ]; then
              printf '%s\tPASS\n' "$t" >> "$OUT/guards.tsv"; printf '  %-28s positive ok · closed-season write refused\n' "$t"
            else
              printf '%s\tFAIL(pos=%s,refused=%s)\n' "$t" "$pok" "$negrefused" >> "$OUT/guards.tsv"
              printf '  %-28s FAIL  positive=%s refused=%s\n' "$t" "$pok" "$negrefused"
            fi
          }

          # سبعةٌ تحمل season_id مباشرةً
          probe passengers \
            "begin; insert into public.passengers (name_ar) values ('probe'); rollback;" \
            "delete from public.passengers where id = $CP"
          probe buses \
            "begin; insert into public.buses (name, type) values ('probe bus','عادي'); rollback;" \
            "delete from public.buses where season_id = $CLOSED"
          probe camps \
            "begin; insert into public.camps (name, page_type, gender, type) values ('probe camp','منى','ذكر','عادي'); rollback;" \
            "delete from public.camps where season_id = $CLOSED"
          probe rooms \
            "begin; insert into public.rooms (number, floor, type) values ('9001','بروفة','ثنائية'); rollback;" \
            "delete from public.rooms where season_id = $CLOSED"
          probe flights \
            "begin; insert into public.flights (name, type, date, time) values ('probe flight','ذهاب','2030-01-01','08:00'); rollback;" \
            "delete from public.flights where season_id = $CLOSED"
          probe announcements \
            "begin; insert into public.announcements (body) values ('probe'); rollback;" \
            "delete from public.announcements where season_id = $CLOSED"
          probe financial_groups \
            "begin; insert into public.financial_groups (name) values ('probe group'); rollback;" \
            "delete from public.financial_groups where season_id = $CLOSED"

          # وخمسةٌ مشتقّةٌ عبر passenger_id — الموجبُ ينشئ حاجَّه في الموسم النشط
          probe payments \
            "begin; with p as (insert into public.passengers (name_ar) values ('probe') returning id)
             insert into public.payments (passenger_id, amount) select id, 1 from p; rollback;" \
            "insert into public.payments (passenger_id, amount) values ($CP, 1)"
          probe custom_charges \
            "begin; with p as (insert into public.passengers (name_ar) values ('probe') returning id)
             insert into public.custom_charges (passenger_id, description, amount, type) select id,'probe',1,'إضافة' from p; rollback;" \
            "insert into public.custom_charges (passenger_id, description, amount, type) values ($CP,'probe',1,'إضافة')"
          probe financial_group_members \
            "begin; with g as (insert into public.financial_groups (name) values ('probe group') returning id),
                         p as (insert into public.passengers (name_ar) values ('probe') returning id)
             insert into public.financial_group_members (group_id, passenger_id) select g.id, p.id from g, p; rollback;" \
            "insert into public.financial_group_members (group_id, passenger_id) values ((select id from public.financial_groups where season_id = $CLOSED order by id limit 1), $CP)"
          probe notification_deliveries \
            "begin; with a as (insert into public.announcements (body) values ('probe') returning id),
                         p as (insert into public.passengers (name_ar) values ('probe') returning id)
             insert into public.notification_deliveries (announcement_id, passenger_id) select a.id, p.id from a, p; rollback;" \
            "insert into public.notification_deliveries (announcement_id, passenger_id) values ((select id from public.announcements where season_id = $CLOSED order by id limit 1), $CP)"
          probe pilgrim_push_subscriptions \
            "begin; with p as (insert into public.passengers (name_ar) values ('probe') returning id)
             insert into public.pilgrim_push_subscriptions (passenger_id, endpoint, p256dh, auth) select id,'https://example.invalid/probe','x','y' from p; rollback;" \
            "insert into public.pilgrim_push_subscriptions (passenger_id, endpoint, p256dh, auth) values ($CP,'https://example.invalid/probe','x','y')"

          total=$(wc -l < "$OUT/guards.tsv"); passed=$(grep -c 'PASS' "$OUT/guards.tsv" || true)
          echo "guards: $passed of $total tables passed both controls" | tee "$OUT/phase-b-guards.txt"
          if [ "$passed" -eq 12 ] && [ "$total" -eq 12 ]; then echo PASS > "$OUT/status-guards.txt"
          else echo FAIL > "$OUT/status-guards.txt"; echo "::error::expected 12/12, got $passed of $total"; fi
          # ولا أثرَ باقٍ: كلُّ موجبٍ أُلغي، وكلُّ سالبٍ أُجهض
          leak=$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "select
              (select count(*) from public.passengers        where name_ar = 'probe')
            + (select count(*) from public.financial_groups  where name    = 'probe group')
            + (select count(*) from public.buses             where name    = 'probe bus')
            + (select count(*) from public.camps             where name    = 'probe camp')
            + (select count(*) from public.rooms             where number  = '9001')
            + (select count(*) from public.flights           where name    = 'probe flight')
            + (select count(*) from public.announcements     where body    = 'probe')
            + (select count(*) from public.pilgrim_push_subscriptions where endpoint = 'https://example.invalid/probe')")
          echo "probe residue: $leak" | tee -a "$OUT/phase-b-guards.txt"
          [ "$leak" -eq 0 ] || { echo "::error::probe rows survived"; echo FAIL > "$OUT/status-guards.txt"; }
          [ "$(cat "$OUT/status-guards.txt")" = "PASS" ]

      - name: "B16: delete_season through season-admin, on throwaway data"
        env:
          API: https://${{ secrets.TMP_PROJECT_REF }}.supabase.co
          SK: ${{ secrets.TMP_SERVICE_ROLE_KEY }}
          AE: ${{ secrets.TMP_ADMIN_EMAIL }}
          AP: ${{ secrets.TMP_ADMIN_PASSWORD }}
          PGPASSWORD: ${{ secrets.TMP_DB_PASSWORD }}
        run: |
          set -euo pipefail
          "$GUARD" "$TMP_REF" "$API"
          URL="postgresql://postgres.${TMP_REF}@${DB_HOST}:${DB_PORT}/postgres"
          "$GUARD" "$TMP_REF" "$URL"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$1"; }
          # ‼️ boolean::text في psql تُطبَع true/false لا t/f — والمقارنةُ
          # بـ t كانت تفشل دائماً مهما صحّت البيانات. الفحصُ يمرّ من هنا وحده.
          istrue() { [ "$(p "select ($1)::text")" = "true" ]; }
          bad=0
          : > "$OUT/phase-b-delete.txt"
          say() { echo "$1" | tee -a "$OUT/phase-b-delete.txt"; }

          TARGET="$(p "select id from public.seasons where closed_at is not null order by closed_at desc limit 1")"
          OPENS="$(p  "select id from public.seasons where closed_at is null order by id desc limit 1")"
          [ -n "$TARGET" ] && [ -n "$OPENS" ] || { echo "::error::could not resolve the closed and open seasons"; exit 1; }
          say "target_closed_season=$TARGET open_season=$OPENS"

          # الأعدادُ الاثنا عشر **قبل** الحذف، بنفسِ محاسبةِ delete_season
          # حرفاً بحرف: التوابعُ تُعدّ من جهةِ الحاجّ لأنها تسقط بـcascade.
          COUNTS_SQL="jsonb_build_object(
              'passengers',                 (select count(*) from public.passengers    where season_id = $TARGET),
              'rooms',                      (select count(*) from public.rooms         where season_id = $TARGET),
              'camps',                      (select count(*) from public.camps         where season_id = $TARGET),
              'buses',                      (select count(*) from public.buses         where season_id = $TARGET),
              'flights',                    (select count(*) from public.flights       where season_id = $TARGET),
              'announcements',              (select count(*) from public.announcements where season_id = $TARGET),
              'financial_groups',           (select count(*) from public.financial_groups where season_id = $TARGET),
              'payments',                   (select count(*) from public.payments x join public.passengers pa on pa.id = x.passenger_id where pa.season_id = $TARGET),
              'custom_charges',             (select count(*) from public.custom_charges x join public.passengers pa on pa.id = x.passenger_id where pa.season_id = $TARGET),
              'financial_group_members',    (select count(*) from public.financial_group_members x join public.passengers pa on pa.id = x.passenger_id where pa.season_id = $TARGET),
              'notification_deliveries',    (select count(*) from public.notification_deliveries x join public.passengers pa on pa.id = x.passenger_id where pa.season_id = $TARGET),
              'pilgrim_push_subscriptions', (select count(*) from public.pilgrim_push_subscriptions x join public.passengers pa on pa.id = x.passenger_id where pa.season_id = $TARGET),
              'pilgrim_sessions',           (select count(*) from public.pilgrim_sessions x join public.passengers pa on pa.id = x.passenger_id where pa.season_id = $TARGET))"
          BEFORE="$(p "select ($COUNTS_SQL)::text")"
          say "before_counts=$BEFORE"
          istrue "('$BEFORE'::jsonb->>'passengers')::int > 0" \
            || { echo "::error::the target season is already empty - the drain assertion would be vacuous"; bad=1; }
          istrue "('$BEFORE'::jsonb->>'financial_groups')::int > 0" \
            || { echo "::error::the target season holds no financial group - the emptiness-cascade assertion would be vacuous"; bad=1; }

          # بصمةُ المواسمِ الأخرى: يجب ألّا يتحرّك منها شيء
          OTHERS_SQL="jsonb_build_object(
              'passengers',    (select count(*) from public.passengers    where season_id <> $TARGET),
              'rooms',         (select count(*) from public.rooms         where season_id <> $TARGET),
              'camps',         (select count(*) from public.camps         where season_id <> $TARGET),
              'buses',         (select count(*) from public.buses         where season_id <> $TARGET),
              'flights',       (select count(*) from public.flights       where season_id <> $TARGET),
              'announcements', (select count(*) from public.announcements where season_id <> $TARGET),
              'seasons',       (select count(*) from public.seasons       where id        <> $TARGET))"
          OTHERS_BEFORE="$(p "select ($OTHERS_SQL)::text")"
          say "others_before=$OTHERS_BEFORE"

          JWT="$(curl -s -X POST "$API/auth/v1/token?grant_type=password" \
            -H "apikey: $SK" -H "Content-Type: application/json" \
            -d "{\"email\":\"$AE\",\"password\":\"$AP\"}" \
            | python3 -c 'import sys,json;print((json.load(sys.stdin) or {}).get("access_token",""))')"
          echo "::add-mask::$JWT"
          [ -n "$JWT" ] || { echo "::error::staff sign-in produced no token"; exit 1; }

          del() {  # del <seasonId> [auth-header-or-empty] -> prints the status code
            local sid="$1" hdr="${2-}"
            if [ -n "$hdr" ]; then
              curl -s -o /tmp/del.json -w '%{http_code}' -X POST "$API/functions/v1/season-admin" \
                -H "Authorization: Bearer $hdr" -H "apikey: $SK" -H "Content-Type: application/json" \
                -d "{\"action\":\"delete\",\"seasonId\":$sid}"
            else
              curl -s -o /tmp/del.json -w '%{http_code}' -X POST "$API/functions/v1/season-admin" \
                -H "apikey: $SK" -H "Content-Type: application/json" \
                -d "{\"action\":\"delete\",\"seasonId\":$sid}"
            fi
          }
          expect() {  # expect <label> <actual> <wanted>
            if [ "$2" = "$3" ]; then say "  $1: HTTP $2 (expected $3) ok"
            else say "  $1: HTTP $2 (expected $3) FAIL"; bad=1; fi
          }

          # ── سوالبُ التفويض: الحذفُ الهدّام لا يُفتح إلا لمن يملك ───────
          ADMIN_UID="$(p "select id from public.user_profiles order by created_at limit 1")"
          grant_lifecycle() {  # grant_lifecycle true|false
            local perms
            perms="$(p "select (permissions || '{\"manage_season_lifecycle\": $1}'::jsonb)::text from public.user_profiles where id = '$ADMIN_UID'")"
            curl -s -o /dev/null -X POST "$API/functions/v1/user-admin" \
              -H "Authorization: Bearer $JWT" -H "apikey: $SK" -H "Content-Type: application/json" \
              -d "{\"action\":\"update\",\"id\":\"$ADMIN_UID\",\"permissions\":$perms}"
            p "select (permissions->>'manage_season_lifecycle') from public.user_profiles where id = '$ADMIN_UID'"
          }

          say "authorization negative controls:"
          expect "no token at all" "$(del "$TARGET" "")" "401"

          revoked="$(grant_lifecycle false)"
          [ "$revoked" = "false" ] || { echo "::error::could not revoke manage_season_lifecycle through user-admin"; bad=1; }
          expect "permission revoked" "$(del "$TARGET" "$JWT")" "403"
          restored="$(grant_lifecycle true)"
          [ "$restored" = "true" ] || { echo "::error::could not restore manage_season_lifecycle through user-admin"; bad=1; }

          # وسالبُ منطقِ العمل: الموسمُ المفتوح لا يُحذف
          expect "open season refused" "$(del "$OPENS" "$JWT")" "400"
          still_open="$(p "select count(*) from public.seasons where id = $OPENS")"
          [ "$still_open" -eq 1 ] || { echo "::error::the open season was damaged by its refused delete"; bad=1; }

          # ── الموجب: الحذفُ المأذون للموسمِ المقفل ─────────────────────
          say "positive control:"
          expect "authorized delete" "$(del "$TARGET" "$JWT")" "200"

          # ── التصريف: لا صفَّ باقياً للموسمِ المحذوف في أيٍّ من الاثني عشر ─
          AFTER="$(p "select ($COUNTS_SQL)::text")"
          say "after_counts=$AFTER"
          istrue "'$AFTER'::jsonb = jsonb_build_object(
                'passengers',0,'rooms',0,'camps',0,'buses',0,'flights',0,'announcements',0,
                'financial_groups',0,'payments',0,'custom_charges',0,'financial_group_members',0,
                'notification_deliveries',0,'pilgrim_push_subscriptions',0,'pilgrim_sessions',0)" \
            || { echo "::error::the target season did not drain completely"; bad=1; }
          gone="$(p "select count(*) from public.seasons where id = $TARGET")"
          [ "$gone" -eq 0 ] || { echo "::error::season row survived"; bad=1; }

          # ── لا ضررَ على موسمٍ آخر ────────────────────────────────────
          OTHERS_AFTER="$(p "select ($OTHERS_SQL)::text")"
          say "others_after=$OTHERS_AFTER"
          istrue "'$OTHERS_BEFORE'::jsonb = '$OTHERS_AFTER'::jsonb" \
            || { echo "::error::an unrelated season changed"; bad=1; }

          # ── التدقيق: صفٌّ ملخّصٌ واحدٌ بالفاعلِ وبالأعدادِ الاثني عشر ──
          AUD="select * from public.audit_log where table_name = 'seasons' and action = 'delete'
                 and new_value ? 'deleted_counts' order by id desc limit 1"
          n_rows="$(p "select count(*) from public.audit_log where table_name='seasons' and action='delete' and new_value ? 'deleted_counts'")"
          say "delete_audit_rows=$n_rows"
          [ "$n_rows" -eq 1 ] || { echo "::error::expected exactly one summary audit row, found $n_rows"; bad=1; }
          keys="$(p "select count(*) from jsonb_object_keys((select new_value->'deleted_counts' from ($AUD) a))")"
          say "audit_counts=$(p "select (new_value->'deleted_counts')::text from ($AUD) a")"
          say "audit_deleted_counts_keys=$keys"
          # ثلاثةَ عشرَ صنفاً بعد ترحيلةِ 20260924093000 التي أضافت
          # `financial_groups` إلى الدالّة — لا اثنا عشر كما في الـbaseline.
          [ "$keys" -eq 13 ] || { echo "::error::delete audit carries $keys category counts, expected 13"; bad=1; }

          # والأعدادُ المُدقَّقةُ تُطابق ما كان الموسمُ يحويه فعلاً، إلا
          # `financial_groups`: عضوياتُ الحجّاجِ تسقط معهم، فتخلو المجموعاتُ
          # ويحذفها محفّزُ الخلوّ قبل أن يبلغها سطرُ الحذف — فيُدقَّق صفراً
          # بحكمِ التصميم، وسطرُ الدالّةِ شبكةُ أمانٍ لا أكثر. ولا نقبل هذا
          # الصفرَ تسليماً: نُثبت أنّ المجموعاتِ كانت موجودةً ثُمّ زالت فعلاً.
          EXPECTED="$(p "select ('$BEFORE'::jsonb || '{\"financial_groups\": 0}'::jsonb)::text")"
          istrue "(select new_value->'deleted_counts' from ($AUD) a) = '$EXPECTED'::jsonb" \
            || { echo "::error::the audited counts do not match what the season actually held"; bad=1; }
          fg_left="$(p "select count(*) from public.financial_groups where season_id = $TARGET")"
          say "financial_groups_before=$(p "select '$BEFORE'::jsonb->>'financial_groups'") audited=0 remaining=$fg_left"
          [ "$fg_left" -eq 0 ] || { echo "::error::$fg_left financial groups survived the delete"; bad=1; }

          istrue "(select actor_id is not null from ($AUD) a)" \
            || { echo "::error::the destructive audit row carries no actor"; bad=1; }
          istrue "(select actor_id = '$ADMIN_UID' from ($AUD) a)" \
            || { echo "::error::the audited actor is not the staff member who invoked the delete"; bad=1; }
          istrue "(select row_id = '$TARGET' from ($AUD) a)" \
            || { echo "::error::the audit row points at the wrong season"; bad=1; }
          istrue "(select old_value ? 'name' from ($AUD) a)" \
            || { echo "::error::the audit row did not preserve the deleted season row"; bad=1; }

          # ── لا أثرَ زائد: رايةُ الإيقافِ ماتت مع معاملتها، ولا يتيم ─────
          supp="$(p "select count(*) from public.audit_suppression")"
          say "audit_suppression_rows=$supp"
          [ "$supp" -eq 0 ] || { echo "::error::the maintenance suppression flag outlived its transaction"; bad=1; }
          orphans="$(p "select
              (select count(*) from public.payments                   x where not exists (select 1 from public.passengers pa where pa.id = x.passenger_id))
            + (select count(*) from public.custom_charges             x where not exists (select 1 from public.passengers pa where pa.id = x.passenger_id))
            + (select count(*) from public.financial_group_members    x where not exists (select 1 from public.passengers pa where pa.id = x.passenger_id))
            + (select count(*) from public.notification_deliveries    x where not exists (select 1 from public.passengers pa where pa.id = x.passenger_id))
            + (select count(*) from public.pilgrim_push_subscriptions x where not exists (select 1 from public.passengers pa where pa.id = x.passenger_id))
            + (select count(*) from public.pilgrim_sessions           x where not exists (select 1 from public.passengers pa where pa.id = x.passenger_id))")"
          say "orphaned_derived_rows=$orphans"
          [ "$orphans" -eq 0 ] || { echo "::error::$orphans derived rows were orphaned by the delete"; bad=1; }

          [ "$bad" -eq 0 ] && echo PASS > "$OUT/status-delete.txt" || echo FAIL > "$OUT/status-delete.txt"
          say "delete_season verdict: $(cat "$OUT/status-delete.txt")"
          [ "$bad" -eq 0 ]

      - name: "Verdict"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bad=0
          for k in a-ledger a b guards delete; do
            f="$OUT/status-$k.txt"
            if [ ! -s "$f" ]; then printf '%-10s %s\n' "$k" "NOT REACHED"; bad=1
            else v="$(cat "$f")"; printf '%-10s %s\n' "$k" "$v"; [ "$v" = "PASS" ] || bad=1; fi
          done
          [ "$bad" -eq 0 ] && echo PASS > "$OUT/verdict.txt" || echo FAIL > "$OUT/verdict.txt"
          echo "REHEARSAL: $(cat "$OUT/verdict.txt")"
          [ "$bad" -eq 0 ]

      - name: "Scan evidence for secret-like material"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|postgres(ql)?://[^ ]*:[^ ]*@|service_role" "$OUT"; then
            echo "::error::secret-like material found in the evidence - upload blocked"; exit 1
          fi
          echo "Evidence secret scan clean."

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-rehearsal
          path: rehearsal-evidence
          if-no-files-found: error
