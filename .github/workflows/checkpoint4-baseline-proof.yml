# ════════════════════════════════════════════════════════════
# Checkpoint 4 — V1 baseline reproducibility proof
# ════════════════════════════════════════════════════════════
# READ-ONLY against the remote Supabase project. There is no
# authorized remote-mutation command in this workflow, and none is
# present: no db push, no migration up, no migration repair, no
# db reset --linked, no remote DDL/DML.
#
# Remote read-only is enforced by the SERVER, not by discipline:
# every remote psql session sets default_transaction_read_only=on,
# so a mistaken write is rejected with SQLSTATE 25006.
#
# Manual trigger only. Never on push, pull_request or schedule.

name: Checkpoint 4 - V1 Baseline Proof (read-only remote)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (NOT a secret - public identifier)"
        required: true
        default: "zkucwcnclbfvukhdqhgc"
      db_host:
        description: "DB host from dashboard > Connect. Use the IPv4-compatible Session pooler host if direct is IPv6-only. NOT a secret."
        required: true
      db_port:
        description: "DB port (5432 direct, commonly 5432 for session pooler)"
        required: true
        default: "5432"
      db_user:
        description: "DB user from dashboard > Connect (e.g. postgres, or postgres.<ref> for the pooler). NOT a secret."
        required: true
        default: "postgres"

# Minimum permissions. Read only: this workflow never pushes a commit.
# Proof artifacts leave via actions/upload-artifact, not via git.
permissions:
  contents: read

concurrency:
  group: checkpoint4-baseline-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Never echoed. GitHub masks secret values in logs automatically.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Same secret, two consumers: the CLI reads SUPABASE_DB_PASSWORD,
      # psql reads PGPASSWORD. Passing it by environment keeps it off
      # the command line and out of the process table.
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      # Server-enforced read-only for every psql session below.
      PGOPTIONS: "-c default_transaction_read_only=on"
      PROJECT_REF: ${{ inputs.project_ref }}
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}
      OUT: proof-output

    steps:
      # ── 0) Fail closed if either secret is missing ──────────
      - name: Require secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; missing=1; }
          [ -n "${PGPASSWORD:-}" ]            || { echo "::error::SUPABASE_DB_PASSWORD is not set"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "Both required secrets are present (values not printed)."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          docker version --format '{{.Server.Version}}'
          v="$(npm run --silent supabase -- --version)"
          echo "supabase CLI: $v"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          psql --version
          # 37 historical migrations must be present and untouched.
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 37 ] || { echo "::error::expected 37 historical migrations, found $n"; exit 1; }
          echo "$n historical migrations present."

      # ── STAGE B) read-only remote capture ──────────────────
      - name: Link project (read-only use)
        shell: bash
        run: |
          set -euo pipefail
          # No --skip-pooler: the CLI links through the POOLER by
          # default, which is IPv4-compatible. That is what makes the
          # CLI steps work on a GitHub-hosted runner, where a direct
          # IPv6-only db.<ref>.supabase.co host would be unreachable.
          npm run --silent supabase -- link --project-ref "$PROJECT_REF" >/dev/null
          echo "Linked via pooler. supabase/.temp is gitignored and is never committed."

      # ── Connectivity preflight — fail closed, never guess ──
      # Runs BEFORE the read-only positive control and before any
      # capture. It opens a TCP socket and nothing more: no
      # authentication, no query, no mutation. Its only job is to tell
      # "the endpoint is unreachable" apart from "read-only
      # enforcement is broken", which are very different findings.
      #
      # Supabase direct hosts are IPv6-only unless the project holds
      # the IPv4 add-on, and GitHub-hosted runners egress over IPv4.
      # So this WILL fail on a direct host from a runner, and it must
      # fail loudly rather than be worked around.
      - name: Connectivity preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "Endpoint under test: ${DB_HOST}:${DB_PORT}"

          # Both failure modes - unresolvable and unreachable - are
          # "the endpoint does not work", so both must give the same
          # actionable guidance. Emitting it from one place keeps them
          # from drifting apart.
          hint_and_die() {
            cat <<'HINT'
          The proof cannot continue, and this workflow will NOT fall back
          to another endpoint on its own.

          If the resolved address is IPv6-only, a GitHub-hosted runner
          cannot reach it. Re-dispatch with the SESSION POOLER values,
          copied verbatim from:

              Supabase Dashboard -> Connect -> Session pooler

          Supply them as the db_host, db_port and db_user inputs. Use the
          SESSION pooler, not the Transaction pooler: this proof relies on
          a session-level setting (default_transaction_read_only) and on
          pg_dump holding a stable session, and transaction-mode pooling
          does not reliably preserve either.

          These three values are NOT secrets. Do not put them in a secret,
          and do not paste the database password anywhere.
          HINT
            exit 1
          }

          if ! getent ahosts "$DB_HOST" > /tmp/preflight-dns.txt 2>/dev/null \
               || [ ! -s /tmp/preflight-dns.txt ]; then
            echo "::error::DNS resolution failed for ${DB_HOST}"
            hint_and_die
          fi
          v4="$(awk '{print $1}' /tmp/preflight-dns.txt | grep -c '\.' || true)"
          v6="$(awk '{print $1}' /tmp/preflight-dns.txt | grep -c ':'  || true)"
          echo "Resolved address families: IPv4=${v4} IPv6=${v6}"

          # Pure-bash TCP open/close. No credentials are involved: the
          # password is never referenced in this step at all.
          if timeout 15 bash -c "exec 3<>/dev/tcp/${DB_HOST}/${DB_PORT}" 2>/dev/null; then
            echo "TCP connect to ${DB_HOST}:${DB_PORT} succeeded."
            exit 0
          fi

          echo "::error::Cannot reach ${DB_HOST}:${DB_PORT} from this runner (IPv4=${v4} IPv6=${v6})."
          hint_and_die

      # ── Positive control — rewritten after Run #1 ──────────
      # Run #1 used CREATE TEMPORARY TABLE and the server accepted it.
      # That was NOT a temp-table exemption: PostgreSQL rejects CREATE
      # TEMPORARY TABLE in a read-only transaction just like any other
      # CREATE (the documented exemption is writing to an ALREADY
      # EXISTING temp table). So the acceptance meant the session was
      # genuinely writable - PGOPTIONS does not survive the pooler,
      # which does not forward the "options" startup parameter.
      #
      # The fix does not argue with the pooler: read-only is now set
      # IN BAND with ordinary SQL, which always reaches the server.
      #
      # The control is safe even in the case it exists to detect. The
      # write runs inside a plain BEGIN, which inherits the session
      # default, and ends in ROLLBACK. If read-only is active the
      # statement is refused with SQLSTATE 25006; if it is not, the
      # statement succeeds and is then discarded, so nothing persists
      # either way - and rc == 0 makes the workflow fail closed.
      - name: Prove the remote session is read-only
        shell: bash
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"

          # (a) Observe what the session arrives with, for diagnosis.
          psql "$URL" -X -q -At \
            -c "select 'arrived: default_transaction_read_only=' || current_setting('default_transaction_read_only')" \
            | tee "$OUT/readonly-session.txt"

          # (b) Force read-only in band, then read it back.
          got="$(psql "$URL" -X -q -At -c "$RO" \
                   -c "select current_setting('default_transaction_read_only')")"
          echo "after in-band SET: default_transaction_read_only=${got}" | tee -a "$OUT/readonly-session.txt"
          [ "$got" = "on" ] || {
            echo "::error::could not put the session into read-only mode (got '${got}')"; exit 1; }

          # (c) Attempt a PERSISTENT write that read-only must refuse.
          set +e
          err="$(psql "$URL" -X -v VERBOSITY=verbose -At \
                   -c "$RO" \
                   -c "begin; create table _cp4_readonly_probe(i int); rollback;" 2>&1 >/dev/null)"
          rc=$?
          set -e
          printf '%s\n' "$err" > "$OUT/readonly-control.txt"

          if [ "$rc" -eq 0 ]; then
            echo "::error::the server ACCEPTED a persistent write - read-only enforcement is NOT active"
            exit 1
          fi
          grep -q '25006' "$OUT/readonly-control.txt" || {
            echo "::error::the write was refused, but not with SQLSTATE 25006 (read_only_sql_transaction):"
            cat "$OUT/readonly-control.txt"
            exit 1; }
          echo "Confirmed: a persistent write is refused with SQLSTATE 25006."

      - name: Capture live fingerprint (Level 2 reference)
        shell: bash
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          # -c "$RO" puts the session in read-only IN BAND, because
          # PGOPTIONS does not survive the pooler. -q suppresses the
          # SET tag and the \pset notices, which would otherwise land
          # in the fingerprint and break the comparison.
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/live-fingerprint.txt"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/live-fingerprint.txt"
          wc -l "$OUT/live-fingerprint.txt"

      - name: Capture storage + default privileges as SQL
        shell: bash
        run: |
          set -euo pipefail
          # db dump --schema public does NOT emit these, and they are
          # application-owned. Generated from the live catalog, never
          # reconstructed from memory.
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          # -q matters doubly here: without it psql writes "Output
          # format is unaligned." into this file, and the file is
          # concatenated into the candidate baseline, where such a line
          # is not valid SQL.
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -At -c "$RO" \
            -f supabase/baseline-candidate/tools/emit-storage-and-defacl.sql \
            > "$OUT/storage-and-defacl.sql"
          grep -c . "$OUT/storage-and-defacl.sql"

      # ── STAGE C) candidate baseline ────────────────────────
      - name: Show the exact pg_dump that will run
        shell: bash
        run: |
          set -euo pipefail
          # --dry-run prints the pg_dump script; evidence that this is a read.
          npm run --silent supabase -- db dump --linked --schema public --keep-comments --dry-run \
            | tee "$OUT/pg_dump-command.txt"

      - name: Dump remote public schema
        shell: bash
        run: |
          set -euo pipefail
          # --role-only is deliberately NEVER used: it can emit role
          # password hashes. See EXCLUSIONS.md.
          npm run --silent supabase -- db dump --linked --schema public --keep-comments \
            -f "$OUT/v1_baseline_public.sql"
          wc -c "$OUT/v1_baseline_public.sql"
          cat "$OUT/v1_baseline_public.sql" "$OUT/storage-and-defacl.sql" > "$OUT/v1_baseline_candidate.sql"
          echo "Candidate assembled. It stays OUTSIDE supabase/migrations/."

      # ── Candidate data guard — rewritten after Run #2 ──────
      # Run #2 failed here on ten hits. Every one was inside a
      # function body, and one was Arabic prose in a /* */ comment in
      # record_audit(). None was dumped data: the CLI runs pg_dump
      # with --schema-only, which emits no table rows at all.
      #
      # The guard was not removed - a raw grep simply cannot tell a
      # data row from an INSERT inside a function body. It is replaced
      # with a scanner that strips dollar-quoted bodies, line and block
      # comments, string literals and quoted identifiers, and only then
      # looks at what is left, which is genuinely top-level SQL.
      - name: Assert candidate carries no business data or secrets
        shell: bash
        run: |
          set -euo pipefail

          # Belt and braces: the dump must have been schema-only. If the
          # CLI ever starts emitting data, this catches it at the source
          # rather than relying on the scanner alone.
          grep -q -- "--schema-only" "$OUT/pg_dump-command.txt" || {
            echo "::error::pg_dump was not invoked with --schema-only"; exit 1; }

          cat > /tmp/candidate_guard.py <<'GUARD_EOF'
          #!/usr/bin/env python3
          """Candidate baseline data guard.

          Raw grep over SQL text cannot tell a dumped data row from an INSERT that
          lives inside a function body or a comment. Run #2 proved that: all ten
          hits were inside function bodies, one of them Arabic prose in a block
          comment.

          So this strips what is not top-level SQL - dollar-quoted bodies, line
          and block comments, string literals and quoted identifiers - and only
          then looks for data statements. What survives the strip is genuinely
          top level.
          """
          import re, sys

          ALLOWED_INSERT_TARGET = re.compile(r'^\s*insert\s+into\s+"?storage"?\s*\.\s*"?buckets"?', re.I)

          def strip_to_top_level(src: str) -> list[tuple[int, str]]:
              """Return [(line_no, top_level_text)], blanking everything nested."""
              out, line_no, i, n = [], 1, 0, len(src)
              cur = []
              state = 'code'      # code | line_comment | block_comment | squote | dquote | dollar
              depth = 0           # block comment nesting (PostgreSQL nests)
              tag = ''
              while i < n:
                  ch = src[i]
                  if ch == '\n':
                      out.append((line_no, ''.join(cur)))
                      cur = []; line_no += 1; i += 1
                      if state == 'line_comment':
                          state = 'code'
                      continue
                  if state == 'code':
                      if src.startswith('--', i):
                          state = 'line_comment'; i += 2; continue
                      if src.startswith('/*', i):
                          state = 'block_comment'; depth = 1; i += 2; continue
                      if ch == "'":
                          state = 'squote'; i += 1; continue
                      if ch == '"':
                          state = 'dquote'; cur.append('"'); i += 1; continue
                      m = re.match(r'\$([A-Za-z_][A-Za-z0-9_]*)?\$', src[i:])
                      if m:
                          state = 'dollar'; tag = m.group(0); i += len(tag); continue
                      cur.append(ch); i += 1; continue
                  if state == 'line_comment':
                      i += 1; continue
                  if state == 'block_comment':
                      if src.startswith('/*', i): depth += 1; i += 2; continue
                      if src.startswith('*/', i):
                          depth -= 1; i += 2
                          if depth == 0: state = 'code'
                          continue
                      i += 1; continue
                  if state == 'squote':
                      if ch == "'":
                          if src.startswith("''", i): i += 2; continue
                          state = 'code'; i += 1; continue
                      i += 1; continue
                  if state == 'dquote':
                      if ch == '"':
                          if src.startswith('""', i): i += 2; continue
                          state = 'code'; cur.append('"'); i += 1; continue
                      cur.append(ch); i += 1; continue
                  if state == 'dollar':
                      if src.startswith(tag, i):
                          state = 'code'; i += len(tag); continue
                      i += 1; continue
              out.append((line_no, ''.join(cur)))
              return out

          def main(path: str) -> int:
              src = open(path, encoding='utf-8', errors='replace').read()
              stripped = strip_to_top_level(src)
              findings = []
              for ln, text in stripped:
                  t = text.strip()
                  if not t:
                      continue
                  if re.match(r'^copy\b.*\bfrom\s+stdin', t, re.I):
                      findings.append((ln, 'COPY ... FROM stdin (table data)', text))
                  elif re.match(r'^insert\s+into\b', t, re.I) and not ALLOWED_INSERT_TARGET.match(t):
                      findings.append((ln, 'top-level INSERT outside storage.buckets', text))
                  elif re.search(r'\bsetval\s*\(', t, re.I):
                      findings.append((ln, 'sequence state (setval)', text))
                  elif re.search(r'\bpassword\b', t, re.I):
                      # Strict on purpose: a schema-only baseline of this project has
                      # no legitimate top-level use of the word. Verified against the
                      # live catalog - no column in public or storage is named
                      # anything like "password". String literals are already
                      # stripped, so a hash can never be printed by this message.
                      findings.append((ln, 'role password / credential keyword', text))
              if findings:
                  print('::error::candidate contains top-level data or secret statements')
                  for ln, why, text in findings[:40]:
                      print(f'  line {ln}: {why}: {text.strip()[:140]}')
                  return 1
              print('Candidate is schema/security only: no top-level data statements, '
                    'no sequence state, no role passwords.')
              return 0

          if __name__ == '__main__':
              sys.exit(main(sys.argv[1]))
          GUARD_EOF
          python3 /tmp/candidate_guard.py "$OUT/v1_baseline_candidate.sql" \
            | tee "$OUT/candidate-guard.txt"

      # ── STAGE D) fresh PostgreSQL 17 build #1 ──────────────
      - name: Start local stack (without the historical chain)
        shell: bash
        run: |
          set -euo pipefail
          # The proof must build from the CANDIDATE, never from the 37
          # unproven historical migrations. supabase start would apply
          # them, so they are moved aside in this ephemeral runner
          # workspace only. Nothing is committed; contents: read.
          mv supabase/migrations supabase/_migrations_held_aside
          mkdir -p supabase/migrations
          npm run --silent supabase -- start

      - name: Assert local server is PostgreSQL 17
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          num="$(PGOPTIONS= psql "$L" -At -c "select current_setting('server_version_num')")"
          echo "local server_version_num=$num"
          [ "$num" -ge 170000 ] && [ "$num" -lt 180000 ] || {
            echo "::error::local PostgreSQL is not major version 17 - proof aborted"; exit 1; }

      - name: Fresh build #1
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          PGOPTIONS= psql "$L" -v ON_ERROR_STOP=1 -f "$OUT/v1_baseline_candidate.sql" > "$OUT/build1.log" 2>&1 \
            || { echo "::error::candidate failed to apply from empty"; tail -50 "$OUT/build1.log"; exit 1; }
          PGOPTIONS= psql "$L" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          PGOPTIONS= psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/fresh1-fingerprint.txt"
          PGOPTIONS= psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/fresh1-fingerprint.txt"

      # ── STAGE E) equivalence, both levels ──────────────────
      - name: Level 1 - structural (pg_dump vs pg_dump)
        shell: bash
        run: |
          set -euo pipefail
          # NOT supabase db diff --linked: it builds its shadow from
          # supabase/migrations (the unproven chain), so it answers the
          # wrong question, and it is not established to be write-free.
          npm run --silent supabase -- db dump --local --schema public --keep-comments -f "$OUT/fresh1_public.sql"
          diff -u "$OUT/v1_baseline_public.sql" "$OUT/fresh1_public.sql" > "$OUT/level1-structural.diff" || true
          echo "Level 1 diff lines: $(wc -l < "$OUT/level1-structural.diff")"

      - name: Level 2 - security fingerprint (mandatory)
        shell: bash
        run: |
          set -euo pipefail
          diff -u "$OUT/live-fingerprint.txt" "$OUT/fresh1-fingerprint.txt" > "$OUT/level2-security.diff" || true
          echo "Level 2 diff lines: $(wc -l < "$OUT/level2-security.diff")"

      # ── STAGE G) compatibility probes (local only) ─────────
      - name: Compatibility probes
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          PGOPTIONS= psql "$L" -f supabase/baseline-candidate/tools/compat-probes.sql > "$OUT/compat-probes.txt" 2>&1
          tail -40 "$OUT/compat-probes.txt"

      # ── STAGE F) destroy, rebuild #2, determinism ──────────
      - name: Fresh build #2 and determinism check
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent supabase -- stop --no-backup
          npm run --silent supabase -- start
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          num="$(PGOPTIONS= psql "$L" -At -c "select current_setting('server_version_num')")"
          [ "$num" -ge 170000 ] || { echo "::error::rebuild is not PostgreSQL 17"; exit 1; }
          PGOPTIONS= psql "$L" -v ON_ERROR_STOP=1 -f "$OUT/v1_baseline_candidate.sql" > "$OUT/build2.log" 2>&1 \
            || { echo "::error::candidate failed to apply on rebuild"; tail -50 "$OUT/build2.log"; exit 1; }
          PGOPTIONS= psql "$L" -v ON_ERROR_STOP=1 -f supabase/seed.sql
          PGOPTIONS= psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/fresh2-fingerprint.txt"
          PGOPTIONS= psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/fresh2-fingerprint.txt"
          if ! diff -u "$OUT/fresh1-fingerprint.txt" "$OUT/fresh2-fingerprint.txt" > "$OUT/determinism.diff"; then
            echo "::error::build #1 and build #2 differ - the candidate is not deterministic"
            head -60 "$OUT/determinism.diff"; exit 1
          fi
          echo "Deterministic: build #1 and build #2 are identical."

      - name: Restore historical migrations and verify untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/_migrations_held_aside ]; then
            rmdir supabase/migrations 2>/dev/null || true
            mv supabase/_migrations_held_aside supabase/migrations
          fi
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 37 ] || { echo "::error::historical migrations not intact: $n"; exit 1; }
          git diff --quiet -- supabase/migrations || { echo "::error::historical migrations modified"; exit 1; }
          echo "37 historical migrations intact and unmodified."

      # ── STAGE H) artifact safety ───────────────────────────
      - name: Scan artifacts for secret-like material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          # Run #1 deleted the only file present on an early failure, so
          # the upload found an empty directory and the diagnosis had to
          # come from the job log instead of an artifact. Evidence is now
          # kept and scanned rather than deleted, and a summary is always
          # written so a failed run still produces a downloadable trail.
          {
            echo "run_id=${GITHUB_RUN_ID:-?} attempt=${GITHUB_RUN_ATTEMPT:-?}"
            echo "commit=${GITHUB_SHA:-?}"
            echo "endpoint=${DB_HOST}:${DB_PORT} user=${DB_USER}"
            echo "files:"; ls -la "$OUT" || true
          } > "$OUT/run-summary.txt"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|SCRAM-SHA-256\\\$|md5[0-9a-f]{32}|postgres(ql)?://[^ ]*:[^ ]*@|PASSWORD '" "$OUT"; then
            echo "::error::secret-like material found in proof artifacts - upload blocked"
            exit 1
          fi
          echo "Artifact secret scan clean."

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint4-proof
          path: ${{ env.OUT }}
          retention-days: 14
          if-no-files-found: error
