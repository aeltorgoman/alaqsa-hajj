# ════════════════════════════════════════════════════════════
# whatsapp-send — deployment + credential-free security proof
# ════════════════════════════════════════════════════════════
# Deploys `whatsapp-send` through the canonical CLI path and then
# proves its entire security boundary **without ever contacting Meta**.
#
# ⚠️ The terminal success condition is a **503**. The credential check
# inside the function deliberately runs after every other gate, so a
# request that reaches 503 has already passed identity, permission,
# rate limit, passenger, season and phone-ownership. Any 2xx on probe J
# would mean the run reached Meta — which this workflow must never do,
# and which the asserter fails closed on.
#
# Deliberately absent, and audited for: WHATSAPP_TOKEN · WHATSAPP_PHONE_ID
# · any Meta request · any migration · any schema change · any
# deployment of another function · any weakening of RLS, RPC grants,
# season guards or phone-ownership validation.
#
# The one production mutation is a single TEST passenger row, created
# and deleted inside the run, with cleanup under `if: always()`.
#
# ⚠️ `supabase link` is deliberately ABSENT. It resolves the project's
# **secret** service-role key through `GET /v1/projects/{ref}/api-keys
# ?reveal=true`, and the scoped personal-access-token model has no
# grantable scope for revealing secret key material — runs #3, #4 and
# #5 were refused there however the token was scoped. Nothing in this
# workflow ever needed that key: the deploy names `--project-ref`
# explicitly and every database read goes through psql. The
# zero-pending gate it used to provide is now computed directly, and
# more strictly, by `assert-ledger-correspondence.py`.

name: WhatsApp - deploy and prove the boundary without credentials

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type VERIFY-WHATSAPP-NO-CREDENTIALS to authorize the deploy and the temporary test row"
        required: true
        default: ""
      db_host:
        description: "Session pooler host from dashboard > Connect (NOT a secret)"
        required: true
        default: "aws-1-eu-central-1.pooler.supabase.com"
      db_port:
        description: "Session pooler port (NOT a secret)"
        required: true
        default: "5432"
      db_user:
        description: "Session pooler user (NOT a secret)"
        required: true
        default: "postgres.zkucwcnclbfvukhdqhgc"

permissions:
  contents: read

concurrency:
  group: whatsapp-credential-free-verification
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      SUPABASE_URL: https://zkucwcnclbfvukhdqhgc.supabase.co
      FUNCTION: whatsapp-send
      EXPECT_MIGRATIONS: "50"
      EXPECT_ROWS: "50"
      EXPECT_LATEST: "20260924093000"
      # ثابتٌ يُعرَف بالنظر: لا يشبه رقماً حقيقياً، ويُبحث عنه نصّاً
      FIXTURE_PHONE: "999000000001"
      FIXTURE_NAME: "__WA_HARNESS_TEST__"
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}
      OUT: whatsapp-verification-evidence

    steps:
      - name: Require confirmation, secrets, and the ABSENCE of WhatsApp credentials
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WA_TEST_PORTAL_EMAIL: ${{ secrets.WA_TEST_PORTAL_EMAIL }}
          WA_TEST_PORTAL_PASSWORD: ${{ secrets.WA_TEST_PORTAL_PASSWORD }}
          WA_TEST_NOPERM_EMAIL: ${{ secrets.WA_TEST_NOPERM_EMAIL }}
          WA_TEST_NOPERM_PASSWORD: ${{ secrets.WA_TEST_NOPERM_PASSWORD }}
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "VERIFY-WHATSAPP-NO-CREDENTIALS" ] || {
            echo "::error::confirmation string does not match - dispatch was not authorized"; exit 1; }
          missing=0
          for n in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_ANON_KEY \
                   WA_TEST_PORTAL_EMAIL WA_TEST_PORTAL_PASSWORD \
                   WA_TEST_NOPERM_EMAIL WA_TEST_NOPERM_PASSWORD; do
            if [ -z "${!n:-}" ]; then echo "::error::$n is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          # ولا يكفي ألّا نضبطهما: لو وُجدا لَسقط المسبار J إلى Meta.
          if [ -n "${WHATSAPP_TOKEN:-}" ] || [ -n "${WHATSAPP_PHONE_ID:-}" ]; then
            echo "::error::a WhatsApp credential exists as a repository secret."
            echo "::error::this workflow must run credential-free - probe J would reach Meta. Refusing."
            exit 1
          fi
          echo "Confirmed. Seven secrets present; no WhatsApp credential in scope."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: toolchain, committed config, and repository state"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is not available"; exit 1; }
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq "$EXPECT_MIGRATIONS" ] || { echo "::error::expected $EXPECT_MIGRATIONS migrations, found $n"; exit 1; }
          # الوضعُ الأمنيّ يأتي من الملفّ المُلتزَم لا من سطر الأمر
          grep -A1 '^\[functions\.whatsapp-send\]' supabase/config.toml | grep -q 'verify_jwt = true' || {
            echo "::error::config.toml does not declare verify_jwt = true for $FUNCTION"; exit 1; }
          [ -f "supabase/functions/$FUNCTION/index.ts" ] || { echo "::error::function source missing"; exit 1; }
          python3 supabase/verification/assert-whatsapp-probes.py --selftest
          python3 supabase/verification/assert-ledger-correspondence.py --selftest
          { echo "commit=${GITHUB_SHA}"; echo "cli=$v"; } | tee "$OUT/run-sha.txt"

      - name: "GATE: production ledger before"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          rows="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "select count(*) from supabase_migrations.schema_migrations")"
          latest="$(psql "$URL" -X -q -At -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          echo "rows=$rows latest=$latest" | tee "$OUT/ledger-before.txt"
          [ "$rows" -eq "$EXPECT_ROWS" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS"; exit 1; }
          [ "$latest" = "$EXPECT_LATEST" ] || { echo "::error::latest is $latest, expected $EXPECT_LATEST"; exit 1; }
          # والقائمةُ كاملةً، لا عدَدُها وحده: بها يُحسَب التطابُقُ في
          # الخطوة التالية. أرقامُ النسخ ليست سرّاً وهي في المستودع.
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
            -c "select version from supabase_migrations.schema_migrations order by version" \
            > "$OUT/ledger-versions-before.txt"
          [ -s "$OUT/ledger-versions-before.txt" ] || {
            echo "::error::the ledger version dump is empty"; exit 1; }

      # لا `link` ولا `db push --dry-run`: التطابُقُ يُحسَب من المجموعتين
      # مباشرةً — ملفّاتُ الهجرة النشطة في مقابل صفوف السجلّ. وهو أضيقُ
      # من خطّة الدفع لا أوسع: يُخفق أيضاً على هجرةٍ في الإنتاج لا
      # يعرفها المستودع، وتلك حالةٌ لا تُخفق فيها الخطّةُ أصلاً.
      # ولا سرَّ لهذه الخطوة: مُدخَلاها ملفٌّ ودليلٌ، كلاهما على القرص.
      - name: "GATE: repository and production hold the same migrations (before)"
        run: |
          set -euo pipefail
          python3 supabase/verification/assert-ledger-correspondence.py \
            supabase/migrations "$OUT/ledger-versions-before.txt" \
            "$EXPECT_ROWS" "$EXPECT_LATEST" | tee "$OUT/correspondence-before.txt"

      - name: "GATE: the project holds no WhatsApp secret"
        run: |
          set -euo pipefail
          # الأسماءُ وحدها تُقرأ، والبصماتُ تُقتطع. ثم **لا يُرفَع الجردُ
          # نفسه**: أسماءُ أسرارِ المشروع ليست سرّاً، لكن لا حاجةَ بنا
          # إلى نشرِ قائمتِها في أثرٍ باقٍ. فيُرفَع حكمُ الفحص وحده.
          npm run --silent supabase -- secrets list --project-ref "$PROJECT_REF" \
            | awk '{print $1}' > /tmp/secret-names.txt || true
          found="$(grep -ciE '^WHATSAPP_(TOKEN|PHONE_ID)$' /tmp/secret-names.txt || true)"
          total="$(wc -l < /tmp/secret-names.txt | tr -d ' ')"
          rm -f /tmp/secret-names.txt
          echo "project_secrets_examined=$total whatsapp_secrets_found=$found" | tee "$OUT/secret-names-check.txt"
          if [ "$found" -ne 0 ]; then
            echo "::error::a WhatsApp secret is configured on the project - this run would reach Meta. Refusing."
            exit 1
          fi
          echo "No WHATSAPP_TOKEN / WHATSAPP_PHONE_ID configured on the project."

      # ── the single production mutation, created before the deploy so
      #    cleanup covers a deployment failure too ──
      - name: "FIXTURE: create one temporary TEST passenger in the active season"
        id: fixture
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          # لا موسمَ يُذكر: العمودُ افتراضُه `active_season_id()`، فالصفُّ
          # يقع في الموسم النشط بالبناء ولا يُمَسّ موسمٌ مؤرشَف.
          # ولا كتمَ للتدقيق: `audit_suppression` نطاقُها `delete_season`
          # وحدها، فيبقى إدخالُ الصفّ وحذفُه مسجَّلَين — وهو الصواب.
          id="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 \
                -c "insert into public.passengers (name_ar, phone) values ('${FIXTURE_NAME}', '${FIXTURE_PHONE}') returning id")"
          case "$id" in ''|*[!0-9]*) echo "::error::fixture insert did not return an id"; exit 1 ;; esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "fixture_passenger_id=$id" | tee "$OUT/fixture.txt"
          active="$(psql "$URL" -X -q -At -c "select (s.closed_at is null) from public.passengers p join public.seasons s on s.id=p.season_id where p.id=$id")"
          [ "$active" = "t" ] || { echo "::error::fixture did not land in the active season"; exit 1; }

      - name: "Find a closed-season passenger for probe H"
        id: closed
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          # يُقرأ ولا يُمَسّ — لا تعديلَ على سجلٍّ مؤرشَف بحال
          id="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
                -c "select p.id from public.passengers p join public.seasons s on s.id=p.season_id where s.closed_at is not null order by p.id limit 1")"
          case "$id" in ''|*[!0-9]*) echo "::error::no closed-season passenger exists - probe H cannot be proven"; exit 1 ;; esac
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "closed_season_passenger_id=$id" | tee -a "$OUT/fixture.txt"

      # ── the canonical deployment ──
      - name: "DEPLOY: whatsapp-send through the Supabase CLI, honouring config.toml"
        id: deploy
        run: |
          set -euo pipefail
          # لا `--no-verify-jwt` ولا عكسُها: الوضعُ يأتي من config.toml
          npm run --silent supabase -- functions deploy "$FUNCTION" --project-ref "$PROJECT_REF" \
            2>&1 | tee "$OUT/deploy.log"
          npm run --silent supabase -- functions list --project-ref "$PROJECT_REF" \
            > "$OUT/functions.txt" 2>&1 || true
          grep -qi "$FUNCTION" "$OUT/functions.txt" || {
            echo "::error::$FUNCTION does not appear in the deployed function list"; exit 1; }
          echo "Deployed $FUNCTION."

      # ── one step: sign in, prove the identities, probe. ─────────
      # ⚠️ الرمزان **لا يغادران هذه العملية**. كانا يُكتبان في
      # `GITHUB_ENV` فيحيَيان إلى آخر المهمّة ويسكنان ملفّاً على
      # العامل؛ وهما الآن متغيّرا صَدَفةٍ محلّيّان في خطوةٍ واحدة:
      # يُكتسبان ويُخفيان ويُستعملان ويموتان بانتهائها. ولا يُكتبان
      # في ملفّ ولا في دليل الأدلّة ولا يُطبعان، ولا يُشفَّران
      # لينتقل الخطرُ إلى موضعٍ آخر — بل يضيق عمرُهما ونطاقُهما.
      - name: "PROBE: sign in, prove both identities, run A-J"
        id: probes
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          WA_TEST_PORTAL_EMAIL: ${{ secrets.WA_TEST_PORTAL_EMAIL }}
          WA_TEST_PORTAL_PASSWORD: ${{ secrets.WA_TEST_PORTAL_PASSWORD }}
          WA_TEST_NOPERM_EMAIL: ${{ secrets.WA_TEST_NOPERM_EMAIL }}
          WA_TEST_NOPERM_PASSWORD: ${{ secrets.WA_TEST_NOPERM_PASSWORD }}
          FIXTURE_ID: ${{ steps.fixture.outputs.id }}
          CLOSED_ID: ${{ steps.closed.outputs.id }}
        run: |
          set -euo pipefail
          EP="$SUPABASE_URL/functions/v1/$FUNCTION"

          # ١) الهويّتان — محلّيّتان، ومُخفاتان قبل أوّل استعمال
          JWT_PORTAL="$(python3 supabase/verification/signin.py "$WA_TEST_PORTAL_EMAIL" "$WA_TEST_PORTAL_PASSWORD" || true)"
          JWT_NOPERM="$(python3 supabase/verification/signin.py "$WA_TEST_NOPERM_EMAIL" "$WA_TEST_NOPERM_PASSWORD" || true)"
          [ -n "$JWT_PORTAL" ] || { echo "::error::could not sign in the manage_portal test account"; exit 1; }
          [ -n "$JWT_NOPERM" ] || { echo "::error::could not sign in the no-permission test account"; exit 1; }
          echo "::add-mask::$JWT_PORTAL"
          echo "::add-mask::$JWT_NOPERM"

          # ٢) وتُثبتان بالفحص لا بالتسمية: لو تبدّلت صلاحيةُ حسابٍ
          #    يوماً لَصار المسبار C يختبر لا شيء وهو يبدو ناجحاً.
          perm() {
            curl -s --max-time 45 -X POST "$SUPABASE_URL/rest/v1/rpc/has_permission" \
              -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer $1" \
              -H 'Content-Type: application/json' -d '{"p_key":"manage_portal"}'
          }
          p="$(perm "$JWT_PORTAL")"; n="$(perm "$JWT_NOPERM")"
          # قيمتان منطقيّتان — لا رمزَ فيهما ولا اسمَ حساب
          echo "portal_account_manage_portal=$p"  | tee "$OUT/identities.txt"
          echo "noperm_account_manage_portal=$n"  | tee -a "$OUT/identities.txt"
          [ "$p" = "true" ]  || { echo "::error::the portal test account does NOT hold manage_portal"; exit 1; }
          [ "$n" = "false" ] || { echo "::error::the no-permission test account DOES hold manage_portal"; exit 1; }

          # ٣) المسابير
          R="$OUT/probes.tsv"; : > "$R"

          # $1 probe  $2 expected  $3 bearer ("" = none)  $4 json body
          probe() {
            local name="$1" expect="$2" bearer="$3" body="$4" code
            if [ -z "$bearer" ]; then
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -X POST "$EP" \
                       -H 'Content-Type: application/json' -d "$body" || echo 000)"
            else
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 45 -X POST "$EP" \
                       -H 'Content-Type: application/json' -H "Authorization: Bearer $bearer" \
                       -d "$body" || echo 000)"
            fi
            printf '%s\t%s\t%s\n' "$name" "$expect" "$code" >> "$R"
            printf '  %s expected %s got %s\n' "$name" "$expect" "$code"
          }

          VALID="{\"kind\":\"text\",\"to\":\"$FIXTURE_PHONE\",\"passengerId\":$FIXTURE_ID,\"text\":\"probe\"}"

          # A · no Authorization header at all — the gateway refuses
          probe A 401 "" "$VALID"
          # B · the anon key IS a valid JWT, so the gateway lets it through;
          #     getUser() then finds no user behind it
          probe B 401 "$SUPABASE_ANON_KEY" "$VALID"
          # C · authenticated, but without manage_portal
          probe C 403 "$JWT_NOPERM" "$VALID"
          # D · unknown kind — rejected before authorization even runs
          probe D 400 "$JWT_PORTAL" "{\"kind\":\"bogus\",\"to\":\"$FIXTURE_PHONE\",\"passengerId\":$FIXTURE_ID,\"text\":\"x\"}"
          # E · no passengerId — every message must name its pilgrim
          probe E 400 "$JWT_PORTAL" "{\"kind\":\"text\",\"to\":\"$FIXTURE_PHONE\",\"text\":\"x\"}"
          # F · empty text. Reaches the payload builder only because the
          #     pilgrim and phone are valid, so this also proves ordering.
          probe F 400 "$JWT_PORTAL" "{\"kind\":\"text\",\"to\":\"$FIXTURE_PHONE\",\"passengerId\":$FIXTURE_ID,\"text\":\"   \"}"
          # G · document type outside the allowlist
          probe G 400 "$JWT_PORTAL" "{\"kind\":\"document\",\"to\":\"$FIXTURE_PHONE\",\"passengerId\":$FIXTURE_ID,\"docType\":\"bogus\"}"
          # H · a pilgrim of a CLOSED season — read only, never modified
          probe H 404 "$JWT_PORTAL" "{\"kind\":\"text\",\"to\":\"$FIXTURE_PHONE\",\"passengerId\":$CLOSED_ID,\"text\":\"x\"}"
          # I · the right pilgrim, someone else's number
          probe I 403 "$JWT_PORTAL" "{\"kind\":\"text\",\"to\":\"999000000999\",\"passengerId\":$FIXTURE_ID,\"text\":\"x\"}"
          # J · everything valid — stops at the missing credentials. TERMINAL.
          probe J 503 "$JWT_PORTAL" "$VALID"

          # والرمزان يموتان بانتهاء هذه الصَدَفة — لا GITHUB_ENV ولا ملفّ
          unset JWT_PORTAL JWT_NOPERM
          echo "--- results ---"; cat "$R"

      - name: "ASSERT: every probe matched, and J stopped at 503"
        if: always() && steps.probes.outcome != 'skipped'
        run: |
          set -euo pipefail
          rc=0
          python3 supabase/verification/assert-whatsapp-probes.py "$OUT/probes.tsv" | tee "$OUT/probe-report.txt" || rc=$?
          if [ "$rc" -eq 0 ]; then echo PASS > "$OUT/status-probes.txt"; else echo FAIL > "$OUT/status-probes.txt"; fi
          echo "Probe verdict: $(cat "$OUT/status-probes.txt")"

      # ── cleanup runs whatever happened above ───────────────────
      # `if: always()` بلا شرط: كان مشروطاً بوجود مُخرَج المعرّف، فلو
      # نجح الإدخال وضاع المعرّف بعده لَبقي الصفُّ بلا منظِّف. والآن
      # تعمل الخطوةُ دائماً، وتكنس بالهويّة الثابتة حتى بلا معرّف.
      # `outcome != 'skipped'` لا `outputs.id != ''`: الشرطُ أن تكون
      # خطوةُ الإدخال قد **بلغت التنفيذ**، نجحت أو أخفقت — فعندها
      # وحدها يمكن أن يكون صفٌّ قد دخل. ولو لم تُبلَغ فلا صفَّ، ولا
      # داعي لإنذارِ تنظيفٍ كاذبٍ على إخفاقٍ سابقٍ لها.
      - name: "CLEANUP: delete the temporary TEST passenger and prove it is gone"
        if: always() && steps.fixture.outcome != 'skipped'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          FIXTURE_ID: ${{ steps.fixture.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          # الهويّةُ الثابتة شرطُ كلّ حذف. ولو فرغ أحدُ الثابتَين
          # لَصار الشرطُ `= ''` وقد يطابق صفّاً بريئاً — فيُرفَض قبله.
          if [ -z "${FIXTURE_NAME:-}" ] || [ -z "${FIXTURE_PHONE:-}" ]; then
            echo "::error::the fixture identity constants are empty - refusing to run any DELETE"
            echo FAIL > "$OUT/status-cleanup.txt"; exit 1
          fi
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          ID="${FIXTURE_ID:-0}"
          case "$ID" in ''|*[!0-9]*) ID=0 ;; esac

          # ١) الحذفُ الموجَّه — المعرّفُ **والاسمُ والرقمُ** معاً. فلو
          #    فسد المُخرَج فدلّ على حاجٍّ آخر، لم يطابق الشرطَ أصلاً.
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 \
            -c "delete from public.passengers where id = ${ID} and name_ar = '${FIXTURE_NAME}' and phone = '${FIXTURE_PHONE}'" >/dev/null
          # ٢) والكنسُ — بالهويّة الثابتة وحدها، لصفٍّ أُدخل ثم ضاع
          #    معرّفُه. وهو مقصورٌ على اسمٍ ورقمٍ لا يحملهما حاجٌّ حقيقيّ.
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 \
            -c "delete from public.passengers where name_ar = '${FIXTURE_NAME}' and phone = '${FIXTURE_PHONE}'" >/dev/null

          # الغيابُ يُثبَت، ولا يُكتفى بأن الحذف لم يُخطئ
          by_id="$(psql "$URL" -X -q -At -c "select count(*) from public.passengers where id = ${ID} and name_ar = '${FIXTURE_NAME}'")"
          by_identity="$(psql "$URL" -X -q -At -c "select count(*) from public.passengers where name_ar = '${FIXTURE_NAME}' or phone = '${FIXTURE_PHONE}'")"
          echo "by_id=$by_id by_identity=$by_identity" | tee "$OUT/cleanup.txt"
          if [ "$by_id" -eq 0 ] && [ "$by_identity" -eq 0 ]; then
            echo PASS > "$OUT/status-cleanup.txt"
          else
            echo FAIL > "$OUT/status-cleanup.txt"
            echo "::error::the temporary test passenger is still present - remove it by hand"
          fi
          echo "Cleanup verdict: $(cat "$OUT/status-cleanup.txt")"

      # ── nothing else moved ──
      - name: "POST: ledger, pending, and schema integrity"
        if: always() && steps.probes.outcome != 'skipped'
        env:
          # لا `SUPABASE_DB_PASSWORD` بعد اليوم: لم يكن يقرؤه إلّا
          # `db push --linked` وقد زال. وpsql يقرأ `PGPASSWORD` وحده.
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          rows="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "select count(*) from supabase_migrations.schema_migrations")"
          latest="$(psql "$URL" -X -q -At -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          echo "rows=$rows latest=$latest" | tee "$OUT/ledger-after.txt"
          bad=0
          [ "$rows" -eq "$EXPECT_ROWS" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS"; bad=1; }
          [ "$latest" = "$EXPECT_LATEST" ] || { echo "::error::latest is $latest, expected $EXPECT_LATEST"; bad=1; }
          # ويُعاد الجردُ من الخادم لا من الملفّ السابق، وإلّا لَأثبتَ
          # ما قبلَ النشرِ مرّتين ولم يُثبت ما بعده.
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
            -c "select version from supabase_migrations.schema_migrations order by version" \
            > "$OUT/ledger-versions-after.txt" || true
          if [ -s "$OUT/ledger-versions-after.txt" ]; then
            python3 supabase/verification/assert-ledger-correspondence.py \
              supabase/migrations "$OUT/ledger-versions-after.txt" \
              "$EXPECT_ROWS" "$EXPECT_LATEST" | tee "$OUT/correspondence-after.txt" || bad=1
          else
            echo "::error::could not re-read the ledger after the run"; bad=1
          fi
          # ولا يكفي التطابُقُ بعدَ النشر: يجب أن تكون المجموعةُ **هي
          # هي** قبلَه وبعده. فلو تبدّلت نسختان معاً لَبقي التطابُق.
          if ! diff -q "$OUT/ledger-versions-before.txt" "$OUT/ledger-versions-after.txt" >/dev/null 2>&1; then
            echo "::error::the production ledger changed during this run"; bad=1
          fi
          if [ "$bad" -eq 0 ]; then echo PASS > "$OUT/status-integrity.txt"; else echo FAIL > "$OUT/status-integrity.txt"; fi
          echo "Integrity verdict: $(cat "$OUT/status-integrity.txt")"

      # ⚠️ `if: always()` بلا شرطٍ على المسابير: كان مشروطاً بها، فلو
      # سقط النشرُ قبلها لَتخطّت هذه الخطوةُ، ولَمرّ إخفاقُ التنظيف
      # بلا حكم. والآن لا يُخفي إخفاقٌ سابقٌ إخفاقَ التنظيف.
      - name: "Verdict (fails the run)"
        if: always()
        env:
          FIXTURE_OUTCOME: ${{ steps.fixture.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bad=0

          # متى بلغت خطوةُ الإدخال التنفيذَ، صار للتنظيف حكمٌ واجب —
          # وغيابُه إخفاقٌ لا سكوت. وإن لم تُبلَغ فلا صفَّ ولا حكم.
          if [ "${FIXTURE_OUTCOME:-skipped}" = "skipped" ]; then
            printf '%-10s %s\n' cleanup "n/a (no row was ever created)"
          elif [ ! -s "$OUT/status-cleanup.txt" ]; then
            echo "::error::cleanup recorded no verdict - the temporary row may still exist"; bad=1
          else
            v="$(cat "$OUT/status-cleanup.txt")"; printf '%-10s %s\n' cleanup "$v"
            [ "$v" = "PASS" ] || bad=1
          fi

          # وأمّا المسابيرُ والسلامةُ فيُحكَم عليها إن بلغها السير،
          # ويُعلَن صراحةً أنها لم تُبلَغ إن لم تُبلَغ — ولا تُحسَب نجاحاً.
          for k in probes integrity; do
            f="$OUT/status-$k.txt"
            if [ ! -s "$f" ]; then
              echo "::warning::$k did not run - an earlier step stopped the workflow"
              printf '%-10s %s\n' "$k" "NOT REACHED"
              bad=1
            else
              v="$(cat "$f")"; printf '%-10s %s\n' "$k" "$v"
              [ "$v" = "PASS" ] || bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then echo FAIL > "$OUT/verdict.txt"; exit 1; fi
          echo PASS > "$OUT/verdict.txt"
          echo "whatsapp-send is deployed, its whole boundary is proven, and Meta was never contacted."

      - name: "Scan evidence for secret-like material"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          { echo "run_id=${GITHUB_RUN_ID:-?} attempt=${GITHUB_RUN_ATTEMPT:-?}";
            echo "commit=${GITHUB_SHA:-?}";
            echo "project=${PROJECT_REF} function=${FUNCTION}";
            echo "files:"; ls -la "$OUT" || true; } > "$OUT/run-summary.txt"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|EAA[A-Za-z0-9]{20,}|Bearer [A-Za-z0-9_-]{20,}|postgres(ql)?://[^ ]*:[^ ]*@|token=[A-Za-z0-9_-]{20,}" "$OUT"; then
            echo "::error::secret-like material found in the evidence - upload blocked"; exit 1
          fi
          echo "Evidence secret scan clean."

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-credential-free-verification
          path: whatsapp-verification-evidence
          if-no-files-found: error
