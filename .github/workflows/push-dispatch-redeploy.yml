# ════════════════════════════════════════════════════════════
# deploy push-dispatch (M5), and nothing else
# ════════════════════════════════════════════════════════════
# دفعُ التنبيهات المجدوَلة حين يحين موعدُها. يوقظه المُجدوِل وحده
# (`push_dispatch_tick()` عبر pg_net) بمفتاحٍ سرّيٍّ مسمّى `push_dispatch`.
#
# ⚠️ ONE function. The slug is hard-coded, not an input. `functions
# deploy` with no slug deploys ALL of them, so the argument is mandatory
# and asserted before the call.
#
# `verify_jwt = false` comes from `supabase/config.toml` and stays a
# reviewed repository change: the named key `sb_secret_…` is not a JWT,
# so the platform gate cannot check it. Authentication is in
# push-dispatch/handler.ts, before any other work; this workflow refuses
# unless that gate is present, and after the deploy proves from outside
# that a request without the key, or with a wrong one, is refused.
#
# The bundle is exactly four files, pinned below. One of them is
# send-pilgrim-push/delivery.ts — imported, not copied, so M6 delivery
# has one source. send-pilgrim-push itself is NOT deployed here, and its
# own index.ts and config are asserted unchanged.
#
# Deliberately absent and audited for:
# `db push` · `secrets set` · `config push` · any second slug · any
# request that carries a key. (`secrets list` IS used by the
# configuration gate: names only, never a value.)
#
# Deploying does NOT activate anything: without the M5 scheduler
# (separate migration, separate approval) nothing calls this function,
# and a `dispatch` request without a live lease written by the
# scheduler is refused (409).
#
# Rollback (there is no earlier version to return to):
#   1. stop the scheduler (`cron.unschedule`, PR 2) — nothing calls it;
#   2. revoke the `push_dispatch` secret key in the dashboard — every
#      request is then refused (503), whoever sends it;
#   3. deleting the function is a separate, explicitly approved step.
#
# The pinned sha256 values are the reviewed source (`M-108`). A stale
# pin REFUSES the deployment, which is the intended direction of failure.

name: Deploy push-dispatch (ONE function)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type DEPLOY-PUSH-DISPATCH to authorize"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: push-dispatch-redeploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      SLUG: push-dispatch
      # "<path under supabase/functions>:<sha256>" — the exact bundle
      PINS: >-
        push-dispatch/index.ts:90bd704bf0915f67a11f6faab8a75ae3d253241d0d6997ccc8d2bce27e179402
        push-dispatch/handler.ts:1719f6daa4bec72d045178fc3ae926800a00d46604e71c2ca03b94352bd96bc9
        push-dispatch/deliver.ts:a21903bbfe25c1f6c122cb5c4de3d956f240e5370c373ac76c25f87b4d2895d5
        send-pilgrim-push/delivery.ts:b04f3d68606b1ec9df941f32f52d3733e0a25fbbb6fa3e595f7ed93009acfecf
      # send-pilgrim-push is not deployed here; its entry point must be the reviewed one
      SPP_INDEX_SHA256: "103b940b2744aa674527bdd134047098532933a20576155cfd6fd8b81942bcf8"

    steps:
      - name: "GATE: confirmation and ref"
        # the input reaches the shell as data (env), never as script text
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "${CONFIRM}" = "DEPLOY-PUSH-DISPATCH" ] || {
            echo "::error::confirmation string does not match"; exit 1; }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::must run from main, got ${GITHUB_REF}"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: the exact sources, bundle and authentication under review"
        run: |
          set -euo pipefail
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          for p in $PINS; do
            f="supabase/functions/${p%%:*}"; w="${p##*:}"
            [[ "$w" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$f pin is not a full SHA-256"; exit 1; }
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$got" = "$w" ] || { echo "::error::$f sha256 mismatch: $got"; exit 1; }
            echo "ok   $f  $got"
          done
          got="$(sha256sum supabase/functions/send-pilgrim-push/index.ts | cut -d' ' -f1)"
          [ "$got" = "$SPP_INDEX_SHA256" ] || { echo "::error::send-pilgrim-push/index.ts changed: $got"; exit 1; }
          git diff --quiet || { echo "::error::working tree is dirty"; exit 1; }
          # the bundle the CLI builds is exactly the pinned files — nothing rides along unpinned
          python3 -I - "$SLUG" <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("p", "supabase/verification/assert-edge-function-parity.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          got = m.expected_files("supabase/functions", sys.argv[1])
          want = {s.split(":")[0] for s in os.environ["PINS"].split()}
          if len(want) != 4 or got != want:
              sys.exit(f"::error::bundle would be {sorted(got)}, expected {sorted(want)}")
          print("bundle:", ", ".join(sorted(got)))
          PY
          # verify_jwt: false for this function only, and true stays true for the manual path
          grep -A1 "^\[functions\.$SLUG\]" supabase/config.toml | grep -q "verify_jwt = false" || {
            echo "::error::config.toml does not declare verify_jwt = false for $SLUG"; exit 1; }
          grep -A1 "^\[functions\.send-pilgrim-push\]" supabase/config.toml | grep -q "verify_jwt = true" || {
            echo "::error::config.toml no longer declares verify_jwt = true for send-pilgrim-push"; exit 1; }
          # the authentication gate is present (the pins already fix its bytes; this names it)
          H=supabase/functions/$SLUG/handler.ts
          grep -q 'export const KEY_NAME = "push_dispatch";' "$H" || { echo "::error::named key gate missing"; exit 1; }
          grep -q 'req.headers.get("apikey")' "$H" || { echo "::error::apikey check missing"; exit 1; }
          grep -q 'await sameKey(presented, expected)' "$H" || { echo "::error::constant-time comparison missing"; exit 1; }
          if grep -nE 'console\.(log|error|warn).*(presented|expected|secretKeysEnv|SUPABASE_SECRET_KEYS)' supabase/functions/$SLUG/*.ts; then
            echo "::error::a key-bearing value reaches a log"; exit 1; fi
          echo "commit=${GITHUB_SHA}"

      - name: "GATE: required Edge Function configuration is present on the project"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          node scripts/release/preflight-edge-config.mjs \
            --function "$SLUG" --project-ref "$PROJECT_REF"

      - name: "DEPLOY: exactly one function"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "$SLUG" ] || { echo "::error::empty slug would deploy EVERY function"; exit 1; }
          npm run --silent supabase -- functions deploy "$SLUG" --project-ref "$PROJECT_REF" 2>&1 \
            | sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g'

      - name: "POST: the deployed source is the pinned bundle"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          rm -rf supabase/functions
          mkdir -p supabase/functions
          npm run --silent supabase -- functions download "$SLUG" \
            --project-ref "$PROJECT_REF" --use-api > "$RUNNER_TEMP/download.log" 2>&1 || {
            echo "::error::download failed"; sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g' "$RUNNER_TEMP/download.log"; exit 1; }
          cd supabase/functions
          got="$(find . -type f | sed 's|^\./||' | sort)"
          want="$(for p in $PINS; do echo "${p%%:*}"; done | sort)"
          [ "$got" = "$want" ] || { echo "::error::deployed files differ:"; diff <(echo "$want") <(echo "$got") || true; exit 1; }
          for p in $PINS; do
            f="${p%%:*}"; w="${p##*:}"
            h="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$h" = "$w" ] || { echo "::error::deployed $f sha256 $h != $w"; exit 1; }
            echo "ok   deployed $f  $h"
          done

      # From outside, with NO key: verify_jwt = false must not mean open.
      # No request here carries any key, so none can reach the database
      # or a device — the gate answers before anything else runs.
      - name: "POST: unauthenticated requests are refused"
        run: |
          set -euo pipefail
          U="https://${PROJECT_REF}.supabase.co/functions/v1/${SLUG}"
          code() { curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$@"; }
          ok_refused() { case "$2" in 401|503) echo "ok   $1 -> $2";; *) echo "::error::$1 -> $2 (expected 401, or 503 before the named key exists)"; exit 1;; esac; }
          ok_refused "POST, no key"          "$(code -X POST -H 'Content-Type: application/json' -d '{"mode":"probe"}' "$U")"
          ok_refused "POST, wrong key"       "$(code -X POST -H 'Content-Type: application/json' -H "apikey: sb_""secret_not_a_real_key_0000000000" -d '{"mode":"probe"}' "$U")"
          ok_refused "POST dispatch, no key" "$(code -X POST -H 'Content-Type: application/json' -d '{"mode":"dispatch","run_id":"00000000-0000-4000-8000-000000000000"}' "$U")"
          c="$(code -X GET "$U")"; [ "$c" = "405" ] || { echo "::error::GET -> $c (expected 405)"; exit 1; }; echo "ok   GET -> 405"
          echo "$SLUG serves exactly the pinned source and refuses every request without the named key."
