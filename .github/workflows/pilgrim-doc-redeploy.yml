# ════════════════════════════════════════════════════════════
# #188 — redeploy pilgrim-doc, and nothing else
# ════════════════════════════════════════════════════════════
# PR #188 raised the general per-source flood guard of `pilgrim-doc`
# (`portalDocSrc`) from 120 to 2000/hour in `_shared/rateLimit.ts`.
# The failed-session limit (60/h) and the per-pilgrim signing limit
# (60/h) are unchanged. This makes the platform carry the reviewed
# source.
#
# ⚠️ ONE function. The slug is hard-coded, not an input. `functions
# deploy` with no slug deploys ALL of them, so the argument is
# mandatory and asserted before the call.
#
# `verify_jwt` is NOT set here: it comes from `supabase/config.toml`
# (`pilgrim-doc = false`, the approved public-with-session design).
# Secrets are not touched. Deliberately absent and audited for:
# `db push` · `secrets set` · `config push` · any second slug.

name: Redeploy pilgrim-doc (ONE function)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REDEPLOY-PILGRIM-DOC to authorize"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: pilgrim-doc-redeploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      SLUG: pilgrim-doc
      SRC_SHA256: "6eaa7c95192757a936074ecfe226ce3c167c0b85b059e7191f46cb02a6be39f0"
      RATELIMIT_SHA256: "02e26e648c3eb0918675be96d59e5eaed4d9548d7fb5d86aba44d977c7be7cd7"
      HTTP_SHA256: "147f3657212178c7e96cbef08ff3048fbe4e010ee8c2826e41e142608bd1d1d1"

    steps:
      - name: "GATE: confirmation"
        run: |
          set -euo pipefail
          [ "${{ inputs.confirm }}" = "REDEPLOY-PILGRIM-DOC" ] || {
            echo "::error::confirmation string does not match"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: the exact sources under review, unmodified"
        run: |
          set -euo pipefail
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          chk() { got="$(sha256sum "$1" | cut -d' ' -f1)"; [ "$got" = "$2" ] || { echo "::error::$1 sha256 mismatch: $got"; exit 1; }; echo "ok   $1  $got"; }
          chk "supabase/functions/$SLUG/index.ts" "$SRC_SHA256"
          chk "supabase/functions/_shared/rateLimit.ts" "$RATELIMIT_SHA256"
          chk "supabase/functions/_shared/http.ts" "$HTTP_SHA256"
          git diff --quiet || { echo "::error::working tree is dirty"; exit 1; }
          grep -A1 "^\[functions\.$SLUG\]" supabase/config.toml | grep -q "verify_jwt = false" || {
            echo "::error::config.toml no longer declares verify_jwt = false for $SLUG"; exit 1; }
          # الحدودُ المعتمدةُ بحرفها
          grep -q 'portalDocSrc:  { scope: "portal-doc-src",  limit: 2000, windowSeconds: 3600 }' supabase/functions/_shared/rateLimit.ts
          grep -q 'portalDocSession: { scope: "portal-doc-session", limit: 60, windowSeconds: 3600 }' supabase/functions/_shared/rateLimit.ts
          grep -q 'portalDocSign: { scope: "portal-doc-sign", limit: 60,  windowSeconds: 3600 }' supabase/functions/_shared/rateLimit.ts
          echo "commit=${GITHUB_SHA} limits src=2000 session=60 sign=60"

      - name: "DEPLOY: exactly one function"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "$SLUG" ] || { echo "::error::empty slug would deploy EVERY function"; exit 1; }
          npm run --silent supabase -- functions deploy "$SLUG" --project-ref "$PROJECT_REF" 2>&1 \
            | sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g'
