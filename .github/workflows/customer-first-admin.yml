name: Create First Administrator

on:
  workflow_dispatch:
    inputs:
      admin_login:
        description: "Administrator Login ID (email format)"
        required: true
      admin_name:
        description: "Administrator display name"
        required: true

permissions:
  contents: read

concurrency:
  group: customer-first-administrator
  cancel-in-progress: false

jobs:
  create-admin:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      ADMIN_PASSWORD: ${{ secrets.FIRST_ADMIN_PASSWORD }}
      ADMIN_EMAIL: ${{ inputs.admin_login }}
      ADMIN_NAME: ${{ inputs.admin_name }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Check required secrets"
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_URL:-}" ] || { echo "::error::SUPABASE_URL is missing"; exit 1; }
          [ -n "${SUPABASE_SERVICE_ROLE_KEY:-}" ] || { echo "::error::SUPABASE_SERVICE_ROLE_KEY is missing"; exit 1; }
          [ -n "${ADMIN_PASSWORD:-}" ] || { echo "::error::FIRST_ADMIN_PASSWORD is missing"; exit 1; }
          echo "::add-mask::$SUPABASE_SERVICE_ROLE_KEY"
          echo "::add-mask::$ADMIN_PASSWORD"

      - name: "Install dependencies"
        run: npm ci

      - name: "Create and verify first administrator"
        run: |
          set -euo pipefail
          printf 'نعم\n' | node supabase/scripts/seed_first_admin.mjs

      - name: "Setup result"
        run: |
          {
            echo "## Create First Administrator — SUCCESS"
            echo
            echo "The first administrator was created and verified."
            echo
            echo "**Permissions:** 13 / 13"
            echo
            echo "The password and service-role key were not printed."
          } >> "$GITHUB_STEP_SUMMARY"
