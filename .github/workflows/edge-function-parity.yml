# ════════════════════════════════════════════════════════════
# #32/٣ — is the deployed Edge Function source the one in the repo?
# ════════════════════════════════════════════════════════════
# READ ONLY. It downloads and compares. It never deploys, never
# writes to the project, and never touches the database. There is
# deliberately no `functions deploy` anywhere in this file: creating
# parity by overwriting production would prove nothing.
#
# `--use-api` unbundles server-side, so no Docker is needed.
#
# The repository copy is moved aside first, because `functions
# download` writes into `supabase/functions/<slug>/` — the very path
# being compared. Diffing a directory against itself would pass
# trivially, which is the one failure mode this check must not have.
#
# Each function is downloaded ALONE and moved into its own directory
# before the next download. A bundle carries its own copy of the
# `_shared/` files it imports, and `functions download` always writes
# them to the same `supabase/functions/_shared/`: downloading every
# function into one tree let each overwrite the last, so the single
# `_shared/` comparison judged only the last function (a stale early
# function could PASS; a stale last one failed everyone). Every function
# is now compared on its own — its source and its bundled `_shared/` —
# by supabase/verification/assert-edge-function-parity.py, which checks
# itself (`--selftest`) before it is trusted.

name: Edge function parity (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-function-parity
  cancel-in-progress: false

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      OUT: parity-evidence
      # push-dispatch reports MISSING_DEPLOYED (FAIL) until its first approved
      # deploy: a function the repository ships and production lacks is drift.
      SLUGS: "Scan-passport send-pilgrim-push season-admin user-admin pilgrim-doc whatsapp-send push-dispatch"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: toolchain and a snapshot of the repository copy"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          cp -r supabase/functions "$RUNNER_TEMP/repo-functions"
          find "$RUNNER_TEMP/repo-functions" -type f | sort | while read -r f; do
            printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "${f#"$RUNNER_TEMP/repo-functions/"}"
          done | tee "$OUT/repo-files.sha256"
          echo "repository files: $(wc -l < "$OUT/repo-files.sha256")"
          python3 -I supabase/verification/assert-edge-function-parity.py --selftest

      - name: "Download the deployed source for every function"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          DEPLOYED="$RUNNER_TEMP/deployed"
          mkdir -p "$DEPLOYED"
          for s in $SLUGS; do
            echo "── $s"
            # a clean, empty target for THIS function only
            rm -rf supabase/functions
            mkdir -p supabase/functions
            if ! npm run --silent supabase -- functions download "$s" \
                 --project-ref "$PROJECT_REF" --use-api > "$OUT/download-$s.log" 2>&1; then
              echo "::error::download failed for $s"
              sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g' "$OUT/download-$s.log"
              exit 1
            fi
            # moved aside before the next download can write to the same _shared/
            mv supabase/functions "$DEPLOYED/$s"
            find "$DEPLOYED/$s" -type f | sort | while read -r f; do
              printf '%s  %s\n' "$(sha256sum "$f" | cut -d' ' -f1)" "$s:${f#"$DEPLOYED/$s/"}"
            done
          done | tee "$OUT/deployed-files.sha256"
          mkdir -p supabase/functions

      - name: "Compare each function on its own: source and bundled _shared"
        run: |
          set -euo pipefail
          # Per function, the files its bundle should hold are exactly the
          # repository files reachable from <slug>/index.ts through relative
          # imports. Missing, extra and modified files are named, separately
          # for the function source and for its own _shared/ copy.
          if python3 -I supabase/verification/assert-edge-function-parity.py \
               "$RUNNER_TEMP/repo-functions" "$RUNNER_TEMP/deployed" $SLUGS > "$OUT/parity.txt"; then
            cat "$OUT/parity.txt"; echo PASS > "$OUT/verdict.txt"
            echo "Every deployed function — source and bundled _shared — matches the repository, byte for byte."
          else
            cat "$OUT/parity.txt"; echo FAIL > "$OUT/verdict.txt"
            grep -E '^\S+ \[(function|shared)\] ' "$OUT/parity.txt" | while read -r l; do echo "::error::$l"; done
            echo "::error::parity FAILED"; exit 1
          fi

      - name: "Scan evidence for secret-like material"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|postgres(ql)?://[^ ]*:[^ ]*@" "$OUT"; then
            echo "::error::secret-like material found in the evidence - upload blocked"; exit 1
          fi
          echo "Evidence secret scan clean."

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-function-parity
          path: parity-evidence
          if-no-files-found: error
