# ════════════════════════════════════════════════════════════
# Checkpoint 5 — V1 baseline reproducibility proof
# ════════════════════════════════════════════════════════════
# READ-ONLY against the remote Supabase project. There is no
# authorized remote-mutation command in this workflow, and none is
# present: no db push, no migration up, no migration repair, no
# db reset --linked, no remote DDL/DML.
#
# Remote read-only is enforced by the SERVER, not by discipline:
# every remote psql session sets default_transaction_read_only=on,
# so a mistaken write is rejected with SQLSTATE 25006.
#
# Manual trigger only. Never on push, pull_request or schedule.

name: Checkpoint 5 - Ledger Cutover Proof (read-only remote)

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Supabase project ref (NOT a secret - public identifier)"
        required: true
        default: "zkucwcnclbfvukhdqhgc"
      db_host:
        description: "DB host from dashboard > Connect. Use the IPv4-compatible Session pooler host if direct is IPv6-only. NOT a secret."
        required: true
      db_port:
        description: "DB port (5432 direct, commonly 5432 for session pooler)"
        required: true
        default: "5432"
      db_user:
        description: "DB user from dashboard > Connect (e.g. postgres, or postgres.<ref> for the pooler). NOT a secret."
        required: true
        default: "postgres"

# Minimum permissions. Read only: this workflow never pushes a commit.
# Proof artifacts leave via actions/upload-artifact, not via git.
permissions:
  contents: read

concurrency:
  group: checkpoint4-baseline-proof
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # ⚠️ PGOPTIONS is deliberately ABSENT from this block.
      #
      # Run #3 failed because "-c default_transaction_read_only=on" lived
      # here, so every step inherited it - including `supabase start`,
      # whose own connection to the LOCAL database then could not create
      # its seed table:
      #
      #   failed to create seed table: ERROR: cannot execute CREATE SCHEMA
      #   in a read-only transaction (SQLSTATE 25006)
      #
      # The local psql calls were already guarded with `PGOPTIONS=`, but
      # the CLI invocation was not. The setting was also useless where it
      # was aimed: the pooler drops the "options" startup parameter, which
      # is why PR #130 moved remote read-only in band. So it protected
      # nothing remotely and broke everything locally. It is gone, and
      # remote read-only is enforced solely by the in-band SET plus the
      # SQLSTATE 25006 positive control - unchanged and still fail-closed.
      #
      # The database password is NOT here either. It is granted per step,
      # to remote steps only, so no local reconstruction step can reach
      # the remote database even by accident.
      #
      # SUPABASE_ACCESS_TOKEN stays job-level: several CLI subcommands
      # expect it, and it is a management API token that cannot execute
      # SQL against the database.
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ inputs.project_ref }}
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}
      OUT: proof-output

    steps:
      # ── 0) Fail closed if either secret is missing ──────────
      - name: Require secrets
        shell: bash
        env:
          # Same secret, two consumers: the CLI reads SUPABASE_DB_PASSWORD,
          # psql reads PGPASSWORD. By environment, never on a command line.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; missing=1; }
          [ -n "${PGPASSWORD:-}" ]            || { echo "::error::SUPABASE_DB_PASSWORD is not set"; missing=1; }
          [ "$missing" -eq 0 ] || exit 1
          echo "Both required secrets are present (values not printed)."

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          docker version --format '{{.Server.Version}}'
          v="$(npm run --silent supabase -- --version)"
          echo "supabase CLI: $v"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          psql --version
          # 37 historical migrations must be present and untouched.
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 37 ] || { echo "::error::expected 37 historical migrations, found $n"; exit 1; }
          echo "$n historical migrations present."

      # ── Prove the comparators before trusting them ─────────
      # Runs before anything touches a database, costs seconds, and
      # needs no credentials. A comparator that cannot fail is not a
      # control, and Run #5 shipped exactly that: `diff ... || true`,
      # which recorded 780 and 624 differing lines and reported
      # success. These fixtures assert both directions - identical
      # content in a different order must PASS, and each way the
      # security model can be broken must FAIL.
      - name: Self-test the Level 1 and Level 2 comparators
        shell: bash
        run: bash supabase/baseline-candidate/tools/selftest-comparators.sh

      # ── STAGE B) read-only remote capture ──────────────────
      - name: Link project (read-only use)
        shell: bash
        env:
          # Same secret, two consumers: the CLI reads SUPABASE_DB_PASSWORD,
          # psql reads PGPASSWORD. By environment, never on a command line.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # No --skip-pooler: the CLI links through the POOLER by
          # default, which is IPv4-compatible. That is what makes the
          # CLI steps work on a GitHub-hosted runner, where a direct
          # IPv6-only db.<ref>.supabase.co host would be unreachable.
          npm run --silent supabase -- link --project-ref "$PROJECT_REF" >/dev/null
          echo "Linked via pooler. supabase/.temp is gitignored and is never committed."

      # ── Connectivity preflight — fail closed, never guess ──
      # Runs BEFORE the read-only positive control and before any
      # capture. It opens a TCP socket and nothing more: no
      # authentication, no query, no mutation. Its only job is to tell
      # "the endpoint is unreachable" apart from "read-only
      # enforcement is broken", which are very different findings.
      #
      # Supabase direct hosts are IPv6-only unless the project holds
      # the IPv4 add-on, and GitHub-hosted runners egress over IPv4.
      # So this WILL fail on a direct host from a runner, and it must
      # fail loudly rather than be worked around.
      - name: Connectivity preflight
        shell: bash
        run: |
          set -euo pipefail
          echo "Endpoint under test: ${DB_HOST}:${DB_PORT}"

          # Both failure modes - unresolvable and unreachable - are
          # "the endpoint does not work", so both must give the same
          # actionable guidance. Emitting it from one place keeps them
          # from drifting apart.
          hint_and_die() {
            cat <<'HINT'
          The proof cannot continue, and this workflow will NOT fall back
          to another endpoint on its own.

          If the resolved address is IPv6-only, a GitHub-hosted runner
          cannot reach it. Re-dispatch with the SESSION POOLER values,
          copied verbatim from:

              Supabase Dashboard -> Connect -> Session pooler

          Supply them as the db_host, db_port and db_user inputs. Use the
          SESSION pooler, not the Transaction pooler: this proof relies on
          a session-level setting (default_transaction_read_only) and on
          pg_dump holding a stable session, and transaction-mode pooling
          does not reliably preserve either.

          These three values are NOT secrets. Do not put them in a secret,
          and do not paste the database password anywhere.
          HINT
            exit 1
          }

          if ! getent ahosts "$DB_HOST" > /tmp/preflight-dns.txt 2>/dev/null \
               || [ ! -s /tmp/preflight-dns.txt ]; then
            echo "::error::DNS resolution failed for ${DB_HOST}"
            hint_and_die
          fi
          v4="$(awk '{print $1}' /tmp/preflight-dns.txt | grep -c '\.' || true)"
          v6="$(awk '{print $1}' /tmp/preflight-dns.txt | grep -c ':'  || true)"
          echo "Resolved address families: IPv4=${v4} IPv6=${v6}"

          # Pure-bash TCP open/close. No credentials are involved: the
          # password is never referenced in this step at all.
          if timeout 15 bash -c "exec 3<>/dev/tcp/${DB_HOST}/${DB_PORT}" 2>/dev/null; then
            echo "TCP connect to ${DB_HOST}:${DB_PORT} succeeded."
            exit 0
          fi

          echo "::error::Cannot reach ${DB_HOST}:${DB_PORT} from this runner (IPv4=${v4} IPv6=${v6})."
          hint_and_die

      # ── Positive control — rewritten after Run #1 ──────────
      # Run #1 used CREATE TEMPORARY TABLE and the server accepted it.
      # That was NOT a temp-table exemption: PostgreSQL rejects CREATE
      # TEMPORARY TABLE in a read-only transaction just like any other
      # CREATE (the documented exemption is writing to an ALREADY
      # EXISTING temp table). So the acceptance meant the session was
      # genuinely writable - PGOPTIONS does not survive the pooler,
      # which does not forward the "options" startup parameter.
      #
      # The fix does not argue with the pooler: read-only is now set
      # IN BAND with ordinary SQL, which always reaches the server.
      #
      # The control is safe even in the case it exists to detect. The
      # write runs inside a plain BEGIN, which inherits the session
      # default, and ends in ROLLBACK. If read-only is active the
      # statement is refused with SQLSTATE 25006; if it is not, the
      # statement succeeds and is then discarded, so nothing persists
      # either way - and rc == 0 makes the workflow fail closed.
      - name: Prove the remote session is read-only
        shell: bash
        env:
          # Same secret, two consumers: the CLI reads SUPABASE_DB_PASSWORD,
          # psql reads PGPASSWORD. By environment, never on a command line.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"

          # (a) Observe what the session arrives with, for diagnosis.
          psql "$URL" -X -q -At \
            -c "select 'arrived: default_transaction_read_only=' || current_setting('default_transaction_read_only')" \
            | tee "$OUT/readonly-session.txt"

          # (b) Force read-only in band, then read it back.
          got="$(psql "$URL" -X -q -At -c "$RO" \
                   -c "select current_setting('default_transaction_read_only')")"
          echo "after in-band SET: default_transaction_read_only=${got}" | tee -a "$OUT/readonly-session.txt"
          [ "$got" = "on" ] || {
            echo "::error::could not put the session into read-only mode (got '${got}')"; exit 1; }

          # (c) Attempt a PERSISTENT write that read-only must refuse.
          set +e
          err="$(psql "$URL" -X -v VERBOSITY=verbose -At \
                   -c "$RO" \
                   -c "begin; create table _cp4_readonly_probe(i int); rollback;" 2>&1 >/dev/null)"
          rc=$?
          set -e
          printf '%s\n' "$err" > "$OUT/readonly-control.txt"

          if [ "$rc" -eq 0 ]; then
            echo "::error::the server ACCEPTED a persistent write - read-only enforcement is NOT active"
            exit 1
          fi
          grep -q '25006' "$OUT/readonly-control.txt" || {
            echo "::error::the write was refused, but not with SQLSTATE 25006 (read_only_sql_transaction):"
            cat "$OUT/readonly-control.txt"
            exit 1; }
          echo "Confirmed: a persistent write is refused with SQLSTATE 25006."

      - name: Capture live fingerprint (Level 2 reference)
        shell: bash
        env:
          # Same secret, two consumers: the CLI reads SUPABASE_DB_PASSWORD,
          # psql reads PGPASSWORD. By environment, never on a command line.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          # -c "$RO" puts the session in read-only IN BAND, because
          # PGOPTIONS does not survive the pooler. -q suppresses the
          # SET tag and the \pset notices, which would otherwise land
          # in the fingerprint and break the comparison.
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/live-fingerprint.txt"
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -c "$RO" -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/live-fingerprint.txt"
          wc -l "$OUT/live-fingerprint.txt"

      - name: Capture storage + default privileges as SQL
        shell: bash
        env:
          # Same secret, two consumers: the CLI reads SUPABASE_DB_PASSWORD,
          # psql reads PGPASSWORD. By environment, never on a command line.
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # db dump --schema public does NOT emit these, and they are
          # application-owned. Generated from the live catalog, never
          # reconstructed from memory.
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          # -q matters doubly here: without it psql writes "Output
          # format is unaligned." into this file, and the file is
          # concatenated into the candidate baseline, where such a line
          # is not valid SQL.
          psql "$URL" -X -q -v ON_ERROR_STOP=1 -At -c "$RO" \
            -f supabase/baseline-candidate/tools/emit-storage-and-defacl.sql \
            > "$OUT/storage-and-defacl.sql"
          grep -c . "$OUT/storage-and-defacl.sql"

          # ── Qualification guard ────────────────────────────
          # Run #4 died here in effect, not in pg_dump: the emitter
          # rendered a storage policy as has_permission('...') because
          # `public` was on its search_path, while the candidate is
          # applied under the empty search_path pg_dump sets. The
          # emitter now renders under search_path = '' so every name
          # comes out qualified. This proves that held, by listing the
          # project's own function names and rejecting any call to one
          # of them that is not preceded by a schema.
          psql "$URL" -X -q -At -c "$RO" \
            -c "select proname from pg_catalog.pg_proc
                 where pronamespace = 'public'::regnamespace and prokind = 'f'" \
            > /tmp/public-function-names.txt
          unqualified=0
          while IFS= read -r fn; do
            [ -n "$fn" ] || continue
            if grep -Pn "(?<!\.)\b${fn}\s*\(" "$OUT/storage-and-defacl.sql" >/dev/null 2>&1; then
              echo "::error::emitted storage SQL calls ${fn}() without a schema - it will not resolve under search_path = ''"
              grep -Pn "(?<!\.)\b${fn}\s*\(" "$OUT/storage-and-defacl.sql" | head -3
              unqualified=1
            fi
          done < /tmp/public-function-names.txt
          [ "$unqualified" -eq 0 ] || exit 1
          echo "Every project-function reference in the emitted storage SQL is schema-qualified."

      # ── STAGE C) assemble the proposed migration tree ──────
      # In the RUNNER ONLY. The repository's active supabase/migrations
      # is never modified on a branch or on main by this workflow; the
      # 37 historical files are moved aside and restored, exactly as
      # Checkpoint 4 did, and the restore step verifies them.
      - name: Assemble the cutover candidate (runner only)
        shell: bash
        run: |
          set -euo pipefail
          python3 supabase/cutover-candidate/tools/verify-cutover.py .
          mv supabase/migrations supabase/_migrations_held_aside
          bash supabase/cutover-candidate/tools/assemble-cutover.sh supabase/migrations
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 47 ] || { echo "::error::expected 47 migrations (46 anchors + baseline), found $n"; exit 1; }
          ls supabase/migrations | head -3; echo "..."; ls supabase/migrations | tail -1
          # The baseline migration must be the proven artifact, byte for byte.
          got="$(sha256sum supabase/migrations/20260922120000_v1_baseline.sql | cut -d' ' -f1)"
          [ "$got" = "80fbdb11640b4695a184f62a50573e47efc2c2a0dcc69abacce3cccf3a4e6350" ] || {
            echo "::error::assembled baseline is not the proven baseline"; exit 1; }
          echo "Cutover tree assembled: 46 anchors + the proven V1 baseline."

      # ── STAGE D) fresh PostgreSQL 17 build via the CLI ─────
      # This is the point of Checkpoint 5: the rebuild is driven by the
      # Supabase CLI applying anchors then baseline, not by psql. If the
      # anchors misbehave, this is where it shows.
      - name: Start local stack (CLI applies anchors then baseline)
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent supabase -- start

      - name: Assert PostgreSQL 17 and capture the CLI's view of history
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          num="$(psql "$L" -X -At -c "select current_setting('server_version_num')")"
          [ "$num" -ge 170000 ] && [ "$num" -lt 180000 ] || {
            echo "::error::local PostgreSQL is not major version 17"; exit 1; }
          npm run --silent supabase -- migration list --local | tee "$OUT/migration-list-local.txt"
          applied="$(psql "$L" -X -q -At -c "select count(*) from supabase_migrations.schema_migrations")"
          echo "local ledger rows after the CLI rebuild: $applied"
          [ "$applied" -eq 47 ] || { echo "::error::expected 47 local ledger rows, found $applied"; exit 1; }
          psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/fresh1-fingerprint.txt"
          psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/fresh1-fingerprint.txt"

      - name: Level 1 - structural (live dump vs CLI-rebuilt dump)
        shell: bash
        run: |
          set -euo pipefail
          npm run --silent supabase -- db dump --local --schema public --keep-comments -f "$OUT/fresh1_public.sql"
          rc=0
          python3 supabase/baseline-candidate/tools/compare-structural.py \
            "$OUT/v1_baseline_public.sql" "$OUT/fresh1_public.sql" \
            | tee "$OUT/level1-report.txt" || rc=$?
          if [ "$rc" -eq 0 ]; then echo PASS > "$OUT/status-level1.txt"; else echo FAIL > "$OUT/status-level1.txt"; fi
          echo "Level 1 verdict: $(cat "$OUT/status-level1.txt")"

      - name: Level 2 - security fingerprint (mandatory)
        shell: bash
        run: |
          set -euo pipefail
          rc=0
          python3 supabase/baseline-candidate/tools/compare-fingerprints.py \
            "$OUT/live-fingerprint.txt" "$OUT/fresh1-fingerprint.txt" \
            --label "Level 2" \
            --allowlist supabase/baseline-candidate/tools/level2-allowlist.txt \
            | tee "$OUT/level2-report.txt" || rc=$?
          if [ "$rc" -eq 0 ]; then echo PASS > "$OUT/status-level2.txt"; else echo FAIL > "$OUT/status-level2.txt"; fi
          echo "Level 2 verdict: $(cat "$OUT/status-level2.txt")"

      - name: Compatibility probes
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          rc=0
          psql "$L" -f supabase/baseline-candidate/tools/compat-probes.sql > "$OUT/compat-probes.txt" 2>&1 || rc=$?
          echo "--- compat-probes.txt (psql exit $rc) ---"; cat "$OUT/compat-probes.txt"; echo "--- end ---"
          if [ "$rc" -eq 0 ] && grep -q 'ALL COMPATIBILITY PROBES PASSED' "$OUT/compat-probes.txt"; then
            echo PASS > "$OUT/status-probes.txt"; else echo FAIL > "$OUT/status-probes.txt"; fi
          echo "Compatibility probes verdict: $(cat "$OUT/status-probes.txt")"

      - name: db reset, rebuild #2, determinism
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          # db reset is LOCAL ONLY - it recreates the local container's
          # database and replays supabase/migrations. It never touches a
          # remote project, and --linked is deliberately not used.
          npm run --silent supabase -- db reset
          psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint.sql  > "$OUT/fresh2-fingerprint.txt"
          psql "$L" -X -q -v ON_ERROR_STOP=1 -f supabase/baseline-candidate/tools/fingerprint-storage.sql >> "$OUT/fresh2-fingerprint.txt"
          rc=0
          python3 supabase/baseline-candidate/tools/compare-fingerprints.py \
            "$OUT/fresh1-fingerprint.txt" "$OUT/fresh2-fingerprint.txt" \
            --label "Determinism (build #1 vs db reset)" \
            | tee "$OUT/determinism-report.txt" || rc=$?
          if [ "$rc" -eq 0 ]; then echo PASS > "$OUT/status-determinism.txt"; else echo FAIL > "$OUT/status-determinism.txt"; fi
          echo "Determinism verdict: $(cat "$OUT/status-determinism.txt")"

      # ── STAGE E) rehearse the live reconciliation, LOCALLY ─
      # A throwaway database seeded with the EXACT 46 captured remote
      # ledger rows. The one reconciliation command is rehearsed against
      # it and nothing else. The remote project is never addressed.
      - name: Rehearse the reconciliation against a simulated ledger
        shell: bash
        run: |
          set -euo pipefail
          L="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          SIM="postgresql://postgres:postgres@127.0.0.1:54322/cp5_sim"
          psql "$L" -X -q -v ON_ERROR_STOP=1 -c "drop database if exists cp5_sim" -c "create database cp5_sim"
          python3 supabase/cutover-candidate/tools/seed-simulated-ledger.py . > "$OUT/seed-ledger.sql"
          psql "$SIM" -X -q -v ON_ERROR_STOP=1 -f "$OUT/seed-ledger.sql"

          before="$(psql "$SIM" -X -q -At -c "select md5(string_agg(version||'|'||coalesce(name,'')||'|'||coalesce(md5(array_to_string(statements,E'\n')),'N'),E'\n' order by version)) from supabase_migrations.schema_migrations")"
          objs_before="$(psql "$SIM" -X -q -At -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not in ('pg_catalog','information_schema','pg_toast','supabase_migrations')")"
          rows_before="$(psql "$SIM" -X -q -At -c "select count(*) from supabase_migrations.schema_migrations")"

          npm run --silent supabase -- db push --dry-run --db-url "$SIM" | tee "$OUT/sim-dryrun-before.txt"
          npm run --silent supabase -- migration repair --status applied 20260922120000 --db-url "$SIM" 2>&1 | tee "$OUT/sim-repair.txt"
          npm run --silent supabase -- db push --dry-run --db-url "$SIM" | tee "$OUT/sim-dryrun-after.txt"

          after="$(psql "$SIM" -X -q -At -c "select md5(string_agg(version||'|'||coalesce(name,'')||'|'||coalesce(md5(array_to_string(statements,E'\n')),'N'),E'\n' order by version)) from supabase_migrations.schema_migrations where version <> '20260922120000'")"
          objs_after="$(psql "$SIM" -X -q -At -c "select count(*) from pg_class c join pg_namespace n on n.oid=c.relnamespace where n.nspname not in ('pg_catalog','information_schema','pg_toast','supabase_migrations')")"
          rows_after="$(psql "$SIM" -X -q -At -c "select count(*) from supabase_migrations.schema_migrations")"

          ok=1
          [ "$before" = "$after" ] || { echo "::error::the 46 pre-existing ledger rows were modified"; ok=0; }
          [ "$objs_before" -eq "$objs_after" ] || { echo "::error::the repair created or dropped schema objects ($objs_before -> $objs_after)"; ok=0; }
          [ "$rows_before" -eq 46 ] && [ "$rows_after" -eq 47 ] || { echo "::error::ledger rows went $rows_before -> $rows_after, expected 46 -> 47"; ok=0; }
          grep -q '"upToDate":true' "$OUT/sim-dryrun-after.txt" || { echo "::error::migrations still pending after the reconciliation"; ok=0; }
          grep -q '20260922120000_v1_baseline.sql' "$OUT/sim-dryrun-before.txt" || { echo "::error::the baseline was not the single pending migration before the reconciliation"; ok=0; }
          if [ "$ok" -eq 1 ]; then echo PASS > "$OUT/status-reconcile.txt"; else echo FAIL > "$OUT/status-reconcile.txt"; fi
          echo "Reconciliation rehearsal verdict: $(cat "$OUT/status-reconcile.txt")"
          echo "  ledger rows $rows_before -> $rows_after | schema objects $objs_before -> $objs_after | pre-existing rows unchanged: $([ "$before" = "$after" ] && echo yes || echo NO)"

      - name: Cutover verdict (fails the run)
        shell: bash
        run: |
          set -euo pipefail
          bad=0
          for k in level1 level2 probes determinism reconcile; do
            f="$OUT/status-$k.txt"
            if [ ! -s "$f" ]; then echo "::error::no verdict recorded for $k"; bad=1; continue; fi
            v="$(cat "$f")"; printf '%-14s %s\n' "$k" "$v"; [ "$v" = "PASS" ] || bad=1
          done
          [ "$bad" -eq 0 ] || { echo "::error::Checkpoint 5 cutover is NOT proven"; exit 1; }
          echo "All five cutover proof surfaces PASS."

      - name: Restore historical migrations and verify untouched
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -d supabase/_migrations_held_aside ]; then
            rm -rf supabase/migrations
            mv supabase/_migrations_held_aside supabase/migrations
          fi
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq 37 ] || { echo "::error::historical migrations not intact: $n"; exit 1; }
          git diff --quiet -- supabase/migrations || { echo "::error::historical migrations modified"; exit 1; }
          echo "37 historical migrations intact and unmodified."

      - name: Scan artifacts for secret-like material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          { echo "run_id=${GITHUB_RUN_ID:-?} commit=${GITHUB_SHA:-?}"; echo "files:"; ls -la "$OUT" || true; } > "$OUT/run-summary.txt"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|SCRAM-SHA-256\\\$|md5[0-9a-f]{32}|PASSWORD '" "$OUT"; then
            echo "::error::secret-like material found in proof artifacts - upload blocked"; exit 1
          fi
          echo "Artifact secret scan clean."

      - name: Upload proof artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint5-proof
          path: proof-output
          if-no-files-found: error
