# ════════════════════════════════════════════════════════════
# canonical production db push — M5 scheduled push dispatch (20261020153000)
# ════════════════════════════════════════════════════════════
# Applies the ONE pending migration through the canonical CLI path
# (on the pattern of m6-push-delivery-canonical-push.yml):
#   20261020153000_m5_scheduled_push_dispatch
#
# Playbook order (M-52): run only AFTER the M5 PR 1 is merged, from main.
# It is INACTIVE infrastructure: no extension is installed (no pg_cron,
# no pg_net), no job is scheduled, nothing calls push_dispatch_tick().
# Activation is a separate migration (PR 2) with a separate approval.
#
# ⚠️ `--db-url`, not `--linked` (PR #148).
#
# Exactly ONE production-mutating command may run, and only after
# every gate passes. Deliberately absent, and audited for: migration
# repair · migration up · `--include-all` · manual SQL mutation ·
# rollback · baseline execution · any operation on a historical
# migration · any Dashboard action · any Edge Function deploy · any
# call to push_dispatch_tick() or push_dispatch_probe() · any Vault write.
#
# The migration is additive: one single-row table (RLS on, no policy,
# no API role grant), three service_role RPCs and five owner-only
# functions. The only row written is that table's own seed. Gates:
#   · BEFORE: file hash · pending set is exactly this migration · none of
#     the new objects exist · M6 RPCs present · max(announcements.id)
#     (the cutoff it must record), extensions, table/index inventory,
#     every public function ACL and row fingerprints captured.
#   · AFTER (independent catalog queries, M-54/M-55): ledger 71, originals
#     untouched · table, RLS, no policy, no API grant, one row whose
#     cutoff_id equals the captured max and holds no lease · RPC
#     EXECUTE held by exactly postgres + service_role · tick/probe and
#     helpers by postgres only · every other function ACL unchanged ·
#     tables/indexes = before + exactly the new ones · extensions
#     unchanged, no cron schema added · no existing row changed.
#   · Nothing is sent to any device or any URL.
#
# Running it twice is safe: after success nothing is pending, so the
# BEFORE gates fail and the second run stops before the write.

name: M5 push dispatch - canonical production db push (ONE authorized write)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PUSH-M5-20261020153000 to authorize the single production write"
        required: true
        default: ""
      db_host:
        description: "Session pooler host from dashboard > Connect (NOT a secret)"
        required: true
        default: "aws-1-eu-central-1.pooler.supabase.com"
      db_port:
        description: "Session pooler port (NOT a secret)"
        required: true
        default: "5432"
      db_user:
        description: "Session pooler user (NOT a secret)"
        required: true
        default: "postgres.zkucwcnclbfvukhdqhgc"

permissions:
  contents: read

concurrency:
  group: m5-push-dispatch-canonical-push
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      M5: "20261020153000"
      F5: supabase/migrations/20261020153000_m5_scheduled_push_dispatch.sql
      SHA5: "d02de1a7fd789ba0f4d773cfd71738fef13afad25acf3274337e5cf63af737f8"
      EXPECT_REPO_MIGRATIONS: "71"
      EXPECT_ROWS_BEFORE: "70"
      EXPECT_LATEST_BEFORE: "20261019135129"
      EXPECT_ROWS_AFTER: "71"
      NEW_TABLE: "public.push_dispatch_state"
      NEW_INDEXES: "public.push_dispatch_state_pkey"
      RPCS: "push_due_announcements(integer) push_dispatch_begin(uuid) push_dispatch_end(uuid,jsonb)"
      OWNER_ONLY: "push_dispatch_tick() push_dispatch_probe() _push_due_ids(integer) _push_dispatch_target() _push_dispatch_state_guard()"
      M6_RPCS: "push_prepare_announcement(bigint) push_claim_targets(bigint,uuid,integer,integer) push_complete_target(bigint,uuid,integer,text,integer,text) push_delivery_summary(bigint)"
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}
      OUT: m5-push-dispatch-evidence

    steps:
      - name: "GATE: confirmation, ref and secrets"
        # the input reaches the shell as data (env), never as script text
        env:
          CONFIRM: ${{ inputs.confirm }}
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ "${CONFIRM}" = "PUSH-M5-20261020153000" ] || {
            echo "::error::confirmation string does not match - dispatch was not authorized"; exit 1; }
          # M-52: apply after merge, never before
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::must run from main (M-52), got ${GITHUB_REF}"; exit 1; }
          [ -n "${PGPASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD is not set"; exit 1; }
          echo "Authorized. Secret present (value not printed)."

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: toolchain and the exact migration under review"
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is not available"; exit 1; }
          n="$(ls supabase/migrations/*.sql | wc -l)"
          [ "$n" -eq "$EXPECT_REPO_MIGRATIONS" ] || { echo "::error::expected $EXPECT_REPO_MIGRATIONS repository migrations, found $n"; exit 1; }
          git diff --quiet -- supabase/migrations || { echo "::error::supabase/migrations is dirty"; exit 1; }
          [ -f "$F5" ] || { echo "::error::$F5 missing"; exit 1; }
          got="$(sha256sum "$F5" | cut -d' ' -f1)"
          [ "$got" = "$SHA5" ] || { echo "::error::$F5 sha256 mismatch: $got != $SHA5"; exit 1; }
          echo "ok   $(basename "$F5")  $got"
          # the migration itself installs nothing and schedules nothing
          if grep -niE "^\s*(create|alter)\s+extension|cron\.schedule" "$F5"; then
            echo "::error::$F5 installs an extension or schedules a job"; exit 1; fi
          # the scheduler's credential is the scoped token, never a Supabase API key in pg_net's queue
          if grep -nE "'(apikey|Authorization)'" "$F5"; then
            echo "::error::$F5 sends a Supabase API key header through pg_net"; exit 1; fi
          python3 supabase/verification/assert-no-toplevel-data-writes.py --selftest
          python3 supabase/verification/assert-no-toplevel-data-writes.py "$F5"
          python3 supabase/verification/assert-ledger-correspondence.py --selftest
          { echo "commit=${GITHUB_SHA}"; echo "ref=${GITHUB_REF}"; echo "cli=$v"; } | tee "$OUT/run-sha.txt"

      - name: "GATE: ledger BEFORE = 70 / 20261019135129"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          Q="select version || E'\t' || coalesce(name,'') || E'\t'
                  || coalesce(encode(sha256(convert_to(statements[1],'UTF8')),'hex'),'NULL')
               from supabase_migrations.schema_migrations order by version"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$Q" > "$OUT/ledger-before.tsv"
          rows="$(wc -l < "$OUT/ledger-before.tsv")"
          latest="$(psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          echo "rows=$rows latest=$latest" | tee "$OUT/ledger-before.txt"
          [ "$rows" -eq "$EXPECT_ROWS_BEFORE" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS_BEFORE"; exit 1; }
          [ "$latest" = "$EXPECT_LATEST_BEFORE" ] || { echo "::error::latest is $latest, expected $EXPECT_LATEST_BEFORE"; exit 1; }
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" \
            -c "select version from supabase_migrations.schema_migrations order by version" > "$OUT/ledger-versions-before.txt"

      - name: "GATE: pending set is exactly 20261020153000"
        run: |
          set -euo pipefail
          python3 supabase/verification/assert-ledger-correspondence.py \
            supabase/migrations "$OUT/ledger-versions-before.txt" \
            "$EXPECT_ROWS_BEFORE" "$EXPECT_LATEST_BEFORE" > "$OUT/correspondence-before.txt" 2>&1 || true
          cat "$OUT/correspondence-before.txt"
          grep -q "repository versions absent from production: \['${M5}'\]" "$OUT/correspondence-before.txt" || {
            echo "::error::the pending set is not exactly [$M5]"; exit 1; }
          grep -q "ok   no unexpected production migration" "$OUT/correspondence-before.txt" || {
            echo "::error::production carries a migration the repository does not"; exit 1; }

      - name: "GATE: production preconditions"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1"; }
          bad=0
          t="$(p "select count(*) from pg_class where oid = to_regclass('$NEW_TABLE')")"
          [ "$t" -eq 0 ] || { echo "::error::$NEW_TABLE already exists"; bad=1; }
          for fn in $RPCS $OWNER_ONLY; do
            e="$(p "select count(*) from pg_proc where oid = to_regprocedure('public.$fn')")"
            [ "$e" -eq 0 ] || { echo "::error::public.$fn already exists"; bad=1; }
          done
          for dep in $M6_RPCS "active_season_id()"; do
            e="$(p "select count(*) from pg_proc where oid = to_regprocedure('public.$dep')")"
            [ "$e" -eq 1 ] || { echo "::error::dependency public.$dep missing"; bad=1; }
          done
          e="$(p "select count(*) from pg_class where oid = to_regclass('public.announcement_push_targets')")"
          [ "$e" -eq 1 ] || { echo "::error::M6 announcement_push_targets missing"; bad=1; }
          # the cutoff the migration must record: the highest announcement id now
          p "select coalesce(max(id),0) from public.announcements" > "$OUT/cutoff-expected.txt"
          echo "expected cutoff_id: $(cat "$OUT/cutoff-expected.txt")"
          p "select coalesce(string_agg(extname||'='||extversion, ',' order by extname),'') from pg_extension" > "$OUT/extensions-before.txt"
          p "select count(*) from pg_namespace where nspname = 'cron'" > "$OUT/cron-schema-before.txt"
          p "select string_agg(schemaname||'.'||tablename, ',' order by schemaname, tablename) from pg_tables where schemaname in ('public','storage')" > "$OUT/tables-before.txt"
          p "select string_agg(schemaname||'.'||indexname, ',' order by schemaname, indexname) from pg_indexes where schemaname in ('public','storage')" > "$OUT/indexes-before.txt"
          p "select string_agg(p.oid::regprocedure::text || '=' || coalesce(p.proacl::text,'(default)'), E'\n' order by p.oid::regprocedure::text) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public'" > "$OUT/fn-acl-before.txt"
          # every existing function body (M6 delivery included): md5 per signature
          p "select string_agg(p.oid::regprocedure::text || '=' || md5(p.prosrc), E'\n' order by p.oid::regprocedure::text) from pg_proc p where p.pronamespace = 'public'::regnamespace" > "$OUT/fn-src-before.txt"
          # بصماتٌ بلا بيانات شخصية: معرّفاتٌ وحالاتٌ وأختام
          p "select coalesce(md5(string_agg(id||':'||announcement_id||':'||passenger_id||':'||status||':'||coalesce(read_at::text,'-'),'|' order by id)),'(none)') from public.notification_deliveries" > "$OUT/nd-fp-before.txt"
          p "select coalesce(md5(string_agg(id||':'||coalesce(push_sent_at::text,'-')||':'||coalesce(expires_at::text,'-')||':'||show_at::text,'|' order by id)),'(none)') from public.announcements" > "$OUT/ann-fp-before.txt"
          p "select coalesce(md5(string_agg(id||':'||status||':'||attempts,'|' order by id)),'(none)') from public.announcement_push_targets" > "$OUT/apt-fp-before.txt"
          p "select coalesce(md5(string_agg(id||':'||passenger_id,'|' order by id)),'(none)') from public.pilgrim_push_subscriptions" > "$OUT/subs-fp-before.txt"
          [ "$bad" -eq 0 ] || { echo "::error::preconditions failed - nothing was written"; exit 1; }
          echo "All preconditions PASS."

      # ════════════════════════════════════════════════════════
      # THE ONE AUTHORIZED PRODUCTION WRITE
      # ════════════════════════════════════════════════════════
      - name: "LIVE WRITE: canonical db push"
        id: live_push
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          DB_URL="$(python3 -c "import os,urllib.parse as u; print('postgresql://%s:%s@%s:%s/postgres' % (u.quote(os.environ['DB_USER'],safe=''), u.quote(os.environ['SUPABASE_DB_PASSWORD'],safe=''), os.environ['DB_HOST'], os.environ['DB_PORT']))")"
          echo "::add-mask::$DB_URL"
          set +e
          npm run --silent supabase -- db push --db-url "$DB_URL" --output-format json > "$OUT/push.json" 2> "$OUT/push.err"
          rc=$?
          set -e
          sed -E -i 's#postgres(ql)?://[^ ]*@#postgresql://***@#g' "$OUT/push.json" "$OUT/push.err" 2>/dev/null || true
          echo "--- stdout ---"; cat "$OUT/push.json"
          echo "--- stderr ---"; cat "$OUT/push.err"
          [ "$rc" -eq 0 ] || { echo "::error::db push failed with rc=$rc"; exit 1; }

      - name: "POST: ledger 70 -> 71, originals untouched"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          Q="select version || E'\t' || coalesce(name,'') || E'\t'
                  || coalesce(encode(sha256(convert_to(statements[1],'UTF8')),'hex'),'NULL')
               from supabase_migrations.schema_migrations order by version"
          psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$Q" > "$OUT/ledger-after.tsv"
          rows="$(wc -l < "$OUT/ledger-after.tsv")"
          latest="$(psql "$URL" -X -q -At -c "$RO" -c "select max(version) from supabase_migrations.schema_migrations")"
          echo "rows=$rows latest=$latest" | tee "$OUT/ledger-after.txt"
          bad=0
          [ "$rows" -eq "$EXPECT_ROWS_AFTER" ] || { echo "::error::ledger holds $rows rows, expected $EXPECT_ROWS_AFTER"; bad=1; }
          [ "$latest" = "$M5" ] || { echo "::error::latest is $latest, expected $M5"; bad=1; }
          nm="$(psql "$URL" -X -q -At -c "$RO" -c "select name from supabase_migrations.schema_migrations where version='$M5'")"
          [ "$nm" = "m5_scheduled_push_dispatch" ] || { echo "::error::recorded name '$nm' does not match the repository filename"; bad=1; }
          grep -vE "^$M5	" "$OUT/ledger-after.tsv" > "$OUT/ledger-after-originals.tsv"
          diff -u "$OUT/ledger-before.tsv" "$OUT/ledger-after-originals.tsv" > "$OUT/ledger-originals.diff" || {
            echo "::error::one or more original ledger rows changed"; cat "$OUT/ledger-originals.diff"; bad=1; }
          psql "$URL" -X -q -At -c "$RO" -c "select version from supabase_migrations.schema_migrations order by version" > "$OUT/ledger-versions-after.txt"
          python3 supabase/verification/assert-ledger-correspondence.py \
            supabase/migrations "$OUT/ledger-versions-after.txt" "$EXPECT_ROWS_AFTER" "$M5" \
            | tee "$OUT/correspondence-after.txt" || bad=1
          if [ "$bad" -eq 0 ]; then echo PASS > "$OUT/status-ledger.txt"; else echo FAIL > "$OUT/status-ledger.txt"; fi
          echo "Ledger verdict: $(cat "$OUT/status-ledger.txt")"

      - name: "POST: table, cutoff, RPCs, grants, inactive, and no existing row changed"
        if: always() && steps.live_push.outcome != 'skipped'
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1"; }
          bad=0
          want() { got="$(p "$2")"; if [ "$got" = "$3" ]; then printf 'ok   %-46s %s\n' "$1" "$got"
                   else echo "::error::$1 = '$got', expected '$3'"; bad=1; fi }
          T="'$NEW_TABLE'"
          holders() { echo "select coalesce(string_agg(h, ',' order by h collate \"C\"), '') from (select distinct coalesce(r.rolname,'PUBLIC') h from pg_proc p, aclexplode(p.proacl) a left join pg_roles r on r.oid = a.grantee where p.oid = to_regprocedure($1) and a.privilege_type = 'EXECUTE') s"; }
          want table_exists            "select count(*) from pg_class where oid = to_regclass($T)" 1
          want table_rls_on            "select relrowsecurity::text from pg_class where oid = to_regclass($T)" true
          want table_no_policy         "select count(*) from pg_policies where schemaname='public' and tablename='push_dispatch_state'" 0
          for r in anon authenticated service_role; do
            want "table_${r}_none"     "select has_table_privilege('$r', $T, 'SELECT,INSERT,UPDATE,DELETE,TRUNCATE')::text" false
          done
          want state_one_row           "select count(*) from public.push_dispatch_state" 1
          want state_cutoff_id         "select cutoff_id from public.push_dispatch_state" "$(cat "$OUT/cutoff-expected.txt")"
          want state_no_lease          "select (lease_run_id is null and lease_expires_at is null and not lease_started)::text from public.push_dispatch_state" true
          want state_guard_triggers    "select count(*) from pg_trigger where tgrelid = to_regclass($T) and tgname in ('trg_push_dispatch_state_guard','trg_push_dispatch_state_no_truncate') and not tgisinternal" 2
          for fn in $RPCS; do
            F="'public.$fn'"
            want "rpc ${fn%%(*} definer"       "select prosecdef::text from pg_proc where oid = to_regprocedure($F)" true
            want "rpc ${fn%%(*} search_path"   "select (proconfig @> array['search_path=public, pg_temp'])::text from pg_proc where oid = to_regprocedure($F)" true
            want "rpc ${fn%%(*} exec holders"  "$(holders "$F")" "postgres,service_role"
          done
          for fn in $OWNER_ONLY; do
            F="'public.$fn'"
            want "owner-only ${fn%%(*} exec holders" "$(holders "$F")" "postgres"
          done
          want other_fn_acls_unchanged "select string_agg(p.oid::regprocedure::text || '=' || coalesce(p.proacl::text,'(default)'), E'\n' order by p.oid::regprocedure::text) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public' and p.proname not in ('push_due_announcements','push_dispatch_begin','push_dispatch_end','push_dispatch_tick','push_dispatch_probe','_push_due_ids','_push_dispatch_target','_push_dispatch_state_guard')" "$(cat "$OUT/fn-acl-before.txt")"
          want other_fn_bodies_unchanged "select string_agg(p.oid::regprocedure::text || '=' || md5(p.prosrc), E'\n' order by p.oid::regprocedure::text) from pg_proc p where p.pronamespace = 'public'::regnamespace and p.proname not in ('push_due_announcements','push_dispatch_begin','push_dispatch_end','push_dispatch_tick','push_dispatch_probe','_push_due_ids','_push_dispatch_target','_push_dispatch_state_guard')" "$(cat "$OUT/fn-src-before.txt")"
          want tables_before_plus_new  "select string_agg(t, ',' order by t) from (select schemaname||'.'||tablename t from pg_tables where schemaname in ('public','storage')) s" \
            "$( (tr ',' '\n' < "$OUT/tables-before.txt"; echo "$NEW_TABLE") | grep -v '^$' | LC_ALL=C sort | paste -sd, )"
          want indexes_before_plus_new "select string_agg(i, ',' order by i) from (select schemaname||'.'||indexname i from pg_indexes where schemaname in ('public','storage')) s" \
            "$( (tr ',' '\n' < "$OUT/indexes-before.txt"; echo "$NEW_INDEXES" | tr ',' '\n') | grep -v '^$' | LC_ALL=C sort | paste -sd, )"
          # inactive: no extension added, no cron schema added
          want extensions_unchanged    "select coalesce(string_agg(extname||'='||extversion, ',' order by extname),'') from pg_extension" "$(cat "$OUT/extensions-before.txt")"
          want cron_schema_unchanged   "select count(*) from pg_namespace where nspname = 'cron'" "$(cat "$OUT/cron-schema-before.txt")"
          want deliveries_unchanged    "select coalesce(md5(string_agg(id||':'||announcement_id||':'||passenger_id||':'||status||':'||coalesce(read_at::text,'-'),'|' order by id)),'(none)') from public.notification_deliveries" "$(cat "$OUT/nd-fp-before.txt")"
          want announcements_unchanged "select coalesce(md5(string_agg(id||':'||coalesce(push_sent_at::text,'-')||':'||coalesce(expires_at::text,'-')||':'||show_at::text,'|' order by id)),'(none)') from public.announcements" "$(cat "$OUT/ann-fp-before.txt")"
          want targets_unchanged       "select coalesce(md5(string_agg(id||':'||status||':'||attempts,'|' order by id)),'(none)') from public.announcement_push_targets" "$(cat "$OUT/apt-fp-before.txt")"
          want subscriptions_unchanged "select coalesce(md5(string_agg(id||':'||passenger_id,'|' order by id)),'(none)') from public.pilgrim_push_subscriptions" "$(cat "$OUT/subs-fp-before.txt")"
          if [ "$bad" -eq 0 ]; then echo PASS > "$OUT/status-surface.txt"; else echo FAIL > "$OUT/status-surface.txt"; fi
          echo "Surface verdict: $(cat "$OUT/status-surface.txt")"

      - name: "Verdict (fails the run)"
        if: always() && steps.live_push.outcome != 'skipped'
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          bad=0
          for k in ledger surface; do
            f="$OUT/status-$k.txt"
            if [ ! -s "$f" ]; then printf '%-10s %s\n' "$k" "NOT REACHED"; bad=1
            else v="$(cat "$f")"; printf '%-10s %s\n' "$k" "$v"; [ "$v" = "PASS" ] || bad=1; fi
          done
          if [ "$bad" -ne 0 ]; then echo FAIL > "$OUT/verdict.txt"; exit 1; fi
          echo PASS > "$OUT/verdict.txt"
          echo "Migration $M5 applied; ledger 71; inactive: no extension, no job, no lease; no existing row changed."
          echo "NEXT (separate approvals): push-dispatch-redeploy.yml; PUSH_DISPATCH_TOKEN; then the PR 2 activation."

      - name: "Scan evidence for secret-like material"
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if grep -rlnE "eyJ[A-Za-z0-9_-]{20,}|sbp_[A-Za-z0-9]{20,}|postgres(ql)?://[^ ]*:[^ ]*@" "$OUT"; then
            echo "::error::secret-like material found in the evidence - upload blocked"; exit 1
          fi
          echo "Evidence secret scan clean."

      - name: "Upload evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m5-push-dispatch-canonical-push
          path: m5-push-dispatch-evidence
          if-no-files-found: warn
