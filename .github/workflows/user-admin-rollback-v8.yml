# ════════════════════════════════════════════════════════════
# ROLLBACK user-admin to the exact bytes of production v8
# ════════════════════════════════════════════════════════════
# Production v8 (deployed 2026-09-20, verify_jwt = true, ezbr_sha256
# bae7bf51…) bundles two files. No single commit holds both together,
# but each one is a git object on main's history; this workflow
# rebuilds the bundle from them and refuses unless every byte matches
# the SHA-256 pinned below. The pins are the hashes `functions download`
# returned for v8 in parity runs 39410185966, 39416499472 and
# 39421375222 (2026-10-20):
#
#   user-admin/index.ts      c83c3d92…  from 07820b4
#   _shared/http.ts          147f3657…  from d726b60
#
# Nothing else is needed: v8 reads the same secret names as main
# (and keeps its old CORS defaults), and touches no schema beyond what
# is live. No secret, database or config write happens here.
#
# ⚠️ ONE function, hard-coded. Deliberately absent and audited for:
# `db push` · `secrets set` · `config push` · any second slug.
# `secrets list` is used (names only) by the configuration gate.
# Shares its concurrency group with user-admin-redeploy.yml, so a
# rollback and a redeploy never run at the same time.

name: ROLLBACK user-admin to v8 (ONE function, exact bytes)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ROLLBACK-USER-ADMIN-V8 to authorize"
        required: true
        default: ""

permissions:
  contents: read

concurrency:
  group: user-admin-redeploy
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      SLUG: user-admin
      # "<commit>:<repo path>:<sha256>" — the exact v8 bundle
      V8_FILES: >-
        07820b44e18a271d3f5b0968cbc231eb5bedf8ed:supabase/functions/user-admin/index.ts:c83c3d92f71a4dd4409e7e045aa011532eaacbdafa1d6317cbe90e216618ef41
        d726b60dd3befa4d14b20f4f5f66c7f4251c4ddd:supabase/functions/_shared/http.ts:147f3657212178c7e96cbef08ff3048fbe4e010ee8c2826e41e142608bd1d1d1

    steps:
      - name: "GATE: confirmation and ref"
        # the input reaches the shell as data (env), never as script text
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "${CONFIRM}" = "ROLLBACK-USER-ADMIN-V8" ] || {
            echo "::error::confirmation string does not match"; exit 1; }
          [ "${GITHUB_REF}" = "refs/heads/main" ] || { echo "::error::must run from main, got ${GITHUB_REF}"; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: rebuild the v8 bundle, byte for byte"
        run: |
          set -euo pipefail
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          for spec in $V8_FILES; do
            c="${spec%%:*}"; rest="${spec#*:}"; f="${rest%%:*}"; want="${rest##*:}"
            # full ids only: an abbreviation can become ambiguous, a full id cannot
            [[ "$c" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::$c is not a full 40-hex commit id"; exit 1; }
            [[ "$want" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::$f pin is not a full SHA-256"; exit 1; }
            [ "$(git cat-file -t "$c" 2>/dev/null)" = "commit" ] || { echo "::error::$c is not a commit here"; exit 1; }
            git merge-base --is-ancestor "$c" HEAD || { echo "::error::$c is not on main's history"; exit 1; }
            git show "$c:$f" > "$f"
            got="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$got" = "$want" ] || { echo "::error::$f from $c sha256 $got != $want"; exit 1; }
            echo "ok   $f  $got  (from $c)"
          done
          # only those two paths differ from the checkout — nothing else rides along
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected="$(for spec in $V8_FILES; do rest="${spec#*:}"; echo "${rest%%:*}"; done | sort)"
          printf '%s\n' "$changed" | while read -r p; do
            [ -z "$p" ] || printf '%s\n' "$expected" | grep -qxF "$p" || { echo "::error::unexpected change: $p"; exit 1; }
          done
          # the bundle the CLI will build is exactly the pinned files — a file it
          # would pick up without a pin would ship main's bytes, not v8's
          python3 -I - "$SLUG" <<'PY'
          import importlib.util, os, sys
          spec = importlib.util.spec_from_file_location("p", "supabase/verification/assert-edge-function-parity.py")
          m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          got = m.expected_files("supabase/functions", sys.argv[1])
          want = {s.split(":")[1].removeprefix("supabase/functions/") for s in os.environ["V8_FILES"].split()}
          if len(want) != 2 or got != want:
              sys.exit(f"::error::bundle would be {sorted(got)}, expected {sorted(want)}")
          print("bundle:", ", ".join(sorted(got)))
          PY
          grep -A1 "^\[functions\.$SLUG\]" supabase/config.toml | grep -q "verify_jwt = true" || {
            echo "::error::config.toml no longer declares verify_jwt = true for $SLUG"; exit 1; }

      - name: "GATE: required Edge Function configuration is present on the project"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          node scripts/release/preflight-edge-config.mjs \
            --function "$SLUG" --project-ref "$PROJECT_REF"

      - name: "DEPLOY: exactly one function, v8 bytes"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "$SLUG" ] || { echo "::error::empty slug would deploy EVERY function"; exit 1; }
          npm run --silent supabase -- functions deploy "$SLUG" --project-ref "$PROJECT_REF" 2>&1 \
            | sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g'

      - name: "POST: the deployed source is the v8 bundle"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          # an empty target, so only what production returns is compared
          rm -rf supabase/functions
          mkdir -p supabase/functions
          npm run --silent supabase -- functions download "$SLUG" \
            --project-ref "$PROJECT_REF" --use-api > "$RUNNER_TEMP/download.log" 2>&1 || {
            echo "::error::download failed"; sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g' "$RUNNER_TEMP/download.log"; exit 1; }
          cd supabase/functions
          got="$(find . -type f | sed 's|^\./||' | sort)"
          want="$(for spec in $V8_FILES; do rest="${spec#*:}"; f="${rest%%:*}"; echo "${f#supabase/functions/}"; done | sort)"
          [ "$got" = "$want" ] || { echo "::error::deployed files differ:"; diff <(echo "$want") <(echo "$got") || true; exit 1; }
          for spec in $V8_FILES; do
            rest="${spec#*:}"; f="${rest%%:*}"; f="${f#supabase/functions/}"; want="${rest##*:}"
            h="$(sha256sum "$f" | cut -d' ' -f1)"
            [ "$h" = "$want" ] || { echo "::error::deployed $f sha256 $h != $want"; exit 1; }
            echo "ok   deployed $f  $h"
          done
          echo "user-admin is the exact v8 source. Check status/version/verify_jwt in the dashboard or via the API."
