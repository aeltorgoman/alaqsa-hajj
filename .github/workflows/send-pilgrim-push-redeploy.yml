# ════════════════════════════════════════════════════════════
# #32 — redeploy send-pilgrim-push, and nothing else
# ════════════════════════════════════════════════════════════
# The parity run 35997912393 found one divergence in the whole
# project: `send-pilgrim-push` lines 1 and 19 — the rules of its
# header comment — carry 62 `═` in the repository and 61 on the
# platform. 217 lines, and no executable difference at all: the
# deployed copy was built from a revision predating a one-character
# edit to a banner.
#
# The fix is to make the platform carry the reviewed source, not to
# edit the source to match the platform. The file is NOT touched by
# this workflow.
#
# ⚠️ ONE function. The slug is hard-coded, not an input: a
# `workflow_dispatch` field would let a typo redeploy something else.
# `functions deploy` with no slug deploys ALL of them, so the argument
# is mandatory here and asserted before the call.
#
# `verify_jwt` is NOT set here. It comes from `supabase/config.toml`
# (`send-pilgrim-push = true`) and stays a reviewed repository change.
# Secrets are not touched: deploying code neither reads nor rewrites
# them.
#
# Nothing about the database, the migrations, WhatsApp or any other
# function is in scope. Deliberately absent and audited for:
# `db push` · `secrets set` · `config push` · any second slug.
#
# (`secrets list` IS used, in the configuration gate below: it reads
# secret NAMES only and never a value. `secrets set` remains absent.)
#
# ── M6 (PR #248) ─────────────────────────────────────────────
# The function is now two reviewed files: `index.ts` and `delivery.ts`
# (the lease-based delivery loop it imports). BOTH are pinned by hash.
# It calls the M6 RPCs, so it is deployed only after migration
# 20261019135129 is in the production ledger — checked read-only
# (`default_transaction_read_only`) before the deploy. Without it the
# new function fails closed (500) on every send.
#
# Rollback to the pre-M6 build (v9, commit 3f815ed): dispatch THIS
# workflow on the tag `rollback/send-pilgrim-push-v9`. The workflow
# file at that tag pins that source (sha256 28b86b00…) and deploys it.

name: Redeploy send-pilgrim-push (ONE function)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type REDEPLOY-SEND-PILGRIM-PUSH to authorize"
        required: true
        default: ""
      db_host:
        description: "Session pooler host from dashboard > Connect (NOT a secret) - read-only ledger gate"
        required: true
        default: "aws-1-eu-central-1.pooler.supabase.com"
      db_port:
        description: "Session pooler port (NOT a secret)"
        required: true
        default: "5432"
      db_user:
        description: "Session pooler user (NOT a secret)"
        required: true
        default: "postgres.zkucwcnclbfvukhdqhgc"

permissions:
  contents: read

concurrency:
  group: send-pilgrim-push-redeploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PROJECT_REF: zkucwcnclbfvukhdqhgc
      SLUG: send-pilgrim-push
      SRC_SHA256: "103b940b2744aa674527bdd134047098532933a20576155cfd6fd8b81942bcf8"
      DELIVERY_SHA256: "b04f3d68606b1ec9df941f32f52d3733e0a25fbbb6fa3e595f7ed93009acfecf"
      # M6: the schema this source calls must already be in production
      REQUIRED_MIGRATION: "20261019135129"
      DB_HOST: ${{ inputs.db_host }}
      DB_PORT: ${{ inputs.db_port }}
      DB_USER: ${{ inputs.db_user }}

    steps:
      - name: "GATE: confirmation"
        # the input reaches the shell as data (env), never as script text
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          [ "${CONFIRM}" = "REDEPLOY-SEND-PILGRIM-PUSH" ] || {
            echo "::error::confirmation string does not match"; exit 1; }

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "GATE: the exact source under review, unmodified"
        run: |
          set -euo pipefail
          v="$(npm run --silent supabase -- --version)"
          [ "$v" = "2.117.0" ] || { echo "::error::expected pinned CLI 2.117.0, got $v"; exit 1; }
          f="supabase/functions/$SLUG/index.ts"
          [ -f "$f" ] || { echo "::error::$f missing"; exit 1; }
          got="$(sha256sum "$f" | cut -d' ' -f1)"
          [ "$got" = "$SRC_SHA256" ] || { echo "::error::source sha256 mismatch: $got"; exit 1; }
          d="supabase/functions/$SLUG/delivery.ts"
          [ -f "$d" ] || { echo "::error::$d missing"; exit 1; }
          dgot="$(sha256sum "$d" | cut -d' ' -f1)"
          [ "$dgot" = "$DELIVERY_SHA256" ] || { echo "::error::delivery.ts sha256 mismatch: $dgot"; exit 1; }
          # nothing else may ride along in the function directory
          extra="$(ls "supabase/functions/$SLUG" | grep -vxE 'index\.ts|delivery\.ts' || true)"
          [ -z "$extra" ] || { echo "::error::unreviewed file(s) in the function directory: $extra"; exit 1; }
          git diff --quiet || { echo "::error::working tree is dirty"; exit 1; }
          # الإعدادُ يُقرأ ولا يُكتب: الساقُ الأولى من النمط الثلاثيّ
          # تبقى من المستودع، ولا يضبطها أمرُ النشر.
          grep -A1 "^\[functions\.$SLUG\]" supabase/config.toml | grep -q "verify_jwt = true" || {
            echo "::error::config.toml no longer declares verify_jwt = true for $SLUG"; exit 1; }
          echo "commit=${GITHUB_SHA} index.ts=$got delivery.ts=$dgot"

      - name: "GATE: M6 migration is in the production ledger (read-only)"
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "${PGPASSWORD:-}" ] || { echo "::error::SUPABASE_DB_PASSWORD is not set"; exit 1; }
          command -v psql >/dev/null || { echo "::error::psql is not available"; exit 1; }
          URL="postgresql://${DB_USER}@${DB_HOST}:${DB_PORT}/postgres"
          RO="SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY"
          p() { psql "$URL" -X -q -At -v ON_ERROR_STOP=1 -c "$RO" -c "$1"; }
          [ "$(p "show default_transaction_read_only")" = "on" ] || { echo "::error::session is not read-only"; exit 1; }
          n="$(p "select count(*) from supabase_migrations.schema_migrations where version = '$REQUIRED_MIGRATION'")"
          [ "$n" -eq 1 ] || { echo "::error::migration $REQUIRED_MIGRATION is not applied - deploying would break every send"; exit 1; }
          r="$(p "select count(*) from pg_proc where oid in (to_regprocedure('public.push_prepare_announcement(bigint)'), to_regprocedure('public.push_claim_targets(bigint,uuid,integer,integer)'), to_regprocedure('public.push_complete_target(bigint,uuid,integer,text,integer,text)'), to_regprocedure('public.push_delivery_summary(bigint)'), to_regprocedure('public.push_announcement_ineligible_reason(bigint)'))")"
          [ "$r" -eq 5 ] || { echo "::error::expected the 5 M6 RPCs, found $r"; exit 1; }
          echo "ledger has $REQUIRED_MIGRATION and the 5 RPCs exist."

      # ── الساقُ الصفريّة: جاهزيةُ البيئة قبل النشر ──────────────
      # `ALLOWED_ORIGINS` و`VERCEL_PROJECT_SLUG` و`VERCEL_OWNER_SLUG`
      # و`VAPID_SUBJECT` لم يبقَ لها افتراضٌ في الشيفرة، فصارت ضبطاً
      # **إلزاميّاً** لكلّ بيئة. ونشرٌ بلا ضبطٍ يُنتج دالّةً لا يبلغها
      # متصفّح — ولا يجوز أن يُكتشف ذلك بعد النشر.
      # والأسماءُ وحدها تُقرأ (`secrets list`) كما في فحص واتساب
      # العديم الاعتماد: لا قيمةَ سرٍّ تُقرأ ولا تُطبع ولا تُقارَن.
      # وتعذُّرُ قراءة الجرد **إخفاقٌ** لا مرورٌ مفترَض.
      - name: "GATE: required Edge Function configuration is present on the project"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          node scripts/release/preflight-edge-config.mjs \
            --function "$SLUG" --project-ref "$PROJECT_REF"

      - name: "DEPLOY: exactly one function"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${SUPABASE_ACCESS_TOKEN:-}" ] || { echo "::error::SUPABASE_ACCESS_TOKEN is not set"; exit 1; }
          [ -n "$SLUG" ] || { echo "::error::empty slug would deploy EVERY function"; exit 1; }
          npm run --silent supabase -- functions deploy "$SLUG" --project-ref "$PROJECT_REF" 2>&1 \
            | sed -E 's/(sbp_[A-Za-z0-9]{6})[A-Za-z0-9]+/\1***/g'
